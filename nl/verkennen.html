<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Verkennen — Het Open Vizier</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#f6f1e6;
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --line:#d9d2c2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
  header{padding:18px 24px 8px;text-align:center}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--muted);font-style:italic;font-size:14px}
  nav{display:flex;justify-content:center;gap:18px;padding:8px 16px 0;
      border-bottom:1px solid var(--line);background:#efe7d4}
  nav a{padding:10px 14px;color:#1a1a1a;text-decoration:none;font-size:14px}
  nav a.active{background:#1a1a1a;color:#f6f1e6}
  nav a:hover:not(.active){background:#e3d8bd}

  .stage{position:relative;width:100vw;height:calc(100vh - 110px);
         overflow:hidden;display:flex;align-items:center;justify-content:center;
         cursor:default}

  svg{width:100%;height:100%;display:block}

  /* segmenten */
  .seg{cursor:pointer;transition:filter .25s ease, opacity .35s ease}
  .seg:hover{filter:brightness(1.08) drop-shadow(0 6px 18px rgba(0,0,0,.15))}
  .seg text{pointer-events:none;font-family:Georgia,serif;text-anchor:middle;
            dominant-baseline:middle;fill:#fff}

  /* binnencirkel-label */
  .center-label{pointer-events:none;font-family:Georgia,serif;text-anchor:middle;
                dominant-baseline:middle}

  /* artikel-overlay */
  .reader{position:absolute;inset:0;background:rgba(246,241,230,.97);
          display:none;align-items:center;justify-content:center;flex-direction:column;
          padding:40px;text-align:center}
  .reader.show{display:flex}
  .reader h2{margin:0 0 12px;font-size:28px}
  .reader p{margin:0 0 22px;color:var(--muted);max-width:560px;font-size:16px;line-height:1.55}
  .reader a.read{background:#1a1a1a;color:#f6f1e6;padding:12px 22px;
                 text-decoration:none;border-radius:999px;font-size:15px;letter-spacing:.4px}
  .reader button.close{margin-top:22px;background:none;border:1px solid var(--line);
                       padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;
                       color:var(--muted)}
  .reader button.close:hover{color:var(--ink);border-color:var(--ink)}

  .hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
        color:var(--muted);font-size:12px;font-style:italic;letter-spacing:.3px;
        pointer-events:none}

  @media (max-width:560px){
    header h1{font-size:22px}
    header p{font-size:12px}
    nav a{padding:8px 10px;font-size:13px}
  }
</style>
</head>
<body>

</header>
<nav>

<div class="stage" id="stage">
  <svg id="canvas" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="reader" id="reader">
    <h2 id="reader-title"></h2>
    <p id="reader-desc"></p>
    <a class="read" id="reader-link" href="#" target="_self">→ Lees het artikel</a>
    <button class="close" id="reader-close">Terug</button>
  </div>
  <div class="hint" id="hint">Klik op een segment om dieper te gaan · klik buiten de cirkel om terug te keren</div>
</div>

/* ============================================================
   STATE
   ============================================================ */
const svg = document.getElementById('canvas');
const W = 1000, H = 700, CX = W/2, CY = H/2;
const R_OUTER = 280;       // straal grote cirkel
const R_INNER = 64;        // straal label-cirkel in centrum
const path = [tree];       // stack: tree[0] = wortel "Lezer"

let gradCounter = 0;
function newGradId(){ return "grad-" + (++gradCounter); }

function clear(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }

function defGradient(id, c1, c2){
  const ns = "http://www.w3.org/2000/svg";
  const grad = document.createElementNS(ns,"radialGradient");
  grad.setAttribute("id",id);
  grad.setAttribute("cx","35%"); grad.setAttribute("cy","30%"); grad.setAttribute("r","75%");
  const s1 = document.createElementNS(ns,"stop");
  s1.setAttribute("offset","0%"); s1.setAttribute("stop-color",c1);
  const s2 = document.createElementNS(ns,"stop");
  s2.setAttribute("offset","100%"); s2.setAttribute("stop-color",c2);
  grad.appendChild(s1); grad.appendChild(s2);
  return grad;
}

/* ============================================================
   RENDER: één grote cirkel met segmenten — overal hetzelfde patroon
   ============================================================ */
function render(){
  clear();
  const ns = "http://www.w3.org/2000/svg";
  const current = path[path.length-1];
  const kids = current.children || [];
  const depth = path.length - 1;
  const n = kids.length;

  if (n === 0){
    // geen kinderen — laat alleen het centrum-label zien (zou niet moeten gebeuren)
    drawCenter(current);
    return;
  }

  // defs voor gradients
  const defs = document.createElementNS(ns,"defs");
  kids.forEach(k=>{
    const c1 = k.gradient ? k.gradient[0] : "#888";
    const c2 = k.gradient ? k.gradient[1] : "#333";
    k._gradId = newGradId();
    defs.appendChild(defGradient(k._gradId, c1, c2));
  });
  svg.appendChild(defs);

  // segmenten — start bovenaan, met de klok mee
  const startAngle = -Math.PI/2;
  kids.forEach((k,i)=>{
    const a0 = startAngle + (i * 2*Math.PI/n);
    const a1 = startAngle + ((i+1) * 2*Math.PI/n);
    const mid = (a0 + a1) / 2;

    // sector-pad (donut: van R_INNER tot R_OUTER)
    const xo0 = CX + R_OUTER * Math.cos(a0);
    const yo0 = CY + R_OUTER * Math.sin(a0);
    const xo1 = CX + R_OUTER * Math.cos(a1);
    const yo1 = CY + R_OUTER * Math.sin(a1);
    const xi0 = CX + R_INNER * Math.cos(a0);
    const yi0 = CY + R_INNER * Math.sin(a0);
    const xi1 = CX + R_INNER * Math.cos(a1);
    const yi1 = CY + R_INNER * Math.sin(a1);
    const largeArc = (a1 - a0) > Math.PI ? 1 : 0;

    // voor n==1: een hele ring (gebruik twee bogen om sluiting te vermijden)
    let d;
    if (n === 1){
      d = `M ${CX + R_OUTER} ${CY}
           A ${R_OUTER} ${R_OUTER} 0 1 1 ${CX - R_OUTER} ${CY}
           A ${R_OUTER} ${R_OUTER} 0 1 1 ${CX + R_OUTER} ${CY}
           M ${CX + R_INNER} ${CY}
           A ${R_INNER} ${R_INNER} 0 1 0 ${CX - R_INNER} ${CY}
           A ${R_INNER} ${R_INNER} 0 1 0 ${CX + R_INNER} ${CY} Z`;
    } else {
      d = `M ${xi0} ${yi0}
           L ${xo0} ${yo0}
           A ${R_OUTER} ${R_OUTER} 0 ${largeArc} 1 ${xo1} ${yo1}
           L ${xi1} ${yi1}
           A ${R_INNER} ${R_INNER} 0 ${largeArc} 0 ${xi0} ${yi0} Z`;
    }

    const g = document.createElementNS(ns,"g");
    g.setAttribute("class","seg");
    g.style.transformOrigin = `${CX}px ${CY}px`;
    g.setAttribute("transform","scale(0.001)");

    const seg = document.createElementNS(ns,"path");
    seg.setAttribute("d", d);
    seg.setAttribute("fill", "url(#"+k._gradId+")");
    seg.setAttribute("stroke", "rgba(246,241,230,0.95)");
    seg.setAttribute("stroke-width", "2.5");
    seg.setAttribute("fill-rule","evenodd");
    g.appendChild(seg);

    // label-positie: op de bissectrice, halverwege tussen R_INNER en R_OUTER
    const tr = (R_INNER + R_OUTER) / 2;
    const tx = CX + tr * Math.cos(mid);
    const ty = CY + tr * Math.sin(mid);

    // adaptieve font-grootte: kleiner bij veel segmenten
    const fs = n <= 3 ? 19 : (n <= 5 ? 16 : (n <= 7 ? 14 : 12.5));
    const subFs = n <= 3 ? 12 : (n <= 5 ? 11 : 10);

    const lines = wrapText(k.name, n <= 3 ? 220 : (n <= 5 ? 150 : 110));
    const lineHeight = fs + 2;
    let y0 = ty - ((lines.length-1) * lineHeight)/2 - (k.sub ? 6 : 0);

    lines.forEach(line=>{
      const t = document.createElementNS(ns,"text");
      t.setAttribute("x", tx); t.setAttribute("y", y0);
      t.setAttribute("font-size", fs);
      t.setAttribute("font-weight", "500");
      t.textContent = line;
      g.appendChild(t);
      y0 += lineHeight;
    });
    if (k.sub){
      const s = document.createElementNS(ns,"text");
      s.setAttribute("x", tx); s.setAttribute("y", y0 + 2);
      s.setAttribute("font-size", subFs);
      s.setAttribute("font-style", "italic");
      s.setAttribute("opacity", "0.9");
      s.textContent = k.sub;
      g.appendChild(s);
    }

    g.addEventListener("click",(e)=>{
      e.stopPropagation();
      onClick(k);
    });
    svg.appendChild(g);

    requestAnimationFrame(()=>{
      g.style.transition = "transform .55s cubic-bezier(.22,1,.36,1)";
      g.setAttribute("transform","scale(1)");
    });
  });

  drawCenter(current);
}

function drawCenter(node){
  const ns = "http://www.w3.org/2000/svg";

  const inner = document.createElementNS(ns,"circle");
  inner.setAttribute("cx", CX); inner.setAttribute("cy", CY);
  inner.setAttribute("r", R_INNER);
  inner.setAttribute("fill", "#f6f1e6");
  inner.setAttribute("stroke", "rgba(0,0,0,0.08)");
  inner.setAttribute("stroke-width", "1");
  svg.appendChild(inner);

  const lt = document.createElementNS(ns,"text");
  lt.setAttribute("class","center-label");
  lt.setAttribute("x", CX); lt.setAttribute("y", CY - (node.sub ? 6 : 0));
  lt.setAttribute("font-size", node.name.length > 16 ? 14 : 18);
  lt.setAttribute("font-weight", "500");
  lt.setAttribute("fill", "#1a1a1a");
  lt.textContent = node.name;
  svg.appendChild(lt);

  if (node.sub){
    const ls = document.createElementNS(ns,"text");
    ls.setAttribute("class","center-label");
    ls.setAttribute("x", CX); ls.setAttribute("y", CY + 14);
    ls.setAttribute("font-size", 11);
    ls.setAttribute("font-style","italic");
    ls.setAttribute("fill", "#6b6b6b");
    ls.textContent = node.sub;
    svg.appendChild(ls);
  }
}

function wrapText(s, maxW){
  const words = s.split(/\s+/);
  const lines=[]; let cur="";
  const approxCharW = 8;
  const maxChars = Math.max(8, Math.floor(maxW/approxCharW));
  for (const w of words){
    if ((cur+" "+w).trim().length <= maxChars) cur = (cur+" "+w).trim();
    else { if(cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0,3);
}

/* ============================================================
   INTERACTIE
   ============================================================ */
function onClick(node){
  if (node.href && !node.children){
    showReader(node);
    return;
  }
  if (node.children){
    path.push(node);
    render();
  } else if (node.href){
    window.location.href = node.href;
  }
}

// Klik buiten de cirkel = stap terug
document.getElementById('stage').addEventListener('click', (e)=>{
  // alleen reageren als op lege ruimte/svg-achtergrond geklikt, niet op een segment
  if (e.target.closest('.seg') || e.target.closest('.reader') || e.target === document.getElementById('reader-close')) return;
  // berekenen of de klik buiten de cirkel ligt
  const svgEl = document.getElementById('canvas');
  const rect = svgEl.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const dx = px - CX, dy = py - CY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > R_OUTER){
    if (path.length > 1){
      path.pop();
      render();
    }
  }
});

/* ============================================================
   Reader overlay
   ============================================================ */
const reader = document.getElementById('reader');
const rTitle = document.getElementById('reader-title');
const rDesc = document.getElementById('reader-desc');
const rLink = document.getElementById('reader-link');
document.getElementById('reader-close').addEventListener('click', (e)=>{
  e.stopPropagation();
  reader.classList.remove('show');
});

function showReader(node){
  rTitle.textContent = node.name;
  rDesc.textContent = node.desc || "";
  rLink.href = node.href;
  reader.classList.add('show');
}

/* ============================================================
   Init
   ============================================================ */
render();
</script>
