<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Verkennen — Het Open Vizier</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#f6f1e6;
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --line:#d9d2c2;
    --ink-soft:#3a3a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}

  header{padding:14px 24px 6px;text-align:center}
  header h1{margin:0;font-size:24px;letter-spacing:.5px}
  header p{margin:3px 0 0;color:var(--muted);font-style:italic;font-size:13px}
  nav{display:flex;justify-content:center;gap:18px;padding:6px 16px 0;
      border-bottom:1px solid var(--line);background:#efe7d4}
  nav a{padding:8px 14px;color:#1a1a1a;text-decoration:none;font-size:13px}
  nav a.active{background:#1a1a1a;color:#f6f1e6}
  nav a:hover:not(.active){background:#e3d8bd}

  .stage{position:relative;width:100vw;height:calc(100vh - 90px);
         overflow:hidden;cursor:default}
  svg{width:100%;height:100%;display:block}

  /* nodes */
  .node{cursor:pointer}
  .node .frame{transition:filter .25s ease}
  .node:hover .frame{filter:brightness(1.06) drop-shadow(0 6px 18px rgba(0,0,0,.18))}
  .node text{pointer-events:none;font-family:Georgia,"Times New Roman",serif;
             text-anchor:middle;dominant-baseline:middle;
             font-weight:700;letter-spacing:.2px}
  .node .sub{font-weight:400;font-style:italic;letter-spacing:.1px}
  .node.center{cursor:pointer}

  /* verbindingslijnen */
  .link{fill:none;stroke:rgba(60,60,60,0.22);stroke-width:1.2;
        transition:stroke .25s ease}
  .link:hover{stroke:rgba(60,60,60,0.45)}

  /* artikel-overlay */
  .reader{position:absolute;inset:0;background:rgba(246,241,230,.97);
          display:none;align-items:center;justify-content:center;flex-direction:column;
          padding:40px;text-align:center;z-index:10}
  .reader.show{display:flex}
  .reader h2{margin:0 0 12px;font-size:28px}
  .reader p{margin:0 0 22px;color:var(--muted);max-width:560px;font-size:16px;line-height:1.55}
  .reader a.read{background:#1a1a1a;color:#f6f1e6;padding:12px 22px;
                 text-decoration:none;border-radius:999px;font-size:15px;letter-spacing:.4px}
  .reader button.close{margin-top:22px;background:none;border:1px solid var(--line);
                       padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;color:var(--muted)}
  .reader button.close:hover{color:var(--ink);border-color:var(--ink)}

  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
        color:var(--muted);font-size:12px;font-style:italic;letter-spacing:.3px;
        pointer-events:none}

  .home{position:absolute;top:14px;left:18px;width:36px;height:36px;
        border:1px solid var(--line);border-radius:50%;background:#f6f1e6;
        display:none;align-items:center;justify-content:center;cursor:pointer;
        transition:border-color .2s, background .2s;z-index:5}
  .home:hover{border-color:var(--ink);background:#efe7d4}
  .home.show{display:flex}
  .home svg{width:18px;height:18px;display:block}
  .home path{fill:none;stroke:#1a1a1a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
           color:var(--muted);font-style:italic}

  @media (max-width:560px){
    header h1{font-size:21px}
    nav a{padding:7px 10px;font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>Het Open Vizier</h1>
  <p>Verkennen · gedachte-kaart</p>
</header>
<nav>
  <a href="index.html">Voorpagina</a>
  <a href="wat-opkomt/">Wat opkomt</a>
  <a href="editie-0/">Editie Europa</a>
  <a href="verkennen.html" class="active">Verkennen</a>
  <a href="wat-opkomt/delen.html">Delen</a>
</nav>

<div class="stage" id="stage">
  <button class="home" id="home" title="Terug naar begin" aria-label="Terug naar begin">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 L12 4 L21 11.5 M5.5 10 V20 H18.5 V10"/></svg>
  </button>
  <svg id="canvas" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="loading" id="loading">structuur laden…</div>
  <div class="reader" id="reader">
    <h2 id="reader-title"></h2>
    <p id="reader-desc"></p>
    <a class="read" id="reader-link" href="#" target="_self">→ Lees het artikel</a>
    <button class="close" id="reader-close">Terug</button>
  </div>
  <div class="hint" id="hint">Klik op een blok om dieper te gaan · klik op het centrum om terug</div>
</div>

<script>
/* ============================================================
   Verkennen — gedachte-kaart (centrum met takken)
   Gevoed door _data/structuur.json
   ============================================================ */
const svg = document.getElementById('canvas');
const W = 1400, H = 800, CX = W/2, CY = H/2;

let KNOPEN = [], BY_CODE = {}, CHILDREN = {};
const path = [];

function clear(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }

function shade(hex, pct){
  if (!hex || hex[0] !== '#') return hex;
  const f=parseInt(hex.slice(1),16), t=pct<0?0:255, p=Math.abs(pct)/100,
    R=f>>16,G=(f>>8)&0xFF,B=f&0xFF;
  return "#"+(0x1000000+
    (Math.round((t-R)*p)+R)*0x10000+
    (Math.round((t-G)*p)+G)*0x100+
    (Math.round((t-B)*p)+B)).toString(16).slice(1);
}

function effectiveColor(knoop){
  if (knoop.kleur) return knoop.kleur;
  let cur = knoop;
  while (cur && cur.ouder){
    cur = BY_CODE[cur.ouder];
    if (cur && cur.kleur) return cur.kleur;
  }
  return "#7d7a73";
}

/* ============================================================
   LAYOUT — centraal blok + takken eromheen
   Posities: takken in een cirkel rond het centrum, op aangepaste hoeken
   zodat tekst niet overlapt. Brede rechthoeken (220x76).
   ============================================================ */
function nodePositions(n, depth){
  // straal van takken rond centrum: groter bij meer takken
  const baseR = Math.min(W, H) * 0.36;
  const R = n <= 3 ? baseR * 0.85 : (n <= 5 ? baseR : (n <= 7 ? baseR * 1.05 : baseR * 1.1));

  const positions = [];
  if (n === 1){
    positions.push({x: CX, y: CY - R, angle: -Math.PI/2});
    return positions;
  }
  // start bovenaan, met de klok mee
  const startAngle = -Math.PI/2;
  for (let i=0; i<n; i++){
    const angle = startAngle + (i * 2*Math.PI/n);
    const x = CX + R * Math.cos(angle);
    const y = CY + R * Math.sin(angle);
    positions.push({x, y, angle});
  }
  return positions;
}

function render(){
  clear();
  const ns = "http://www.w3.org/2000/svg";
  const currentCode = path[path.length-1];
  const current = BY_CODE[currentCode];
  if (!current) return;
  const kids = CHILDREN[currentCode] || [];
  const n = kids.length;

  // ===== defs: één filter voor sepia-uitwassen van hero's =====
  const defs = document.createElementNS(ns,"defs");
  defs.innerHTML = `
    <filter id="hero-soft" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="matrix" values="
        0.45 0.45 0.25 0 0.06
        0.40 0.45 0.25 0 0.04
        0.30 0.35 0.20 0 0.02
        0    0    0    0.85 0"/>
    </filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="60%" stop-color="rgba(0,0,0,0.40)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
    </linearGradient>
  `;
  svg.appendChild(defs);

  // ===== Verbindingslijnen (eerst tekenen, onder de nodes) =====
  const positions = nodePositions(n);
  positions.forEach((p,i)=>{
    const line = document.createElementNS(ns,"path");
    const c1x = CX + (p.x - CX) * 0.35;
    const c1y = CY + (p.y - CY) * 0.35;
    const c2x = CX + (p.x - CX) * 0.65;
    const c2y = CY + (p.y - CY) * 0.65;
    line.setAttribute("d", `M ${CX} ${CY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p.x} ${p.y}`);
    line.setAttribute("class","link");
    svg.appendChild(line);
  });

  // ===== Tak-nodes =====
  kids.forEach((k,i)=>{
    const p = positions[i];
    drawNode(k, p.x, p.y, {
      width: 260,
      height: 110,
      fontSize: 18,
      subFontSize: 12,
      isCenter: false,
      onClick: ()=>onClick(k),
      animDelay: i * 40,
    });
  });

  // ===== Centraal blok =====
  drawNode(current, CX, CY, {
    width: 280,
    height: 120,
    fontSize: 22,
    subFontSize: 13,
    isCenter: true,
    onClick: ()=>{ if (path.length > 1) goBack(); },
    animDelay: 0,
  });
}

function drawNode(knoop, x, y, opts){
  const ns = "http://www.w3.org/2000/svg";
  const w = opts.width, h = opts.height;
  const rx = 8;
  const fallback = effectiveColor(knoop) || "#3a3a3a";

  const g = document.createElementNS(ns,"g");
  g.setAttribute("class", "node" + (opts.isCenter ? " center" : ""));
  g.setAttribute("data-code", knoop.code);
  g.style.transformOrigin = `${x}px ${y}px`;
  g.setAttribute("transform", "scale(0.85)");
  g.style.opacity = "0";

  // === uniek clip-path zodat hero binnen afgeronde rechthoek blijft ===
  const clipId = "clip-" + knoop.code.replace(/\./g, "-") + "-" + Math.floor(Math.random()*9999);
  const clipDef = document.createElementNS(ns,"clipPath");
  clipDef.setAttribute("id", clipId);
  const clipRect = document.createElementNS(ns,"rect");
  clipRect.setAttribute("x", x - w/2);
  clipRect.setAttribute("y", y - h/2);
  clipRect.setAttribute("width", w);
  clipRect.setAttribute("height", h);
  clipRect.setAttribute("rx", rx);
  clipRect.setAttribute("ry", rx);
  clipDef.appendChild(clipRect);
  svg.querySelector("defs").appendChild(clipDef);

  const frame = document.createElementNS(ns,"g");
  frame.setAttribute("class","frame");
  frame.setAttribute("clip-path", `url(#${clipId})`);
  g.appendChild(frame);

  // === achtergrond: hero of kleur ===
  if (knoop.hero){
    // fallback kleur (zichtbaar als beeld nog laadt)
    const bg = document.createElementNS(ns,"rect");
    bg.setAttribute("x", x - w/2); bg.setAttribute("y", y - h/2);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
    bg.setAttribute("fill", fallback);
    frame.appendChild(bg);

    const img = document.createElementNS(ns,"image");
    img.setAttributeNS("http://www.w3.org/1999/xlink", "href", knoop.hero);
    img.setAttribute("href", knoop.hero);
    img.setAttribute("x", x - w/2);
    img.setAttribute("y", y - h/2);
    img.setAttribute("width", w);
    img.setAttribute("height", h);
    img.setAttribute("preserveAspectRatio", "xMidYMid slice");
    img.setAttribute("filter", "url(#hero-soft)");
    frame.appendChild(img);

    // donkere overlay voor leesbaarheid
    const shade = document.createElementNS(ns,"rect");
    shade.setAttribute("x", x - w/2); shade.setAttribute("y", y - h/2);
    shade.setAttribute("width", w); shade.setAttribute("height", h);
    shade.setAttribute("fill", "url(#shade)");
    frame.appendChild(shade);
  } else {
    // geen hero: effen ink-blok
    const bg = document.createElementNS(ns,"rect");
    bg.setAttribute("x", x - w/2); bg.setAttribute("y", y - h/2);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
    bg.setAttribute("fill", opts.isCenter ? "#2a2a2a" : fallback);
    frame.appendChild(bg);
  }

  // === randlijn ===
  const border = document.createElementNS(ns,"rect");
  border.setAttribute("x", x - w/2);
  border.setAttribute("y", y - h/2);
  border.setAttribute("width", w);
  border.setAttribute("height", h);
  border.setAttribute("rx", rx);
  border.setAttribute("ry", rx);
  border.setAttribute("fill", "none");
  border.setAttribute("stroke", opts.isCenter ? "rgba(255,255,255,0.20)" : "rgba(255,255,255,0.15)");
  border.setAttribute("stroke-width", "1");
  g.appendChild(border);

  // === tekst over alles heen ===
  const textColor = "rgba(255,255,255,0.98)";
  const subTextColor = "rgba(255,255,255,0.85)";
  const maxChars = Math.floor(w / (opts.fontSize * 0.55));
  const lines = wrapText(knoop.naam, maxChars);
  const lineHeight = opts.fontSize + 4;
  const subHeight = knoop.ondertitel ? opts.subFontSize + 6 : 0;
  const totalH = lines.length * lineHeight + subHeight;
  let yPos = y - totalH/2 + lineHeight/2;

  lines.forEach(line=>{
    const t = document.createElementNS(ns,"text");
    t.setAttribute("x", x); t.setAttribute("y", yPos);
    t.setAttribute("font-size", opts.fontSize);
    t.setAttribute("fill", textColor);
    // tekst-schaduw via meerdere lagen voor leesbaarheid op variabele hero
    t.setAttribute("style", "paint-order:stroke;stroke:rgba(0,0,0,0.45);stroke-width:3;stroke-linejoin:round;");
    t.textContent = line;
    g.appendChild(t);
    yPos += lineHeight;
  });
  if (knoop.ondertitel){
    const s = document.createElementNS(ns,"text");
    s.setAttribute("class","sub");
    s.setAttribute("x", x); s.setAttribute("y", yPos + 4);
    s.setAttribute("font-size", opts.subFontSize);
    s.setAttribute("fill", subTextColor);
    s.setAttribute("style", "paint-order:stroke;stroke:rgba(0,0,0,0.35);stroke-width:2.5;stroke-linejoin:round;");
    s.textContent = knoop.ondertitel;
    g.appendChild(s);
  }

  g.addEventListener("click",(e)=>{
    e.stopPropagation();
    if (opts.onClick) opts.onClick();
  });
  svg.appendChild(g);

  setTimeout(()=>{
    g.style.transition = "transform .45s cubic-bezier(.22,1,.36,1), opacity .35s ease";
    g.setAttribute("transform", "scale(1)");
    g.style.opacity = "1";
  }, opts.animDelay || 0);
}

function wrapText(s, maxChars){
  const words = s.split(/\s+/);
  const lines = []; let cur = "";
  for (const w of words){
    if ((cur + " " + w).trim().length <= maxChars) cur = (cur + " " + w).trim();
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

/* ============================================================
   INTERACTIE
   ============================================================ */
function onClick(node){
  const heeftKinderen = (CHILDREN[node.code] || []).length > 0;
  if (node.url && !heeftKinderen){
    showReader(node);
    return;
  }
  if (heeftKinderen){
    path.push(node.code);
    location.hash = "#code=" + node.code;
    return;
  }
  if (node.url){
    window.location.href = node.url;
  }
}

function goBack(){
  if (path.length <= 1) return;
  path.pop();
  const newCode = path[path.length-1];
  location.hash = newCode === "0" ? "" : "#code=" + newCode;
}

function updateHome(){
  const h = document.getElementById('home');
  if (path.length > 1) h.classList.add('show');
  else h.classList.remove('show');
}

// Klik op lege ruimte = stap terug
document.getElementById('stage').addEventListener('click', (e)=>{
  if (e.target.closest('.node') || e.target.closest('.reader') ||
      e.target === document.getElementById('reader-close') ||
      e.target.closest('.home')) return;
  if (path.length > 1) goBack();
});

document.getElementById('home').addEventListener('click', (e)=>{
  e.stopPropagation();
  path.length = 0;
  path.push("0");
  location.hash = "";
  render();
  updateHome();
});

/* ============================================================
   Reader overlay
   ============================================================ */
const reader = document.getElementById('reader');
document.getElementById('reader-close').addEventListener('click', (e)=>{
  e.stopPropagation();
  reader.classList.remove('show');
});

function showReader(node){
  document.getElementById('reader-title').textContent = node.naam;
  document.getElementById('reader-desc').textContent = node.beschrijving || "";
  document.getElementById('reader-link').href = node.url;
  reader.classList.add('show');
}

/* ============================================================
   URL-hash diep-link
   ============================================================ */
function applyHash(){
  const h = decodeURIComponent(location.hash || "");
  const m = h.match(/^#code=(.+)$/);
  path.length = 0;
  path.push("0");
  if (!m) return;
  const target = m[1].trim();
  if (!BY_CODE[target]) return;
  const trail = [];
  let cur = BY_CODE[target];
  while (cur && cur.code !== "0"){
    trail.unshift(cur.code);
    cur = BY_CODE[cur.ouder];
  }
  for (const c of trail) path.push(c);
  const targetNode = BY_CODE[target];
  const heeftKinderen = (CHILDREN[target] || []).length > 0;
  if (!heeftKinderen && targetNode.url){
    path.pop();
    setTimeout(()=>showReader(targetNode), 50);
  }
}

window.addEventListener('hashchange', ()=>{
  applyHash();
  render();
  updateHome();
});

/* ============================================================
   INIT
   ============================================================ */
fetch('_data/structuur.json')
  .then(r=>r.json())
  .then(data=>{
    KNOPEN = data.knopen;
    BY_CODE = {}; CHILDREN = {};
    for (const k of KNOPEN){
      BY_CODE[k.code] = k;
      if (k.ouder !== null){
        if (!CHILDREN[k.ouder]) CHILDREN[k.ouder] = [];
        CHILDREN[k.ouder].push(k);
      }
    }
    for (const ouder in CHILDREN){
      CHILDREN[ouder].sort((a,b)=>{
        const aP = a.code.split('.').map(Number);
        const bP = b.code.split('.').map(Number);
        for (let i=0;i<Math.max(aP.length,bP.length);i++){
          const ai = aP[i]||0, bi=bP[i]||0;
          if (ai !== bi) return ai - bi;
        }
        return 0;
      });
    }
    document.getElementById('loading').style.display = 'none';
    applyHash();
    render();
    updateHome();
  })
  .catch(err=>{
    document.getElementById('loading').textContent = 'Kon structuur niet laden: ' + err.message;
  });
</script>
</body>
</html>
