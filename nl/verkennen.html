<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Verkennen — Het Open Vizier</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#f6f1e6;
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --line:#d9d2c2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
  header{padding:18px 24px 8px;text-align:center}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--muted);font-style:italic;font-size:14px}
  nav{display:flex;justify-content:center;gap:18px;padding:8px 16px 0;
      border-bottom:1px solid var(--line);background:#efe7d4}
  nav a{padding:10px 14px;color:#1a1a1a;text-decoration:none;font-size:14px}
  nav a.active{background:#1a1a1a;color:#f6f1e6}
  nav a:hover:not(.active){background:#e3d8bd}

  .stage{position:relative;width:100vw;height:calc(100vh - 110px);
         overflow:hidden;display:flex;align-items:center;justify-content:center}

  /* breadcrumb */
  .crumb{position:absolute;top:14px;left:50%;transform:translateX(-50%);
         color:var(--muted);font-size:13px;letter-spacing:.3px;
         display:flex;gap:6px;align-items:center;flex-wrap:wrap;
         max-width:90vw;justify-content:center}
  .crumb span.sep{opacity:.5}
  .crumb button{background:none;border:none;font:inherit;color:var(--muted);
                cursor:pointer;text-decoration:underline;padding:0}
  .crumb button:hover{color:var(--ink)}
  .crumb .current{color:var(--ink);font-style:italic}

  svg{width:100%;height:100%;display:block}

  /* Each "bubble" */
  .bubble{cursor:pointer;transition:filter .25s ease}
  .bubble:hover{filter:brightness(1.05) drop-shadow(0 4px 14px rgba(0,0,0,.12))}
  .bubble text{pointer-events:none;font-family:Georgia,serif;text-anchor:middle;
               dominant-baseline:middle;fill:#fff}
  .bubble.parent{cursor:default}
  .bubble.parent:hover{filter:none}

  /* article overlay */
  .reader{position:absolute;inset:0;background:rgba(246,241,230,.97);
          display:none;align-items:center;justify-content:center;flex-direction:column;
          padding:40px;text-align:center}
  .reader.show{display:flex}
  .reader h2{margin:0 0 12px;font-size:28px}
  .reader p{margin:0 0 22px;color:var(--muted);max-width:560px;font-size:16px;line-height:1.55}
  .reader a.read{background:#1a1a1a;color:#f6f1e6;padding:12px 22px;
                 text-decoration:none;border-radius:999px;font-size:15px;letter-spacing:.4px}
  .reader button.close{margin-top:22px;background:none;border:1px solid var(--line);
                       padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;
                       color:var(--muted)}
  .reader button.close:hover{color:var(--ink);border-color:var(--ink)}

  /* hint */
  .hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
        color:var(--muted);font-size:12px;font-style:italic;letter-spacing:.3px}

  @media (max-width:560px){
    header h1{font-size:22px}
    header p{font-size:12px}
    nav a{padding:8px 10px;font-size:13px}
  }
</style>

<body>

<nav>

<div class="stage">

  <div class="reader" id="reader">
    <h2 id="reader-title"></h2>
    <p id="reader-desc"></p>
    <a class="read" id="reader-link" href="#" target="_self">→ Lees het artikel</a>
    <button class="close" id="reader-close">Terug</button>
  </div>
  <div class="hint">Klik op een cirkel om dieper te gaan · klik op de breadcrumb om terug te keren</div>
</div>

/* ============================================================
   STATE & RENDER
   ============================================================ */
const svg = document.getElementById('canvas');
const W = 1000, H = 700, CX = W/2, CY = H/2;
const path = [tree]; // stack van geneste keuzes

function clear(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }

function defGradient(id, c1, c2){
  const ns = "http://www.w3.org/2000/svg";
  const grad = document.createElementNS(ns,"radialGradient");
  grad.setAttribute("id",id);
  grad.setAttribute("cx","35%"); grad.setAttribute("cy","30%"); grad.setAttribute("r","75%");
  const s1 = document.createElementNS(ns,"stop");
  s1.setAttribute("offset","0%"); s1.setAttribute("stop-color",c1);
  const s2 = document.createElementNS(ns,"stop");
  s2.setAttribute("offset","100%"); s2.setAttribute("stop-color",c2);
  grad.appendChild(s1); grad.appendChild(s2);
  return grad;
}

function shade(hex, pct){
  // lighter (pct positive) / darker (pct negative)
  const f=parseInt(hex.slice(1),16), t=pct<0?0:255, p=Math.abs(pct)/100,
    R=f>>16,G=(f>>8)&0xFF,B=f&0xFF;
  return "#"+(0x1000000+
    (Math.round((t-R)*p)+R)*0x10000+
    (Math.round((t-G)*p)+G)*0x100+
    (Math.round((t-B)*p)+B)).toString(16).slice(1);
}

function render(){
  clear();
  const ns = "http://www.w3.org/2000/svg";
  const current = path[path.length-1];
  const kids = current.children || [];
  const depth = path.length - 1;

  // defs voor gradients
  const defs = document.createElementNS(ns,"defs");
  const pc1 = current.gradient ? current.gradient[0] : shade(current.color, 30);
  const pc2 = current.gradient ? current.gradient[1] : shade(current.color, -25);
  defs.appendChild(defGradient("grad-parent", pc1, pc2));
  kids.forEach((k,i)=>{
    const c1 = k.gradient ? k.gradient[0] : shade(k.color, 25);
    const c2 = k.gradient ? k.gradient[1] : shade(k.color, -20);
    defs.appendChild(defGradient("grad-"+i, c1, c2));
  });
  svg.appendChild(defs);

  // CENTRUM-cirkel: alleen vanaf depth > 0
  // Toont waar je gekozen hebt — klikbaar om terug te gaan
  if (depth > 0){
    const centerR = 88;
    const cg = document.createElementNS(ns,"g");
    cg.setAttribute("class","bubble");
    cg.setAttribute("transform",`translate(${CX},${CY}) scale(1)`);
    const cc = document.createElementNS(ns,"circle");
    cc.setAttribute("cx",0); cc.setAttribute("cy",0); cc.setAttribute("r",centerR);
    cc.setAttribute("fill","url(#grad-parent)");
    cc.setAttribute("stroke","rgba(255,255,255,0.4)");
    cc.setAttribute("stroke-width","1.5");
    cg.appendChild(cc);

    const nameLines = wrapText(current.name, centerR*1.6);
    const lh = 15;
    let y0 = -(nameLines.length*lh)/2 + lh/2 - 4;
    nameLines.forEach(line=>{
      const t = document.createElementNS(ns,"text");
      t.setAttribute("x",0); t.setAttribute("y",y0);
      t.setAttribute("font-size",13.5);
      t.setAttribute("font-weight","500");
      t.textContent = line;
      cg.appendChild(t);
      y0 += lh;
    });
    const back = document.createElementNS(ns,"text");
    back.setAttribute("x",0); back.setAttribute("y",y0+4);
    back.setAttribute("font-size",10.5);
    back.setAttribute("font-style","italic");
    back.setAttribute("opacity","0.85");
    back.textContent = "← terug";
    cg.appendChild(back);

    cg.addEventListener("click", ()=>{ path.pop(); render(); });
    svg.appendChild(cg);
  }

  // KIND-cirkel posities
  const n = kids.length;
  let ringR, childR;

  if (depth === 0){
    // Startbeeld: cirkels naast elkaar (geen omhullende cirkel)
    // Voor 3 cirkels: rij van 3 in het midden
    ringR = 0; // wordt niet gebruikt
    childR = 130;
  } else {
    // Eromheen-modus: ring rond centrum
    ringR = 230;
    childR = Math.min(85, Math.max(45, (2*Math.PI*ringR)/(n*2.6)));
  }

  // Voor laag 1: zet Lezer in het midden, Verdieper links, Beleidsmaker rechts
  let layoutKids = kids;
  if (depth === 0 && kids.length === 3){
    const byName = name => kids.find(k => k.name === name);
    const lezer = byName("Lezer");
    const verdieper = byName("Verdieper");
    const beleid = byName("Beleidsmaker");
    if (lezer && verdieper && beleid){
      layoutKids = [verdieper, lezer, beleid];
    }
  }

  layoutKids.forEach((k,i)=>{
    let cx, cy;
    if (depth === 0){
      // Horizontale rij voor laag 1 — middelste cirkel iets groter
      const spacing = 290;
      const totalWidth = (n-1) * spacing;
      cx = CX - totalWidth/2 + i * spacing;
      cy = CY;
    } else if (n === 1){
      cx = CX; cy = CY - 230;
    } else {
      const angle = -Math.PI/2 + (i * 2*Math.PI/n);
      cx = CX + ringR * Math.cos(angle);
      cy = CY + ringR * Math.sin(angle);
    }

    const g = document.createElementNS(ns,"g");
    g.setAttribute("class","bubble");
    g.setAttribute("transform",`translate(${cx},${cy}) scale(0.001)`);
    g.style.transformOrigin = `${cx}px ${cy}px`;

    // Middelste cirkel op laag 1 iets groter voor visuele focus
    const isMiddle = (depth === 0 && n === 3 && i === 1);
    const r = isMiddle ? childR * 1.18 : childR;

    const c = document.createElementNS(ns,"circle");
    c.setAttribute("cx",0); c.setAttribute("cy",0); c.setAttribute("r",r);
    c.setAttribute("fill","url(#grad-"+i+")");
    c.setAttribute("stroke","rgba(255,255,255,0.35)");
    c.setAttribute("stroke-width","1.5");
    g.appendChild(c);

    // tekst — naam (en sub-label indien aanwezig)
    const name = k.name;
    const lines = wrapText(name, r*1.6);
    const lineHeight = r < 60 ? 13 : (r < 80 ? 15 : 17);
    const totalH = lines.length * lineHeight + (k.sub ? 14 : 0);
    let y0 = -(totalH/2) + lineHeight/2;

    lines.forEach((line)=>{
      const t = document.createElementNS(ns,"text");
      t.setAttribute("x",0); t.setAttribute("y",y0);
      t.setAttribute("font-size", r < 60 ? 12 : (r < 80 ? 13.5 : 15));
      t.setAttribute("font-weight","500");
      t.textContent = line;
      g.appendChild(t);
      y0 += lineHeight;
    });
    if (k.sub){
      const s = document.createElementNS(ns,"text");
      s.setAttribute("x",0); s.setAttribute("y",y0+2);
      s.setAttribute("font-size", r < 60 ? 10 : 11.5);
      s.setAttribute("font-style","italic");
      s.setAttribute("opacity","0.85");
      s.textContent = k.sub;
      g.appendChild(s);
    }

    g.addEventListener("click", ()=>onClick(k));
    svg.appendChild(g);

    // animatie in
    requestAnimationFrame(()=>{
      g.style.transition = "transform .55s cubic-bezier(.22,1,.36,1), opacity .4s";
      g.setAttribute("transform",`translate(${cx},${cy}) scale(1)`);
    });
  });

  renderCrumb();
}

function wrapText(s, maxW){
  // ruwe woord-wrap op spaties — past goed bij gemiddelde cirkelgrootte
  const words = s.split(/\s+/);
  const lines=[]; let cur="";
  const approxCharW = 7.5;
  const maxChars = Math.max(8, Math.floor(maxW/approxCharW));
  for (const w of words){
    if ((cur+" "+w).trim().length <= maxChars) cur = (cur+" "+w).trim();
    else { if(cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0,3);
}

function renderCrumb(){
  const c = document.getElementById('crumb');
  c.innerHTML = "";
  path.forEach((node, idx)=>{
    if (idx === path.length-1){
      const s = document.createElement('span');
      s.className = "current";
      s.textContent = idx === 0 ? "Kies een ingang" : node.name;
      c.appendChild(s);
    } else {
      const b = document.createElement('button');
      b.textContent = idx === 0 ? "Begin" : node.name;
      b.addEventListener("click", ()=>{ path.length = idx+1; render(); });
      c.appendChild(b);
      const sep = document.createElement('span');
      sep.className="sep"; sep.textContent = "›";
      c.appendChild(sep);
    }
  });
}

function onClick(node){
  // als het een artikel is (heeft href, geen children) → toon reader-overlay
  if (node.href && !node.children){
    showReader(node);
    return;
  }
  // anders: ga één laag dieper
  if (node.children){
    path.push(node);
    render();
  } else if (node.href){
    // ingang naar bestaande pagina (Lezer-tak)
    window.location.href = node.href;
  }
}

/* ============================================================
   Reader overlay
   ============================================================ */
const reader = document.getElementById('reader');
const rTitle = document.getElementById('reader-title');
const rDesc = document.getElementById('reader-desc');
const rLink = document.getElementById('reader-link');
document.getElementById('reader-close').addEventListener('click', ()=>reader.classList.remove('show'));

function showReader(node){
  rTitle.textContent = node.name;
  rDesc.textContent = node.desc || "";
  rLink.href = node.href;
  reader.classList.add('show');
}

/* ============================================================
   Init
   ============================================================ */
render();
</script>
