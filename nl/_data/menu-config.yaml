# =============================================================================
# CANONIEKE MENUCONFIGURATOR — HET OPEN VIZIER
# =============================================================================
#
# Dit bestand is de EENIGE bron van waarheid voor de hoofdnavigatie op de
# voorpagina's van nl/en/de/ru. Regenereer met:
#
#     python3 scripts/menu_bouwen.py
#
# Structuur:
#   - `groepen`: lijst van dropdown-groepen in weergavevolgorde
#   - Elke groep heeft: `key`, `labels` (per taal), en `items`
#   - Elke item heeft: `key`, `labels` (per taal), `urls` (per taal)
#     Optioneel: `sub_van` (voor sub-rubrieken, ingesprongen weergegeven),
#                `scheiding_boven: true` (horizontale lijn ervoor)
#
# Regel: als een URL leeg is voor een taal, valt hij terug op de nl-URL,
# geprefixt met '../nl/'.
#
# =============================================================================

talen: [nl, en, de, ru]

groepen:

  # ---------------------------------------------------------------------------
  - key: bladeren
    labels:
      nl: Bladeren
      en: Browse
      de: Blättern
      ru: Листать
