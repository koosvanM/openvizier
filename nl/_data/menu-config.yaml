# =============================================================================
# CANONIEKE MENUCONFIGURATOR — HET OPEN VIZIER
# =============================================================================
#
# Enige bron van waarheid voor de hoofdnavigatie op alle paginas.
# Regenereer met:
#
#     python3 scripts/menu_bouwen.py
#
# Structuur v4 — platte lijst, geen dropdowns meer.
# Elk item is een directe link. Op verkennen.html vind je de volledige
# artikelen-lijst per rubriek.
# =============================================================================

