<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Filosofie">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- Klassieke Doric-zuil in het midden, omgeven door cyclus-pijl -->
  <!-- Cyclus-pijl (eerst tekenen zodat zuil ervoor staat) -->
  <g transform="translate(180,180)" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <!-- Cirkel-segment, bijna sluitend, met pijlpunt -->
    <path d="M -110 0 A 110 110 0 1 1 95 56" stroke-linejoin="round"/>
    <!-- pijlpunt -->
    <path d="M 95 56 L 75 38 M 95 56 L 75 76" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Doric-zuil -->
  <g transform="translate(180,180)">
    <!-- basis -->
    <rect x="-42" y="80" width="84" height="14" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <rect x="-46" y="92" width="92" height="6" fill="#1c5760"/>
    <!-- schacht met canneluren -->
    <rect x="-30" y="-65" width="60" height="145" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <g stroke="#1c5760" stroke-width="1.4" opacity="0.6">
      <line x1="-20" y1="-65" x2="-20" y2="80"/>
      <line x1="-10" y1="-65" x2="-10" y2="80"/>
      <line x1="0"   y1="-65" x2="0"   y2="80"/>
      <line x1="10"  y1="-65" x2="10"  y2="80"/>
      <line x1="20"  y1="-65" x2="20"  y2="80"/>
    </g>
    <!-- kapiteel -->
    <rect x="-38" y="-80" width="76" height="8" fill="#1c5760"/>
    <rect x="-34" y="-72" width="68" height="7" fill="#fbf6e9" stroke="#1c5760" stroke-width="2"/>
  </g>
</svg>
