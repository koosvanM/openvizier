<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Leiderschap">
  <rect width="360" height="360" fill="#fbf6e9"/>
  <!-- weegschaal -->
  <g stroke="#1a1a1a" stroke-width="3" fill="none">
    <line x1="180" y1="60" x2="180" y2="290"/>
    <line x1="60" y1="120" x2="300" y2="180"/>
    <line x1="60" y1="120" x2="60" y2="160" stroke-dasharray="4 4"/>
    <line x1="300" y1="180" x2="300" y2="220" stroke-dasharray="4 4"/>
  </g>
  <!-- verstand (links, leeg) -->
  <g>
    <path d="M 25 160 Q 60 195 95 160 Z" fill="none" stroke="#5a5a5a" stroke-width="2.5"/>
    <text x="60" y="148" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#5a5a5a">verstand</text>
  </g>
  <!-- gevoel (rechts, goud-zwaar) -->
  <g>
    <path d="M 265 220 Q 300 260 335 220 Z" fill="#d4af37" stroke="#a07c1a" stroke-width="2.5"/>
    <text x="300" y="208" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#7a5c0a">gevoel</text>
  </g>
  <!-- basis -->
  <line x1="135" y1="290" x2="225" y2="290" stroke="#1a1a1a" stroke-width="4"/>
</svg>
