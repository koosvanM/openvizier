<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie 2 — kijken naar de uitkomst aan het eind">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- horizon / weg met perspectief -->
  <path d="M 100 320 L 800 160 L 1500 320 Z" fill="#1c5760" opacity="0.10"/>
  <path d="M 100 320 L 800 160" stroke="#1c5760" stroke-width="2"/>
  <path d="M 1500 320 L 800 160" stroke="#1c5760" stroke-width="2"/>
  <!-- streepjes op de weg -->
  <g stroke="#1c5760" stroke-width="2" stroke-linecap="round">
    <line x1="640" y1="220" x2="660" y2="220"/>
    <line x1="700" y1="250" x2="730" y2="250"/>
    <line x1="760" y1="280" x2="800" y2="280"/>
    <line x1="950" y1="220" x2="970" y2="220"/>
    <line x1="880" y1="250" x2="910" y2="250"/>
    <line x1="800" y1="280" x2="840" y2="280"/>
  </g>
  <!-- zon / uitkomst aan het eind -->
  <circle cx="800" cy="160" r="40" fill="#d4af37"/>
  <circle cx="800" cy="160" r="62" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>
  <!-- romeinse II -->
  <text x="80" y="240" font-family="Georgia, serif" font-style="italic" font-size="180" fill="#1c5760" opacity="0.18">II</text>
</svg>
