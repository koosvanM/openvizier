<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Onderzoeken">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- nachtelijke achtergrond: subtiel sterrenpatroon onderaan -->
  <g fill="#1c5760" opacity="0.18">
    <circle cx="40"  cy="60"  r="1.5"/>
    <circle cx="320" cy="50"  r="1.2"/>
    <circle cx="100" cy="80"  r="1"/>
    <circle cx="280" cy="100" r="1.5"/>
    <circle cx="60"  cy="120" r="1.2"/>
    <circle cx="340" cy="150" r="1"/>
  </g>
  <!-- centrale cirkel: gevoelsnetwerk -->
  <g transform="translate(180,180)">
    <!-- buitenring (D - dagbewustzijn) -->
    <circle r="120" fill="none" stroke="#1c5760" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5"/>
    <!-- middenring (F - gevoelsnetwerk) -->
    <circle r="80"  fill="none" stroke="#1c5760" stroke-width="2"/>
    <!-- kern (oergevoel) -->
    <circle r="32"  fill="#d4af37"/>
    <circle r="32"  fill="none" stroke="#a07c1a" stroke-width="2"/>
  </g>
  <!-- knooppunten op middenring (F-verbindingen) -->
  <g fill="#1c5760">
    <g transform="translate(180,180)">
      <g transform="rotate(0)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(45)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(90)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(135)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(180)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(225)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(270)"><circle cx="80" cy="0" r="6"/></g>
      <g transform="rotate(315)"><circle cx="80" cy="0" r="6"/></g>
    </g>
  </g>
  <!-- verbindingslijnen kern → knooppunten -->
  <g stroke="#1c5760" stroke-width="1" opacity="0.4">
    <g transform="translate(180,180)">
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(0)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(45)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(90)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(135)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(225)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(270)"/>
      <line x1="0" y1="0" x2="74" y2="0" transform="rotate(315)"/>
    </g>
  </g>
  <!-- vergrootglas-handle (linksonder), suggereert onderzoek -->
  <g stroke="#a52d3a" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="80" y1="280" x2="125" y2="235"/>
  </g>
  <circle cx="80" cy="280" r="6" fill="#a52d3a"/>
</svg>
