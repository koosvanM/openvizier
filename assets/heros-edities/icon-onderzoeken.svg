<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Onderzoeken">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- Archief-kast met laden (onderzoeken = dossiers, bronnen) -->
  <g transform="translate(180,200)">
    <!-- kast omtrek -->
    <rect x="-95" y="-90" width="190" height="180" fill="#fbf6e9" stroke="#1c5760" stroke-width="3"/>
    <!-- bovenkant donker -->
    <rect x="-95" y="-90" width="190" height="14" fill="#1c5760"/>
    <!-- 3 laden -->
    <g fill="#faf8f3" stroke="#1c5760" stroke-width="2">
      <rect x="-85" y="-65" width="170" height="48"/>
      <rect x="-85" y="-10" width="170" height="48"/>
      <rect x="-85" y="45"  width="170" height="40"/>
    </g>
    <!-- handvatten -->
    <g fill="#d4af37" stroke="#a07c1a" stroke-width="1.5">
      <rect x="-12" y="-44" width="24" height="6"/>
      <rect x="-12" y="11"  width="24" height="6"/>
      <rect x="-12" y="62"  width="24" height="6"/>
    </g>
    <!-- middelste la half open met dossier-mapje -->
    <g transform="translate(0,-10)">
      <rect x="-85" y="0" width="170" height="48" fill="#faf8f3" stroke="#1c5760" stroke-width="2"/>
      <!-- dossier-tab -->
      <path d="M -45 -8 L -15 -8 L -10 0 L -45 0 Z" fill="#d4af37" stroke="#a07c1a" stroke-width="1.2"/>
      <rect x="-45" y="0" width="60" height="32" fill="#fbf6e9" stroke="#a07c1a" stroke-width="1.5"/>
      <!-- regelijntjes op dossier -->
      <line x1="-38" y1="10" x2="8" y2="10" stroke="#1c5760" stroke-width="1" opacity="0.55"/>
      <line x1="-38" y1="18" x2="2" y2="18" stroke="#1c5760" stroke-width="1" opacity="0.55"/>
    </g>
  </g>
</svg>
