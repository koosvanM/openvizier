<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Toekomst">
  <defs>
    <radialGradient id="t-sun" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#f4c453"/>
      <stop offset="0.6" stop-color="#e09a2a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c0741a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- horizon -->
  <line x1="20" y1="240" x2="340" y2="240" stroke="#1c5760" stroke-width="2.5"/>
  <!-- opkomende zon (toekomst-symbool) -->
  <ellipse cx="180" cy="240" rx="110" ry="110" fill="url(#t-sun)"/>
  <path d="M 70 240 A 110 110 0 0 1 290 240 Z" fill="#e09a2a"/>
  <!-- zonnestralen omhoog -->
  <g stroke="#d4af37" stroke-width="2.5" stroke-linecap="round">
    <line x1="180" y1="115" x2="180" y2="85"/>
    <line x1="115" y1="130" x2="100" y2="105"/>
    <line x1="245" y1="130" x2="260" y2="105"/>
    <line x1="80" y1="170" x2="55" y2="160"/>
    <line x1="280" y1="170" x2="305" y2="160"/>
  </g>
  <!-- toekomst-pad: drie pijlpunten omhoog -->
  <g stroke="#1c5760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,310 180,280 260,310"/>
    <polyline points="120,330 180,310 240,330"/>
  </g>
  <!-- centrale opwaartse pijl -->
  <g stroke="#a52d3a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="180" y1="285" x2="180" y2="200"/>
    <polyline points="160,220 180,200 200,220"/>
  </g>
</svg>
