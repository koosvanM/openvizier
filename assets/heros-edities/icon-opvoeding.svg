<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Kind en Loopbaan">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <g fill="#0d6068">
    <!-- kind -->
    <g transform="translate(60,250)">
      <circle cx="0" cy="-50" r="14"/>
      <rect x="-12" y="-32" width="24" height="34" rx="6"/>
      <line x1="-6" y1="2" x2="-8" y2="22" stroke="#0d6068" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="2" x2="8" y2="22" stroke="#0d6068" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- groter -->
    <g transform="translate(140,232)">
      <circle cx="0" cy="-68" r="18"/>
      <rect x="-16" y="-46" width="32" height="46" rx="7"/>
      <line x1="-8" y1="2" x2="-10" y2="30" stroke="#0d6068" stroke-width="5" stroke-linecap="round"/>
      <line x1="8" y1="2" x2="10" y2="30" stroke="#0d6068" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- tiener -->
    <g transform="translate(225,210)">
