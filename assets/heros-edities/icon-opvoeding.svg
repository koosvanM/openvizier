      <line x1="-10" y1="-2" x2="-12" y2="38" stroke="#0d6068" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="-2" x2="12" y2="38" stroke="#0d6068" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- volwassen -->
    <g transform="translate(310,180)">
      <circle cx="0" cy="-104" r="26"/>
      <rect x="-24" y="-76" width="48" height="72" rx="10"/>
      <line x1="-12" y1="-2" x2="-15" y2="48" stroke="#0d6068" stroke-width="7" stroke-linecap="round"/>
      <line x1="12" y1="-2" x2="15" y2="48" stroke="#0d6068" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <!-- pad -->
  <path d="M 30 290 Q 100 270 140 280 T 225 275 T 310 270 T 350 275" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line x1="0" y1="290" x2="360" y2="290" stroke="#1a1a1a" stroke-width="1.2" opacity="0.4"/>
