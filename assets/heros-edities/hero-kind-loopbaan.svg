<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie Kind en Loopbaan — hero">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- groei-pad van kind naar volwassene: vier silhouetten oplopend in grootte -->
  <g fill="#0d6068">
    <!-- kind klein -->
    <g transform="translate(280,260)">
      <circle cx="0" cy="-50" r="14"/>
      <rect x="-12" y="-32" width="24" height="34" rx="6"/>
      <line x1="-6" y1="2" x2="-8" y2="22" stroke="#0d6068" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="2" x2="8" y2="22" stroke="#0d6068" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- groter -->
    <g transform="translate(580,250)">
      <circle cx="0" cy="-66" r="18"/>
      <rect x="-16" y="-44" width="32" height="46" rx="7"/>
      <line x1="-8" y1="2" x2="-10" y2="30" stroke="#0d6068" stroke-width="5" stroke-linecap="round"/>
      <line x1="8" y1="2" x2="10" y2="30" stroke="#0d6068" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- tiener -->
    <g transform="translate(900,240)">
      <circle cx="0" cy="-82" r="22"/>
      <rect x="-20" y="-58" width="40" height="58" rx="8"/>
      <line x1="-10" y1="2" x2="-12" y2="38" stroke="#0d6068" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="2" x2="12" y2="38" stroke="#0d6068" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- volwassen -->
    <g transform="translate(1260,225)">
      <circle cx="0" cy="-100" r="26"/>
      <rect x="-24" y="-72" width="48" height="72" rx="10"/>
      <line x1="-12" y1="2" x2="-15" y2="48" stroke="#0d6068" stroke-width="7" stroke-linecap="round"/>
      <line x1="12" y1="2" x2="15" y2="48" stroke="#0d6068" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <!-- pad-lijn die ze verbindt, dunne golf -->
  <path d="M 200 295 Q 440 270 580 280 T 900 270 T 1260 273 T 1500 275" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- horizon -->
  <line x1="0" y1="295" x2="1600" y2="295" stroke="#1a1a1a" stroke-width="1.6" opacity="0.4"/>
</svg>
