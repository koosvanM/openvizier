<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie Stikstof — hero">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- veld-strepen -->
  <g stroke="#1c5760" stroke-width="1.4" opacity="0.45">
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
  </g>
  <!-- N2-moleculen als symbolische cirkels met N -->
  <g font-family="Georgia, serif" font-style="italic" fill="#a52d3a">
    <g transform="translate(360,170)">
      <circle r="46" fill="#a52d3a" opacity="0.12"/>
      <circle r="28" fill="none" stroke="#a52d3a" stroke-width="2"/>
      <text text-anchor="middle" dy="0.35em" font-size="32" fill="#a52d3a">N</text>
    </g>
    <g transform="translate(800,150)">
      <circle r="64" fill="#a52d3a" opacity="0.16"/>
      <circle r="40" fill="none" stroke="#a52d3a" stroke-width="2.4"/>
      <text text-anchor="middle" dy="0.35em" font-size="44" fill="#a52d3a">N₂</text>
    </g>
    <g transform="translate(1240,180)">
      <circle r="46" fill="#a52d3a" opacity="0.12"/>
      <circle r="28" fill="none" stroke="#a52d3a" stroke-width="2"/>
      <text text-anchor="middle" dy="0.35em" font-size="32" fill="#a52d3a">N</text>
    </g>
  </g>
  <!-- bindingsstrepen tussen moleculen -->
  <g stroke="#a52d3a" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.5">
    <line x1="406" y1="170" x2="734" y2="150"/>
    <line x1="866" y1="150" x2="1192" y2="180"/>
  </g>
  <!-- bodemlijn -->
  <line x1="0" y1="340" x2="1600" y2="340" stroke="#1c5760" stroke-width="3"/>
</svg>
