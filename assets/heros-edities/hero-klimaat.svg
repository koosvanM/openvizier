<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie Klimaat — hero">
  <defs>
    <linearGradient id="k-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0e3"/>
      <stop offset="1" stop-color="#e9ddc0"/>
    </linearGradient>
    <radialGradient id="k-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c453"/>
      <stop offset="0.65" stop-color="#e09a2a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c0741a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="360" fill="url(#k-sky)"/>
  <!-- zon op de evenaar -->
  <circle cx="800" cy="190" r="150" fill="url(#k-sun)"/>
  <circle cx="800" cy="190" r="78" fill="#e09a2a"/>
  <!-- evenaar / horizon -->
  <line x1="0" y1="260" x2="1600" y2="260" stroke="#0d6068" stroke-width="2.5" stroke-dasharray="14 8"/>
  <!-- aardbolcontour -->
  <ellipse cx="800" cy="260" rx="520" ry="90" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="800" cy="260" rx="520" ry="40" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <!-- subtiele warmtebanden -->
  <g opacity="0.18" fill="#c0741a">
    <ellipse cx="800" cy="270" rx="480" ry="14"/>
    <ellipse cx="800" cy="290" rx="420" ry="10"/>
    <ellipse cx="800" cy="308" rx="360" ry="7"/>
  </g>
</svg>
