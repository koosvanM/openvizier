<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Verdiepen">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- Boek + vergrootglas (verdiepen = nader bekijken) -->
  <!-- opengeslagen boek -->
  <g transform="translate(180,210)">
    <!-- linker bladzijde -->
    <path d="M -100 -50 L -5 -55 L -5 50 L -100 45 Z" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <!-- rechter bladzijde -->
    <path d="M 100 -50 L 5 -55 L 5 50 L 100 45 Z" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <!-- rug -->
    <line x1="-5" y1="-55" x2="-5" y2="50" stroke="#1c5760" stroke-width="2"/>
    <line x1="5"  y1="-55" x2="5"  y2="50" stroke="#1c5760" stroke-width="2"/>
    <!-- tekstregels -->
    <g stroke="#1c5760" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <line x1="-85" y1="-35" x2="-20" y2="-37"/>
      <line x1="-85" y1="-15" x2="-25" y2="-17"/>
      <line x1="-85" y1="5"   x2="-20" y2="3"/>
      <line x1="-85" y1="25"  x2="-25" y2="23"/>
      <line x1="20"  y1="-37" x2="85" y2="-35"/>
      <line x1="25"  y1="-17" x2="85" y2="-15"/>
      <line x1="20"  y1="3"   x2="85" y2="5"/>
      <line x1="25"  y1="23"  x2="85" y2="25"/>
    </g>
  </g>
  <!-- vergrootglas (rechtsboven, hangend over boek) -->
  <g transform="translate(220,140)">
    <!-- handvat -->
    <line x1="22" y1="22" x2="55" y2="55" stroke="#8b6f47" stroke-width="7" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="55" y2="55" stroke="#5a4429" stroke-width="3" stroke-linecap="round"/>
    <!-- ring -->
    <circle cx="0" cy="0" r="32" fill="#fbf6e9" fill-opacity="0.6" stroke="#d4af37" stroke-width="5"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#a07c1a" stroke-width="1.5"/>
  </g>
</svg>
