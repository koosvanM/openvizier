<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie 3 — de mens onder het ijs">
  <defs>
    <linearGradient id="ijs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde4ec"/>
      <stop offset="1" stop-color="#7fa9bc"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4d5e"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- ijslaag bovenaan -->
  <rect x="0" y="0" width="1600" height="170" fill="url(#ijs)"/>
  <!-- ijs-onderkant met scheuren -->
  <path d="M 0 170 L 200 168 L 320 174 L 480 166 L 640 173 L 820 167 L 980 175 L 1140 168 L 1300 174 L 1460 167 L 1600 172 L 1600 170 L 0 170 Z" fill="#7fa9bc"/>
  <!-- water onder ijs -->
  <rect x="0" y="170" width="1600" height="190" fill="url(#water)"/>
  <!-- mens-silhouet onder het ijs, opkijkend -->
  <g transform="translate(800,250)" fill="#cde4ec" opacity="0.9">
    <circle cx="0" cy="-30" r="14"/>
    <path d="M -20 -16 L 20 -16 L 24 40 L -24 40 Z"/>
    <path d="M -20 -10 L -38 18 L -32 26 L -16 4 Z"/>
    <path d="M 20 -10 L 38 18 L 32 26 L 16 4 Z"/>
  </g>
  <!-- luchtbellen -->
  <g fill="#cde4ec" opacity="0.7">
    <circle cx="780" cy="200" r="4"/>
    <circle cx="820" cy="190" r="5"/>
    <circle cx="800" cy="180" r="3"/>
    <circle cx="850" cy="210" r="3"/>
  </g>
  <!-- romeinse III -->
  <text x="80" y="100" font-family="Georgia, serif" font-style="italic" font-size="140" fill="#1c5760" opacity="0.4">III</text>
</svg>
