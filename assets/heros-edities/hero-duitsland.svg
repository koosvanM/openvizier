<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie Duitsland — hero">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- koolzaadveld (gele banen) -->
  <g>
    <rect x="0" y="240" width="1600" height="120" fill="#d4af37" opacity="0.35"/>
    <g stroke="#b8860b" stroke-width="1" opacity="0.4">
      <line x1="0" y1="260" x2="1600" y2="260"/>
      <line x1="0" y1="280" x2="1600" y2="280"/>
      <line x1="0" y1="300" x2="1600" y2="300"/>
      <line x1="0" y1="320" x2="1600" y2="320"/>
    </g>
  </g>
  <!-- koolzaad-bloemtoppen -->
  <g fill="#d4af37">
    <circle cx="120" cy="235" r="6"/><circle cx="180" cy="232" r="5"/><circle cx="240" cy="237" r="6"/>
    <circle cx="320" cy="230" r="7"/><circle cx="380" cy="234" r="5"/><circle cx="460" cy="236" r="6"/>
    <circle cx="540" cy="232" r="6"/><circle cx="620" cy="235" r="5"/><circle cx="700" cy="231" r="7"/>
    <circle cx="780" cy="236" r="6"/><circle cx="860" cy="233" r="5"/><circle cx="940" cy="237" r="6"/>
    <circle cx="1020" cy="232" r="6"/><circle cx="1100" cy="234" r="5"/><circle cx="1180" cy="236" r="6"/>
    <circle cx="1260" cy="231" r="7"/><circle cx="1340" cy="235" r="5"/><circle cx="1420" cy="237" r="6"/>
    <circle cx="1500" cy="233" r="6"/>
  </g>
  <!-- Duitse vlag als horizon-band, subtiel -->
  <g opacity="0.85">
    <rect x="640" y="110" width="320" height="20" fill="#1a1a1a"/>
    <rect x="640" y="130" width="320" height="20" fill="#c43c2a"/>
    <rect x="640" y="150" width="320" height="20" fill="#d4af37"/>
    <rect x="640" y="110" width="320" height="60" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>
  <!-- horizonlijn -->
  <line x1="0" y1="240" x2="1600" y2="240" stroke="#1a1a1a" stroke-width="1.8"/>
</svg>
