<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie 5 — de vergeten orde">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- kompas-roos als ordeningssymbool -->
  <g transform="translate(800,180)" stroke="#1c5760" fill="none">
    <circle r="120" stroke-width="2"/>
    <circle r="90" stroke-width="1" opacity="0.5"/>
    <circle r="60" stroke-width="1" opacity="0.5"/>
    <!-- vier hoofdrichtingen -->
    <path d="M 0 -120 L 12 0 L 0 120 L -12 0 Z" fill="#1c5760"/>
    <path d="M -120 0 L 0 12 L 120 0 L 0 -12 Z" fill="#1c5760" opacity="0.7"/>
    <!-- 8 streepjes -->
    <g stroke-width="1.5">
      <line x1="85" y1="85" x2="105" y2="105"/>
      <line x1="-85" y1="85" x2="-105" y2="105"/>
      <line x1="85" y1="-85" x2="105" y2="-105"/>
      <line x1="-85" y1="-85" x2="-105" y2="-105"/>
    </g>
  </g>
  <!-- vervagende oude orde (lijnen die uitfaden naar rechts) -->
  <g stroke="#5a5a5a" stroke-width="1" opacity="0.35">
    <line x1="100" y1="80" x2="500" y2="80"/>
    <line x1="100" y1="120" x2="480" y2="120"/>
    <line x1="100" y1="160" x2="460" y2="160"/>
    <line x1="100" y1="200" x2="440" y2="200"/>
    <line x1="100" y1="240" x2="420" y2="240"/>
    <line x1="100" y1="280" x2="400" y2="280"/>
  </g>
  <!-- romeinse V -->
  <text x="1390" y="280" font-family="Georgia, serif" font-style="italic" font-size="200" fill="#1c5760" opacity="0.18">V</text>
</svg>
