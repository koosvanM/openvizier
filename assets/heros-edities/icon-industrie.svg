<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Industrie">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- werkbank-blad onderaan -->
  <g transform="translate(180,250)">
    <rect x="-130" y="0" width="260" height="14" fill="#1c5760" stroke="#0f3a40" stroke-width="2"/>
    <!-- poten -->
    <rect x="-115" y="14" width="10" height="60" fill="#1c5760"/>
    <rect x="105" y="14" width="10" height="60" fill="#1c5760"/>
    <!-- houtnerf-lijntjes -->
    <line x1="-100" y1="7" x2="100" y2="7" stroke="#0f3a40" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- hamer links -->
  <g transform="translate(110,200) rotate(-15)">
    <!-- steel -->
    <rect x="-3" y="0" width="6" height="55" fill="#8b6f47" stroke="#5a4429" stroke-width="1.5"/>
    <!-- kop -->
    <rect x="-22" y="-10" width="44" height="14" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>
  <!-- tandwiel rechts boven werkbank -->
  <g transform="translate(220,170)">
    <g fill="#d4af37" stroke="#a07c1a" stroke-width="1.2">
      <rect x="-4" y="-44" width="8" height="12"/>
      <rect x="-4" y="32" width="8" height="12"/>
      <g transform="rotate(45)"><rect x="-4" y="-44" width="8" height="12"/></g>
      <g transform="rotate(45)"><rect x="-4" y="32" width="8" height="12"/></g>
      <g transform="rotate(90)"><rect x="-4" y="-44" width="8" height="12"/></g>
      <g transform="rotate(90)"><rect x="-4" y="32" width="8" height="12"/></g>
      <g transform="rotate(135)"><rect x="-4" y="-44" width="8" height="12"/></g>
      <g transform="rotate(135)"><rect x="-4" y="32" width="8" height="12"/></g>
    </g>
    <circle r="34" fill="#d4af37" stroke="#a07c1a" stroke-width="1.5"/>
    <circle r="10" fill="#f5f0e3" stroke="#a07c1a" stroke-width="1.5"/>
  </g>
  <!-- schoorsteen / fabriek silhouet boven, klein, op de achtergrond -->
  <g transform="translate(180,100)" fill="none" stroke="#1c5760" stroke-width="2" opacity="0.6">
    <rect x="-50" y="-25" width="100" height="35" fill="#fbf6e9"/>
    <rect x="-45" y="-50" width="14" height="25" fill="#fbf6e9"/>
    <rect x="-22" y="-40" width="14" height="15" fill="#fbf6e9"/>
    <!-- rook -->
    <path d="M -38 -55 Q -42 -65 -36 -72 Q -30 -78 -38 -85" stroke-linecap="round"/>
  </g>
</svg>
