<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Energie">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- gestileerde vortex / wervel — stromingsleer als energiebron -->
  <g transform="translate(180,180)" fill="none" stroke="#1c5760" stroke-width="2.5" stroke-linecap="round">
    <!-- spiraal vortex -->
    <path d="M 0 -110 C 60 -110 110 -60 110 0 C 110 60 60 110 0 110 C -50 110 -90 70 -90 20 C -90 -25 -55 -55 -15 -55 C 20 -55 45 -30 45 5 C 45 35 25 55 -5 55 C -25 55 -38 40 -38 22 C -38 8 -27 -2 -13 -2 C -3 -2 4 5 4 14"/>
  </g>
  <!-- gouden vlam-bol in centrum -->
  <g transform="translate(180,180)">
    <circle r="15" fill="#d4af37" stroke="#a07c1a" stroke-width="2"/>
    <path d="M 0 -15 C -6 -22 -3 -30 0 -34 C 3 -30 6 -22 0 -15 Z" fill="#d4af37" stroke="#a07c1a" stroke-width="1.5"/>
  </g>
  <!-- straal-lijntjes rondom -->
  <g transform="translate(180,180)" stroke="#d4af37" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="0" y1="-135" x2="0" y2="-150"/>
    <line x1="95" y1="-95" x2="106" y2="-106"/>
    <line x1="135" y1="0" x2="150" y2="0"/>
    <line x1="95" y1="95" x2="106" y2="106"/>
    <line x1="0" y1="135" x2="0" y2="150"/>
    <line x1="-95" y1="95" x2="-106" y2="106"/>
    <line x1="-135" y1="0" x2="-150" y2="0"/>
    <line x1="-95" y1="-95" x2="-106" y2="-106"/>
  </g>
</svg>
