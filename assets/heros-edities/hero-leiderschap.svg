<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie Leiderschap — hero">
  <rect width="1600" height="360" fill="#fbf6e9"/>
  <!-- twee weegschalen: gevoelsleiden (zwaar, goud) versus verstandsleiden (licht) -->
  <g stroke="#1a1a1a" stroke-width="3" fill="none">
    <!-- centrale paal -->
    <line x1="800" y1="80" x2="800" y2="290"/>
    <!-- balk -->
    <line x1="500" y1="120" x2="1100" y2="180"/>
    <!-- linker ketting (hoog = lichter) -->
    <line x1="500" y1="120" x2="500" y2="160" stroke-dasharray="4 4"/>
    <!-- rechter ketting (laag = zwaarder) -->
    <line x1="1100" y1="180" x2="1100" y2="220" stroke-dasharray="4 4"/>
  </g>
  <!-- verstandsleiden schaal (links, leeg) -->
  <g>
    <path d="M 430 160 Q 500 195 570 160 Z" fill="none" stroke="#5a5a5a" stroke-width="2.5"/>
    <text x="500" y="148" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#5a5a5a">verstand</text>
  </g>
  <!-- gevoelsleiden schaal (rechts, goud-zwaar) -->
  <g>
    <path d="M 1030 220 Q 1100 260 1170 220 Z" fill="#d4af37" stroke="#a07c1a" stroke-width="2.5"/>
    <text x="1100" y="208" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#7a5c0a">gevoel</text>
  </g>
  <!-- basis-podium -->
  <line x1="700" y1="290" x2="900" y2="290" stroke="#1a1a1a" stroke-width="4"/>
  <!-- as / waardelijn -->
  <line x1="0" y1="315" x2="1600" y2="315" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
</svg>
