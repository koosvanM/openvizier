<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie 1 — negen stukken, één gedachte">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- negen kleine kruisjes/blokken die naar één centrum wijzen -->
  <g fill="#1c5760">
    <!-- centrale kern -->
    <circle cx="800" cy="180" r="34" fill="#1c5760"/>
    <circle cx="800" cy="180" r="50" fill="none" stroke="#1c5760" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- 9 blokjes in cirkel rondom -->
  <g fill="#1c5760">
    <g transform="translate(800,180)">
      <g transform="rotate(0)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(40)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(80)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(120)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(160)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(200)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(240)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(280)"><rect x="120" y="-10" width="22" height="22"/></g>
      <g transform="rotate(320)"><rect x="120" y="-10" width="22" height="22"/></g>
    </g>
  </g>
  <!-- verbindingslijnen -->
  <g stroke="#1c5760" stroke-width="1" opacity="0.35">
    <g transform="translate(800,180)">
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(0)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(40)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(80)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(120)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(160)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(200)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(240)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(280)"/>
      <line x1="0" y1="0" x2="135" y2="0" transform="rotate(320)"/>
    </g>
  </g>
  <!-- romeinse I -->
  <text x="80" y="240" font-family="Georgia, serif" font-style="italic" font-size="180" fill="#1c5760" opacity="0.18">I</text>
</svg>
