<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Overheden">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- klassiek bestuursgebouw — driehoekige fronton + pilaren -->
  <g transform="translate(180,260)">
    <!-- bodem -->
    <rect x="-135" y="0" width="270" height="12" fill="#1c5760"/>
    <!-- trappen -->
    <rect x="-120" y="-8" width="240" height="8" fill="#1c5760" opacity="0.85"/>
    <!-- pilaren (5) -->
    <g fill="#fbf6e9" stroke="#1c5760" stroke-width="2">
      <rect x="-105" y="-90" width="20" height="82"/>
      <rect x="-55"  y="-90" width="20" height="82"/>
      <rect x="-10"  y="-90" width="20" height="82"/>
      <rect x="35"   y="-90" width="20" height="82"/>
      <rect x="85"   y="-90" width="20" height="82"/>
    </g>
    <!-- architraaf -->
    <rect x="-120" y="-100" width="240" height="10" fill="#1c5760"/>
    <!-- fronton (driehoek) -->
    <polygon points="-120,-100 0,-165 120,-100" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <!-- gouden ster in fronton -->
    <g transform="translate(0,-122)">
      <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#d4af37" stroke="#a07c1a" stroke-width="1.2"/>
    </g>
  </g>
</svg>
