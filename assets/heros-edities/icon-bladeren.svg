<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Bladeren">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- Krant met opwapperende pagina (bladeren = pagina omslaan) -->
  <g transform="translate(180,200)">
    <!-- onderste pagina-stapel -->
    <rect x="-90" y="-70" width="180" height="140" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <!-- tekstregels op pagina -->
    <g stroke="#1c5760" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <line x1="-75" y1="-50" x2="75" y2="-50"/>
      <line x1="-75" y1="-30" x2="60" y2="-30"/>
      <line x1="-75" y1="-10" x2="75" y2="-10"/>
      <line x1="-75" y1="10"  x2="50" y2="10"/>
      <line x1="-75" y1="30"  x2="75" y2="30"/>
      <line x1="-75" y1="50"  x2="65" y2="50"/>
    </g>
    <!-- omslaande pagina (krul rechtsboven) -->
    <path d="M 30 -70 Q 90 -60 78 0 Q 60 -10 50 -30 Q 38 -50 30 -70 Z" fill="#d4af37" stroke="#a07c1a" stroke-width="2"/>
    <path d="M 30 -70 Q 60 -60 50 -30" fill="none" stroke="#a07c1a" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
