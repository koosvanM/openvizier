<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Scholing">
  <rect width="360" height="360" fill="#f5f0e3"/>
  <!-- open boek onderaan -->
  <g transform="translate(180,250)">
    <path d="M -110 0 Q -55 -20 0 -10 Q 55 -20 110 0 L 110 60 Q 55 40 0 50 Q -55 40 -110 60 Z" fill="#fbf6e9" stroke="#1c5760" stroke-width="2.5"/>
    <line x1="0" y1="-10" x2="0" y2="50" stroke="#1c5760" stroke-width="2"/>
    <!-- regels linker pagina -->
    <line x1="-85" y1="5" x2="-25" y2="0" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
    <line x1="-85" y1="18" x2="-25" y2="13" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
    <line x1="-85" y1="31" x2="-25" y2="26" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
    <!-- regels rechter pagina -->
    <line x1="25" y1="0" x2="85" y2="5" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="13" x2="85" y2="18" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="26" x2="85" y2="31" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- tandwiel boven boek (vakmanschap + denken) -->
  <g transform="translate(180,130)">
    <!-- buitenste tanden -->
    <g fill="#d4af37" stroke="#a07c1a" stroke-width="1.5">
      <rect x="-7" y="-72" width="14" height="18"/>
      <rect x="-7" y="54" width="14" height="18"/>
      <g transform="rotate(45)"><rect x="-7" y="-72" width="14" height="18"/></g>
      <g transform="rotate(45)"><rect x="-7" y="54" width="14" height="18"/></g>
      <g transform="rotate(90)"><rect x="-7" y="-72" width="14" height="18"/></g>
      <g transform="rotate(90)"><rect x="-7" y="54" width="14" height="18"/></g>
      <g transform="rotate(135)"><rect x="-7" y="-72" width="14" height="18"/></g>
      <g transform="rotate(135)"><rect x="-7" y="54" width="14" height="18"/></g>
    </g>
    <!-- ring -->
    <circle r="58" fill="#d4af37" stroke="#a07c1a" stroke-width="2"/>
    <circle r="38" fill="#f5f0e3" stroke="#a07c1a" stroke-width="2"/>
    <!-- centrale i (idee) -->
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#1c5760" font-weight="bold">i</text>
  </g>
  <!-- horizontale lijn als basis -->
  <line x1="40" y1="320" x2="320" y2="320" stroke="#1c5760" stroke-width="2"/>
</svg>
