<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editie 4 — papier-industrie boven echt werk">
  <rect width="1600" height="360" fill="#f5f0e3"/>
  <!-- toren van papieren / dossiers, scheef -->
  <g transform="translate(440,80)" fill="#faf8f3" stroke="#1a1a1a" stroke-width="1.8">
    <g transform="rotate(-2)"><rect x="0" y="0" width="220" height="38"/></g>
    <g transform="translate(8,38) rotate(3)"><rect x="0" y="0" width="220" height="38"/></g>
    <g transform="translate(-4,76) rotate(-4)"><rect x="0" y="0" width="220" height="38"/></g>
    <g transform="translate(10,114) rotate(2)"><rect x="0" y="0" width="220" height="38"/></g>
    <g transform="translate(-2,152) rotate(-3)"><rect x="0" y="0" width="220" height="38"/></g>
    <g transform="translate(6,190) rotate(1)"><rect x="0" y="0" width="220" height="38"/></g>
  </g>
  <!-- regels op papieren (subtiel) -->
  <g stroke="#5a5a5a" stroke-width="0.6" opacity="0.5">
    <line x1="460" y1="98" x2="640" y2="92"/>
    <line x1="460" y1="108" x2="640" y2="102"/>
    <line x1="468" y1="142" x2="660" y2="148"/>
    <line x1="468" y1="152" x2="660" y2="158"/>
  </g>
  <!-- werker met schop, klein, aan de rechterkant -->
  <g transform="translate(1050,240)" fill="#1c5760">
    <circle cx="0" cy="-50" r="14"/>
    <rect x="-12" y="-34" width="24" height="40" rx="5"/>
    <line x1="-6" y1="8" x2="-10" y2="36" stroke="#1c5760" stroke-width="5" stroke-linecap="round"/>
    <line x1="6" y1="8" x2="10" y2="36" stroke="#1c5760" stroke-width="5" stroke-linecap="round"/>
    <!-- schop -->
    <line x1="14" y1="-30" x2="64" y2="20" stroke="#1c5760" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 16 L 78 28 L 70 40 L 54 26 Z" fill="#1c5760"/>
  </g>
  <!-- grond -->
  <line x1="0" y1="305" x2="1600" y2="305" stroke="#1c5760" stroke-width="2"/>
  <!-- romeinse IV -->
  <text x="1380" y="270" font-family="Georgia, serif" font-style="italic" font-size="180" fill="#1c5760" opacity="0.18">IV</text>
</svg>
