<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#efe6cf"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a1224"/>
      <stop offset="50%" stop-color="#b81e3a"/>
      <stop offset="100%" stop-color="#e85b6d"/>
    </linearGradient>
    <linearGradient id="goldFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b95e"/>
      <stop offset="100%" stop-color="#f3e9a5"/>
    </linearGradient>
    <radialGradient id="organGreen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8d5b9"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </radialGradient>
    <radialGradient id="headRed" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e85b6d"/>
      <stop offset="100%" stop-color="#7a1224"/>
    </radialGradient>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgL)"/>

  <!-- Titel boven -->
  <text x="800" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1a1a1a">Они убивают свою жизненную артерию</text>
  <text x="800" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#4a5263">производство, обеспечивающее население жизненным эликсиром — деньгами</text>

  <!-- Hoofd-diagram: anatomisch beeld -->

  <!-- Linkerkant: de productieve organen (de gezonde cellen) -->
  <g transform="translate(160,200)">
    <text x="180" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0e3d2e">ЖИЗНЕННАЯ АРТЕРИЯ · производительные органы</text>
    <text x="180" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">они генерируют деньги, на которые все живут</text>

    <!-- Zes organen in cirkel rond een hart -->
    <g>
      <!-- Boer -->
      <g transform="translate(40,80)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">BOER</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">voedsel</text>
      </g>
      <!-- MKB -->
      <g transform="translate(180,40)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">MKB</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">werk</text>
      </g>
      <!-- DGA -->
      <g transform="translate(320,80)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">DGA</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">kapitaal</text>
      </g>
      <!-- Industrie -->
      <g transform="translate(40,260)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#0e3d2e">INDUSTRIE</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">productie</text>
      </g>
      <!-- Vakman -->
      <g transform="translate(180,300)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">VAKMAN</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">ambacht</text>
      </g>
      <!-- Energie / BiCRS -->
      <g transform="translate(320,260)">
        <circle cx="0" cy="0" r="42" fill="url(#organGreen)" stroke="#0e3d2e" stroke-width="2"/>
        <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">ENERGIE</text>
        <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#0e3d2e">BiCRS</text>
      </g>
    </g>

    <!-- Bloedvaten/geldstroom uit organen naar middenpunt -->
    <g stroke="url(#goldFlow)" stroke-width="5" fill="none" opacity="0.9">
      <path d="M 80 80 Q 180 130 280 200" stroke-linecap="round"/>
      <path d="M 180 80 Q 220 140 280 200" stroke-linecap="round"/>
      <path d="M 280 80 Q 290 140 295 200" stroke-linecap="round"/>
      <path d="M 80 260 Q 180 230 280 220" stroke-linecap="round"/>
      <path d="M 180 300 Q 220 250 285 215" stroke-linecap="round"/>
      <path d="M 280 260 Q 290 240 295 220" stroke-linecap="round"/>
    </g>

    <!-- Aorta (verzamel-ader) -->
    <rect x="350" y="195" width="180" height="30" rx="4" fill="url(#goldFlow)" stroke="#b8941a" stroke-width="2"/>
    <text x="440" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#1a1a1a">GELD-AORTA</text>
  </g>

  <!-- Rechterkant: hoofd dat in eigen ader bijt -->
  <g transform="translate(880,200)">
    <text x="280" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#7a1224">DE LEIDINGGEVENDHEID · het hoofd</text>
    <text x="280" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">Brussel en Den Haag — zij beslissen, zij sturen, zij hakken in</text>

    <!-- Het hoofd: groot zieke "hoofd" met tanden in de ader -->
    <g transform="translate(140,180)">
      <!-- Hoofd-silhouet -->
      <ellipse cx="180" cy="80" rx="160" ry="100" fill="url(#headRed)" stroke="#7a1224" stroke-width="3"/>
      <!-- 'Brussel' label boven -->
      <text x="180" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#7a1224">BRUSSEL · DEN HAAG</text>
      <!-- 'mond' met tanden -->
      <g transform="translate(40,100)">
        <path d="M 0 0 L 60 0 L 55 20 L 5 20 Z" fill="#1a0a0a" stroke="#000" stroke-width="1.5"/>
        <!-- Tanden -->
        <g fill="#f5f0e6">
          <polygon points="5,0 12,12 15,0"/>
          <polygon points="18,0 25,15 28,0"/>
          <polygon points="31,0 38,15 41,0"/>
          <polygon points="44,0 51,12 54,0"/>
        </g>
        <!-- Bloed-druppels -->
        <g fill="#b81e3a">
          <circle cx="15" cy="28" r="3"/>
          <circle cx="30" cy="32" r="4"/>
          <circle cx="45" cy="28" r="3"/>
        </g>
      </g>
      <!-- 'Ogen' \u2014 gesloten/blind -->
      <g stroke="#1a0a0a" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M 105 60 L 135 60"/>
        <path d="M 225 60 L 255 60"/>
      </g>
      <!-- Symbolische 'kroon' van bureaucratie -->
      <g transform="translate(140,-30)" fill="#d4b95e" stroke="#b8941a" stroke-width="1.5">
        <polygon points="0,30 10,10 20,25 30,5 40,25 50,10 60,30 60,40 0,40"/>
        <text x="30" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#7a1224">orthodoxie</text>
      </g>
    </g>

    <!-- De ader die het hoofd doorbijt — verandert van goud naar bloed -->
    <g>
      <!-- Goud links (gezond) -->
      <rect x="-40" y="265" width="220" height="22" rx="2" fill="url(#goldFlow)" stroke="#b8941a" stroke-width="1.5"/>
      <!-- Bijt-zone (rood/zwart) -->
      <rect x="180" y="265" width="80" height="22" rx="2" fill="#1a0a0a"/>
      <!-- Verder rood (geleegd) -->
      <rect x="260" y="265" width="120" height="22" rx="2" fill="url(#bloodGrad)" stroke="#7a1224" stroke-width="1.5"/>
      <!-- Tand-markers -->
      <g fill="#b81e3a">
        <polygon points="195,265 200,278 205,265"/>
        <polygon points="220,265 225,278 230,265"/>
        <polygon points="245,265 250,278 255,265"/>
      </g>
      <text x="220" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#7a1224">stikstof · Box 3 · CBAM · regeldruk · uitkoop</text>
    </g>

    <!-- Lege ader rechts -->
    <g transform="translate(380,250)">
      <text x="50" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#7a1224">↓ leeg</text>
      <text x="50" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a5263">naar de inwoner</text>
      <text x="50" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a5263">die niets meer krijgt</text>
    </g>
  </g>

  <!-- Onderschrift -->
  <g transform="translate(80,710)">
    <rect width="1440" height="140" rx="6" fill="#fff5e8" stroke="#b81e3a" stroke-width="2"/>
    <text x="720" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#7a1224">DE DIAGNOSE</text>
    <text x="720" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a1a1a">De leidinggevende laag bijt door de ader die haar voedt. Geen kwade wil — een herkenningsfout.</text>
    <text x="720" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1a1a1a">Het lichaam valt zijn eigen organen aan. Deze ziekte heeft een naam: <tspan font-weight="700" fill="#7a1224">auto-immuunziekte</tspan>.</text>
    <text x="720" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">Wat in een mens een doodvonnis kan zijn, kan in een bestel binnen vijf jaar onomkeerbaar worden.</text>
  </g>
</svg>
