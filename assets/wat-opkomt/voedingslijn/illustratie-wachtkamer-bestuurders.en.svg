<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">De wachtkamer der bestuurders</title>
  <desc id="d">Vijf bestuurders rond een ronde vergadertafel; elk met een document, allen kijken weg naar elkaar; vraagtekens boven hun hoofd; klok in midden tikt door. Iedereen wacht op een ander.</desc>

  <!-- Achtergrond -->
  <rect width="1200" height="700" fill="#0e3d2e"/>
  <rect y="0" width="1200" height="80" fill="#0a2e22"/>

  <!-- Titel -->
  <text x="60" y="48" fill="#a8d5b9" font-family="Georgia, serif" font-size="14" letter-spacing="0.3em" font-weight="600">DE STILSTAND · ILLUSTRATIE I</text>
  <text x="60" y="74" fill="#f5f0e6" font-family="Georgia, serif" font-size="28" font-weight="700">De wachtkamer der bestuurders</text>

  <!-- Vergadertafel ovaal -->
  <ellipse cx="600" cy="380" rx="380" ry="170" fill="#3a2618" stroke="#a8d5b9" stroke-width="2"/>
  <ellipse cx="600" cy="372" rx="360" ry="150" fill="#5a3a26"/>

  <!-- Klok middenop tafel -->
  <g transform="translate(600 372)">
    <circle r="40" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3"/>
    <circle r="34" fill="#f5f0e6" stroke="#1a1a1a" stroke-width="2"/>
    <circle r="2" fill="#1a1a1a"/>
    <line x1="0" y1="-30" x2="0" y2="-30" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-24"/>
      <line x1="28" y1="0" x2="24" y2="0"/>
      <line x1="0" y1="28" x2="0" y2="24"/>
      <line x1="-28" y1="0" x2="-24" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="-10" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="60" text-anchor="middle" fill="#ffb4a8" font-family="Georgia, serif" font-size="13" font-style="italic">tikt door</text>
  </g>

  <!-- ==== BESTUURDER 1 (boven links) ==== -->
  <g transform="translate(360 250)">
    <!-- Vraagteken boven -->
    <circle cx="0" cy="-90" r="22" fill="#c0392b" opacity="0.18"/>
    <text x="0" y="-78" text-anchor="middle" fill="#c0392b" stroke="#5a1410" stroke-width="1" font-family="Georgia, serif" font-size="38" font-weight="700">?</text>
    <!-- Hoofd -->
    <circle cx="0" cy="-30" r="18" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-15 -34 Q-8 -50 0 -50 Q12 -49 15 -33 Q9 -42 0 -42 Q-9 -42 -14 -32 Z" fill="#3a2618"/>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.5"><circle cx="-6" cy="-30" r="3.5"/><circle cx="6" cy="-30" r="3.5"/><line x1="-2.5" y1="-30" x2="2.5" y2="-30"/></g>
    <g fill="#1a1a1a"><circle cx="-6" cy="-30" r="0.9"/><circle cx="6" cy="-30" r="0.9"/></g>
    <line x1="-4" y1="-19" x2="4" y2="-19" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- Nek -->
    <rect x="-6" y="-14" width="12" height="12" fill="#e8c4a4"/>
    <!-- Pak -->
    <path d="M-30 50 L-25 -2 Q-20 -12 0 -12 Q20 -12 25 -2 L30 50 Z" fill="#1a2530" stroke="#a8d5b9" stroke-width="1"/>
    <!-- Stropdas -->
    <path d="M-3 -2 L0 12 L3 -2 L2 30 L0 36 L-2 30 Z" fill="#5a1410"/>
    <!-- Kraag -->
    <path d="M-10 -2 L0 8 L10 -2 L8 4 L0 12 L-8 4 Z" fill="#f5f0e6"/>
    <!-- Document -->
    <rect x="-35" y="60" width="70" height="44" fill="#f5f0e6" stroke="#a8d5b9" stroke-width="1"/>
    <line x1="-29" y1="70" x2="29" y2="70" stroke="#6b7280" stroke-width="1"/>
    <line x1="-29" y1="78" x2="20" y2="78" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="-29" y1="86" x2="25" y2="86" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="5" y1="96" x2="29" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- Blik-pijl rechts -->
    <g opacity="0.65">
      <path d="M30 -25 L100 -10" stroke="#a8d5b9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M94 -16 L108 -10 L94 -4 Z" fill="#a8d5b9"/>
    </g>
  </g>

  <!-- ==== BESTUURDER 2 (boven midden) ==== -->
  <g transform="translate(600 215)">
    <circle cx="0" cy="-90" r="22" fill="#c0392b" opacity="0.18"/>
    <text x="0" y="-78" text-anchor="middle" fill="#c0392b" stroke="#5a1410" stroke-width="1" font-family="Georgia, serif" font-size="38" font-weight="700">?</text>
    <circle cx="0" cy="-30" r="18" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-15 -34 Q-8 -50 0 -50 Q12 -49 15 -33 Q9 -42 0 -42 Q-9 -42 -14 -32 Z" fill="#1f1612"/>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.5"><circle cx="-6" cy="-30" r="3.5"/><circle cx="6" cy="-30" r="3.5"/><line x1="-2.5" y1="-30" x2="2.5" y2="-30"/></g>
    <g fill="#1a1a1a"><circle cx="-6" cy="-30" r="0.9"/><circle cx="6" cy="-30" r="0.9"/></g>
    <line x1="-4" y1="-19" x2="4" y2="-19" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="-6" y="-14" width="12" height="12" fill="#e8c4a4"/>
    <path d="M-30 50 L-25 -2 Q-20 -12 0 -12 Q20 -12 25 -2 L30 50 Z" fill="#243246" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-3 -2 L0 12 L3 -2 L2 30 L0 36 L-2 30 Z" fill="#5a1410"/>
    <path d="M-10 -2 L0 8 L10 -2 L8 4 L0 12 L-8 4 Z" fill="#f5f0e6"/>
    <rect x="-35" y="60" width="70" height="44" fill="#f5f0e6" stroke="#a8d5b9" stroke-width="1"/>
    <line x1="-29" y1="70" x2="29" y2="70" stroke="#6b7280" stroke-width="1"/>
    <line x1="-29" y1="78" x2="20" y2="78" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="-29" y1="86" x2="25" y2="86" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="5" y1="96" x2="29" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <g opacity="0.65">
      <path d="M30 -25 L100 -10" stroke="#a8d5b9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M94 -16 L108 -10 L94 -4 Z" fill="#a8d5b9"/>
    </g>
  </g>

  <!-- ==== BESTUURDER 3 (boven rechts) ==== -->
  <g transform="translate(840 250)">
    <circle cx="0" cy="-90" r="22" fill="#c0392b" opacity="0.18"/>
    <text x="0" y="-78" text-anchor="middle" fill="#c0392b" stroke="#5a1410" stroke-width="1" font-family="Georgia, serif" font-size="38" font-weight="700">?</text>
    <circle cx="0" cy="-30" r="18" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-15 -34 Q-8 -50 0 -50 Q12 -49 15 -33 Q9 -42 0 -42 Q-9 -42 -14 -32 Z" fill="#2c1f15"/>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.5"><circle cx="-6" cy="-30" r="3.5"/><circle cx="6" cy="-30" r="3.5"/><line x1="-2.5" y1="-30" x2="2.5" y2="-30"/></g>
    <g fill="#1a1a1a"><circle cx="-6" cy="-30" r="0.9"/><circle cx="6" cy="-30" r="0.9"/></g>
    <line x1="-4" y1="-19" x2="4" y2="-19" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="-6" y="-14" width="12" height="12" fill="#e8c4a4"/>
    <path d="M-30 50 L-25 -2 Q-20 -12 0 -12 Q20 -12 25 -2 L30 50 Z" fill="#1a2530" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-3 -2 L0 12 L3 -2 L2 30 L0 36 L-2 30 Z" fill="#5a1410"/>
    <path d="M-10 -2 L0 8 L10 -2 L8 4 L0 12 L-8 4 Z" fill="#f5f0e6"/>
    <rect x="-35" y="60" width="70" height="44" fill="#f5f0e6" stroke="#a8d5b9" stroke-width="1"/>
    <line x1="-29" y1="70" x2="29" y2="70" stroke="#6b7280" stroke-width="1"/>
    <line x1="-29" y1="78" x2="20" y2="78" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="-29" y1="86" x2="25" y2="86" stroke="#6b7280" stroke-width="0.8"/>
    <line x1="5" y1="96" x2="29" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- Blik naar onder-rechts (richt op B4) -->
    <g opacity="0.65">
      <path d="M30 0 L70 50" stroke="#a8d5b9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M62 42 L76 56 L58 52 Z" fill="#a8d5b9"/>
    </g>
  </g>

  <!-- ==== BESTUURDER 4 (onder rechts) ==== -->
  <g transform="translate(800 490)">
    <circle cx="0" cy="-80" r="20" fill="#c0392b" opacity="0.18"/>
    <text x="0" y="-69" text-anchor="middle" fill="#c0392b" stroke="#5a1410" stroke-width="1" font-family="Georgia, serif" font-size="34" font-weight="700">?</text>
    <circle cx="0" cy="-26" r="16" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-13 -30 Q-7 -44 0 -44 Q11 -43 13 -29 Q8 -38 0 -38 Q-8 -38 -12 -28 Z" fill="#3a2618"/>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.3"><circle cx="-5" cy="-26" r="3"/><circle cx="5" cy="-26" r="3"/><line x1="-2" y1="-26" x2="2" y2="-26"/></g>
    <g fill="#1a1a1a"><circle cx="-5" cy="-26" r="0.8"/><circle cx="5" cy="-26" r="0.8"/></g>
    <line x1="-3" y1="-17" x2="3" y2="-17" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="-5" y="-12" width="10" height="10" fill="#e8c4a4"/>
    <path d="M-26 40 L-22 -2 Q-18 -10 0 -10 Q18 -10 22 -2 L26 40 Z" fill="#1a2530" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-2 -2 L0 10 L2 -2 L1.5 26 L0 32 L-1.5 26 Z" fill="#5a1410"/>
    <path d="M-8 -2 L0 6 L8 -2 L6 3 L0 10 L-6 3 Z" fill="#f5f0e6"/>
    <!-- Blik naar links naar B5 -->
    <g opacity="0.65">
      <path d="M-30 -20 L-100 -10" stroke="#a8d5b9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M-94 -16 L-108 -10 L-94 -4 Z" fill="#a8d5b9"/>
    </g>
  </g>

  <!-- ==== BESTUURDER 5 (onder links) ==== -->
  <g transform="translate(400 490)">
    <circle cx="0" cy="-80" r="20" fill="#c0392b" opacity="0.18"/>
    <text x="0" y="-69" text-anchor="middle" fill="#c0392b" stroke="#5a1410" stroke-width="1" font-family="Georgia, serif" font-size="34" font-weight="700">?</text>
    <circle cx="0" cy="-26" r="16" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-13 -30 Q-7 -44 0 -44 Q11 -43 13 -29 Q8 -38 0 -38 Q-8 -38 -12 -28 Z" fill="#1f1612"/>
    <g fill="none" stroke="#1a1a1a" stroke-width="1.3"><circle cx="-5" cy="-26" r="3"/><circle cx="5" cy="-26" r="3"/><line x1="-2" y1="-26" x2="2" y2="-26"/></g>
    <g fill="#1a1a1a"><circle cx="-5" cy="-26" r="0.8"/><circle cx="5" cy="-26" r="0.8"/></g>
    <line x1="-3" y1="-17" x2="3" y2="-17" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="-5" y="-12" width="10" height="10" fill="#e8c4a4"/>
    <path d="M-26 40 L-22 -2 Q-18 -10 0 -10 Q18 -10 22 -2 L26 40 Z" fill="#243246" stroke="#a8d5b9" stroke-width="1"/>
    <path d="M-2 -2 L0 10 L2 -2 L1.5 26 L0 32 L-1.5 26 Z" fill="#5a1410"/>
    <path d="M-8 -2 L0 6 L8 -2 L6 3 L0 10 L-6 3 Z" fill="#f5f0e6"/>
    <!-- Blik naar boven-links (terug naar B1, sluit cirkel) -->
    <g opacity="0.65">
      <path d="M-25 -25 L-65 -90" stroke="#a8d5b9" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M-58 -82 L-70 -96 L-52 -90 Z" fill="#a8d5b9"/>
    </g>
  </g>

  <!-- Onderschrift -->
  <g transform="translate(60 615)">
    <rect width="1080" height="60" fill="#072018" stroke="#c0392b" stroke-width="1.5"/>
    <text x="22" y="22" fill="#ffb4a8" font-family="Georgia, serif" font-size="11" letter-spacing="0.22em" font-weight="600">DE CIRKEL</text>
    <text x="22" y="46" fill="#f5f0e6" font-family="Georgia, serif" font-size="17" font-style="italic">
      Iedereen wacht op een ander — die er niet is. De klok tikt, de markt schuift door, de pen blijft liggen.
    </text>
  </g>
</svg>
