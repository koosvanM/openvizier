<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">De voedingslijn — niemand kent de lijn omdat niemand de verkeerde mocht inslaan</title>
  <desc id="desc">Een lange stoet identieke figuren marcheert vanuit de school over een aangewezen pad richting een vork. Geen van hen liep ooit fout. Bij de vork staat een bestuurder met een vraagteken: "Lack of knowledge". Eén keuze cirkelt terug; de andere — onbekend, onbenomen — leidt naar de voedingslijn, die intussen verdort.</desc>

  <!-- ============================================== -->
  <!-- Achtergrond (effen donkergroen, geen gradient) -->
  <!-- ============================================== -->
  <rect width="1600" height="900" fill="#0e3d2e"/>
  <rect y="0" width="1600" height="240" fill="#0a2e22"/>
  <rect y="820" width="1600" height="80" fill="#06180f"/>

  <!-- ============================================== -->
  <!-- TITELBLOK -->
  <!-- ============================================== -->
  <g>
    <text x="60" y="80" fill="#a8d5b9" font-family="Georgia, serif" font-size="18" letter-spacing="0.35em" font-weight="600">★ HAUPTARTIKEL · WAS AUFKOMMT</text>
    <text x="60" y="170" fill="#f5f0e6" font-family="Georgia, serif" font-size="84" font-weight="700">Die Versorgungslinie</text>
    <text x="60" y="215" fill="#f3e9a5" font-family="Georgia, serif" font-size="26" font-style="italic">Alles ist ein Ersatzmarkt</text>
  </g>

  <g transform="translate(900 60)">
    <text x="0" y="20" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" letter-spacing="0.25em" font-weight="600">DIE DOKTRIN</text>
    <text x="0" y="55" fill="#e8efe9" font-family="Georgia, serif" font-size="19" font-style="italic">
      <tspan x="0" dy="0">Niemand is schuld. Niemand durft te beslissen.</tspan>
      <tspan x="0" dy="26">Iedereen wacht op een ander — die er niet is.</tspan>
      <tspan x="0" dy="26">Niemand kent de lijn,</tspan>
      <tspan x="0" dy="26">want niemand mocht ooit de verkeerde inslaan.</tspan>
    </text>
  </g>

  <!-- ============================================== -->
  <!-- HET AANGEWEZEN PAD (effen tint, goed zichtbaar) -->
  <!-- ============================================== -->
  <g transform="translate(0 280)">

    <!-- Pad: brede effen mat (warm beige/zand, contrasteert met groen) -->
    <path d="M80 420 L80 320 L240 320 L240 170 L400 170 L400 60 L560 60 L560 280 L820 280 L820 420 L920 420"
          fill="none" stroke="#3a5045" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 420 L80 320 L240 320 L240 170 L400 170 L400 60 L560 60 L560 280 L820 280 L820 420 L920 420"
          fill="none" stroke="#4a6358" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Witte stippellijn midden -->
    <path d="M80 420 L80 320 L240 320 L240 170 L400 170 L400 60 L560 60 L560 280 L820 280 L820 420 L920 420"
          fill="none" stroke="#f5f0e6" stroke-width="2.5" stroke-dasharray="10 10" opacity="0.9"/>

    <!-- WACHTERS (lichtbruin op donker pad — goed zichtbaar) -->
    <!-- Verticaal opstijgend vanaf school -->
    <g>
      <!-- Elke figuur: hoofd + lichaam -->
      <g transform="translate(70 380)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(70 340)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Horizontaal naar rechts -->
      <g transform="translate(110 312)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(160 312)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(210 312)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Verticaal omhoog (240→170) -->
      <g transform="translate(240 270)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(240 220)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Horizontaal (240→400, y=170) -->
      <g transform="translate(280 162)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(330 162)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(380 162)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Omhoog (400, y=170→60) -->
      <g transform="translate(400 120)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(400 75)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Horizontaal bovenin (400→560, y=60) -->
      <g transform="translate(440 50)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(490 50)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(540 50)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Omlaag (560, y=60→280) -->
      <g transform="translate(560 100)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(560 150)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(560 200)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(560 250)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Horizontaal naar bestuurder (560→820, y=280) -->
      <g transform="translate(610 272)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(660 272)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(710 272)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(760 272)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>

      <!-- Omlaag richting bestuurder (820, y=280→420) -->
      <g transform="translate(820 322)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
      <g transform="translate(820 372)"><circle cx="0" cy="0" r="7" fill="#e8c4a4"/><path d="M-8 6 L-6 38 L6 38 L8 6 Z" fill="#1c5760"/><line x1="0" y1="8" x2="0" y2="28" stroke="#f5f0e6" stroke-width="1.5"/></g>
    </g>

    <!-- LERAAR-PIJLEN (kleine gele richtingsbordjes langs het pad) -->
    <g font-family="Georgia, serif">
      <g transform="translate(45 360)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">↑</text></g>
      <g transform="translate(140 290)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">→</text></g>
      <g transform="translate(275 138)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">→</text></g>
      <g transform="translate(470 30)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">→</text></g>
      <g transform="translate(595 130)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">↓</text></g>
      <g transform="translate(680 260)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">→</text></g>
      <g transform="translate(855 350)"><circle r="11" fill="#f3e9a5" stroke="#0a2620" stroke-width="1.5"/><text y="4" text-anchor="middle" fill="#0a2620" font-size="14" font-weight="700">→</text></g>
    </g>

    <!-- Labels langs het pad -->
    <g fill="#a8d5b9" font-family="Georgia, serif" font-style="italic" opacity="0.95">
      <text x="110" y="460" font-size="13">geen doodlopende straat</text>
      <text x="285" y="195" font-size="13">geen fout geleerd</text>
      <text x="605" y="320" font-size="13">geen ervaring opgedaan</text>
    </g>

    <!-- STARTPUNT: school -->
    <g transform="translate(15 378)">
      <rect x="0" y="0" width="80" height="70" fill="#1c5760" stroke="#a8d5b9" stroke-width="1.5"/>
      <path d="M-4 0 L84 0 L78 -16 L2 -16 Z" fill="#0c4a52" stroke="#a8d5b9" stroke-width="1.5"/>
      <rect x="10" y="12" width="14" height="14" fill="#f3e9a5"/>
      <rect x="32" y="12" width="14" height="14" fill="#f3e9a5"/>
      <rect x="54" y="12" width="14" height="14" fill="#f3e9a5"/>
      <rect x="32" y="36" width="14" height="34" fill="#0a2620"/>
      <text x="40" y="-26" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" letter-spacing="0.18em" font-weight="600">SCHOOL</text>
    </g>

    <!-- =========== EINDE PAD: DE VORK + BESTUURDER =========== -->
    <g transform="translate(900 360)">

      <!-- VRAAGTEKEN BOVEN BESTUURDER -->
      <g>
        <circle cx="0" cy="-100" r="60" fill="#c0392b" opacity="0.18"/>
        <text x="0" y="-65" text-anchor="middle"
              fill="#c0392b" stroke="#5a1410" stroke-width="2"
              font-family="Georgia, serif" font-size="120" font-weight="700">?</text>
        <text x="0" y="-170" text-anchor="middle"
              fill="#ffb4a8" font-family="Georgia, serif" font-size="15"
              letter-spacing="0.3em" font-weight="600">LACK OF KNOWLEDGE</text>
      </g>

      <!-- Bestuurder (volwassen versie van wachter) -->
      <g>
        <ellipse cx="0" cy="118" rx="38" ry="5" fill="#000" opacity="0.45"/>
        <!-- Pak (groter, donkerder) -->
        <path d="M-26 118 L-22 56 Q-18 40 0 40 Q18 40 22 56 L26 118 Z" fill="#1a2530" stroke="#a8d5b9" stroke-width="1.4"/>
        <!-- Stropdas -->
        <path d="M-4 56 L0 72 L4 56 L3 90 L0 96 L-3 90 Z" fill="#5a1410"/>
        <!-- Witte kraag -->
        <path d="M-10 56 L0 68 L10 56 L8 62 L0 70 L-8 62 Z" fill="#f5f0e6"/>
        <!-- Nek -->
        <rect x="-6" y="30" width="12" height="14" fill="#e8c4a4"/>
        <!-- Hoofd -->
        <circle cx="0" cy="20" r="17" fill="#e8c4a4" stroke="#a8d5b9" stroke-width="1"/>
        <!-- Haar -->
        <path d="M-14 16 Q-8 1 0 1 Q11 2 13 17 Q8 9 0 9 Q-9 9 -13 19 Z" fill="#3a2618"/>
        <!-- Bril -->
        <g fill="none" stroke="#1a1a1a" stroke-width="1.6">
          <circle cx="-6" cy="20" r="4"/>
          <circle cx="6" cy="20" r="4"/>
          <line x1="-2" y1="20" x2="2" y2="20"/>
        </g>
        <g fill="#1a1a1a">
          <circle cx="-6" cy="20" r="1"/>
          <circle cx="6" cy="20" r="1"/>
        </g>
        <!-- Mond strak -->
        <line x1="-4" y1="30" x2="4" y2="30" stroke="#1a1a1a" stroke-width="1.2"/>
      </g>

      <!-- KEUZE A: cirkelt naar zichzelf (wacht) -->
      <g>
        <path d="M-40 80 Q-130 60 -150 110 Q-130 130 -50 120"
              fill="none" stroke="#a8d5b9" stroke-width="6" stroke-dasharray="6 5" opacity="0.7"/>
        <path d="M-56 124 L-42 116 L-48 132 Z" fill="#a8d5b9" opacity="0.85"/>
        <text x="-150" y="160" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" font-style="italic">wacht op de ander</text>
      </g>

      <!-- KEUZE B: durven fout te lopen — naar voedingslijn -->
      <g>
        <path d="M45 30 Q160 -10 290 -25 L450 -20"
              fill="none" stroke="#f3e9a5" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
        <path d="M445 -28 L478 -20 L445 -12 Z" fill="#f3e9a5"/>
        <text x="260" y="-50" text-anchor="middle" fill="#f3e9a5" font-family="Georgia, serif" font-size="18" letter-spacing="0.15em" font-weight="700">DURVEN FOUT TE LOPEN</text>
        <text x="260" y="-32" text-anchor="middle" fill="#f3e9a5" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.9">de weg die niemand neemt</text>
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- DE VOEDINGSLIJN (RECHTS, VERDORREND) -->
  <!-- ============================================== -->
  <g transform="translate(1410 360)">
    <text x="0" y="-30" text-anchor="middle" fill="#f3e9a5" font-family="Georgia, serif" font-size="14" letter-spacing="0.3em" font-weight="600">DE VOEDINGSLIJN</text>
    <text x="0" y="-12" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="12" font-style="italic" opacity="0.9">wacht op een besluit dat niet komt</text>

    <!-- Verticale lijn, segmenten van helder naar dood -->
    <line x1="0" y1="10" x2="0" y2="90" stroke="#a8d5b9" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="90" x2="0" y2="175" stroke="#d9f0c4" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="175" x2="0" y2="260" stroke="#e8d99a" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <line x1="0" y1="260" x2="0" y2="345" stroke="#8a8a85" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <line x1="0" y1="345" x2="0" y2="430" stroke="#4a4a47" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

    <!-- Schakels — illustratie + cirkel -->
    <g>
      <circle cx="0" cy="20" r="34" fill="#0a2620" stroke="#a8d5b9" stroke-width="2.5"/>
      <g transform="translate(-22 -2)">
        <path d="M22 38 L22 12" stroke="#a8d5b9" stroke-width="2"/>
        <ellipse cx="22" cy="14" rx="4" ry="7" fill="#a8d5b9"/>
        <ellipse cx="16" cy="20" rx="3" ry="6" fill="#a8d5b9" transform="rotate(-20 16 20)"/>
        <ellipse cx="28" cy="20" rx="3" ry="6" fill="#a8d5b9" transform="rotate(20 28 20)"/>
      </g>
      <text x="50" y="25" fill="#f5f0e6" font-family="Georgia, serif" font-size="16">Boer</text>
    </g>
    <g>
      <circle cx="0" cy="105" r="34" fill="#0a2620" stroke="#d9f0c4" stroke-width="2.5"/>
      <path d="M-15 122 L-15 102 L0 88 L15 102 L15 122 Z" fill="none" stroke="#d9f0c4" stroke-width="2.2"/>
      <rect x="-6" y="108" width="12" height="14" fill="#d9f0c4" opacity="0.4"/>
      <text x="50" y="110" fill="#f5f0e6" font-family="Georgia, serif" font-size="16">MKB</text>
    </g>
    <g opacity="0.85">
      <circle cx="0" cy="190" r="34" fill="#0a2620" stroke="#e8d99a" stroke-width="2.5"/>
      <rect x="-18" y="180" width="36" height="22" fill="none" stroke="#e8d99a" stroke-width="2"/>
      <path d="M-20 180 L20 180 L17 172 L-17 172 Z" fill="none" stroke="#e8d99a" stroke-width="2"/>
      <line x1="-7" y1="180" x2="-7" y2="202" stroke="#e8d99a" stroke-width="1.3"/>
      <line x1="7" y1="180" x2="7" y2="202" stroke="#e8d99a" stroke-width="1.3"/>
      <text x="50" y="195" fill="#f5f0e6" font-family="Georgia, serif" font-size="16">Supermarkt</text>
    </g>
    <g opacity="0.65">
      <circle cx="0" cy="275" r="34" fill="#0a2620" stroke="#a89e88" stroke-width="2.5" stroke-dasharray="5 4"/>
      <circle cx="0" cy="275" r="12" fill="none" stroke="#a89e88" stroke-width="3"/>
      <g fill="#a89e88">
        <rect x="-2" y="258" width="4" height="6"/>
        <rect x="-2" y="287" width="4" height="6"/>
        <rect x="-17" y="273" width="6" height="4"/>
        <rect x="11" y="273" width="6" height="4"/>
      </g>
      <text x="50" y="280" fill="#cfc8b8" font-family="Georgia, serif" font-size="16">Ingenieur</text>
    </g>
    <g opacity="0.5">
      <circle cx="0" cy="360" r="34" fill="#0a1610" stroke="#6b6b66" stroke-width="2.5"/>
      <path d="M-16 374 L0 354 L16 374 L16 386 L-16 386 Z" fill="none" stroke="#6b6b66" stroke-width="2.2"/>
      <rect x="-6" y="372" width="12" height="14" fill="#6b6b66" opacity="0.4"/>
      <text x="50" y="365" fill="#8a8a85" font-family="Georgia, serif" font-size="16">Gezin</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- ONDERSTE BOODSCHAPBALK -->
  <!-- ============================================== -->
  <g transform="translate(60 790)">
    <rect width="1480" height="58" fill="#072018" stroke="#c0392b" stroke-width="1.5"/>
    <text x="22" y="22" fill="#ffb4a8" font-family="Georgia, serif" font-size="12" letter-spacing="0.22em" font-weight="600">DE DOORBRAAK</text>
    <text x="22" y="46" fill="#f5f0e6" font-family="Georgia, serif" font-size="18" font-style="italic">
      Een opleiding zonder doodlopende straten produceert bestuurders zonder besluit — doorbraak begint bij durven fout te lopen.
    </text>
  </g>
</svg>
