<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">Het kompas wijst nog naar gisteren</title>
  <desc id="d">Een ouderwets kompas wijst onveranderlijk naar het N van curriculum 2018; de gekompasseerde route loopt strak omhoog en eindigt in een afgrond. De wereld zelf is intussen gedraaid — het instrument is fout, niet de bestuurder.</desc>

  <!-- Achtergrond -->
  <rect width="1200" height="700" fill="#0e3d2e"/>
  <rect y="0" width="1200" height="80" fill="#0a2e22"/>

  <!-- Titel -->
  <text x="60" y="48" fill="#a8d5b9" font-family="Georgia, serif" font-size="14" letter-spacing="0.3em" font-weight="600">DE STILSTAND · ILLUSTRATIE III</text>
  <text x="60" y="74" fill="#f5f0e6" font-family="Georgia, serif" font-size="28" font-weight="700">Het kompas wijst nog naar gisteren</text>

  <!-- ====== LINKS: HET OUDE KOMPAS ====== -->
  <g transform="translate(280 400)">
    <text x="0" y="-200" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" letter-spacing="0.25em" font-weight="600">HET INSTRUMENT</text>
    <text x="0" y="-178" text-anchor="middle" fill="#e8efe9" font-family="Georgia, serif" font-size="16" font-style="italic">Curriculum 2018 · denken uit 2008</text>

    <!-- Kompas -->
    <circle r="135" fill="#1c5760" stroke="#a8d5b9" stroke-width="3"/>
    <circle r="122" fill="#0a2620" stroke="#a8d5b9" stroke-width="1"/>

    <g font-family="Georgia, serif" fill="#a8d5b9" font-size="17" font-weight="700">
      <text x="0" y="-100" text-anchor="middle">N</text>
      <text x="100" y="7" text-anchor="middle">O</text>
      <text x="0" y="113" text-anchor="middle">S</text>
      <text x="-100" y="7" text-anchor="middle">W</text>
    </g>

    <g font-family="Georgia, serif" fill="#6b8a7e" font-size="10" opacity="0.85">
      <text x="55" y="-65" text-anchor="middle">staal</text>
      <text x="80" y="-28" text-anchor="middle">groei</text>
      <text x="80" y="35" text-anchor="middle">arbeid</text>
      <text x="55" y="73" text-anchor="middle">subsidie</text>
      <text x="-55" y="73" text-anchor="middle">behoud</text>
      <text x="-80" y="35" text-anchor="middle">overleg</text>
      <text x="-80" y="-28" text-anchor="middle">protocol</text>
      <text x="-55" y="-65" text-anchor="middle">commissie</text>
    </g>

    <!-- Naald -->
    <path d="M0 0 L0 -88 L-7 -76 L0 -88 L7 -76 Z" fill="#c0392b" stroke="#5a1410" stroke-width="1.2"/>
    <path d="M0 0 L0 88 L-7 76 L0 88 L7 76 Z" fill="#f5f0e6" stroke="#a8d5b9" stroke-width="1.2"/>
    <circle r="8" fill="#f3e9a5" stroke="#1a1a1a" stroke-width="1.5"/>

    <text x="0" y="180" text-anchor="middle" fill="#ffb4a8" font-family="Georgia, serif" font-size="14" font-style="italic">wijst nog altijd naar N</text>
  </g>

  <!-- ====== PAD MET AFGROND (loopt naar rechtsboven) ====== -->
  <g transform="translate(450 380)">
    <!-- Pad -->
    <path d="M0 40 Q120 -10 280 -50 Q420 -85 600 -120" fill="none" stroke="#4a6358" stroke-width="42" stroke-linecap="round"/>
    <path d="M0 40 Q120 -10 280 -50 Q420 -85 600 -120" fill="none" stroke="#f5f0e6" stroke-width="2.5" stroke-dasharray="10 10" opacity="0.85"/>

    <!-- Label op het pad -->
    <text x="180" y="0" fill="#a8d5b9" font-family="Georgia, serif" font-size="15" font-style="italic" opacity="0.95">"de aangewezen weg"</text>
    <text x="180" y="18" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" opacity="0.7">door geen ervaring gevoed</text>

    <!-- Klif aan het eind -->
    <g transform="translate(600 -120)">
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#a8d5b9" stroke-width="4"/>
      <text x="0" y="-30" text-anchor="middle" fill="#ffb4a8" font-family="Georgia, serif" font-size="16" letter-spacing="0.18em" font-weight="700">DE AFGROND</text>
      <text x="0" y="-12" text-anchor="middle" fill="#e8efe9" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">2032 · geen banen · geen voedingslijn</text>

      <!-- Vallende stippen -->
      <g fill="#c0392b" opacity="0.75">
        <circle cx="-12" cy="25" r="3"/>
        <circle cx="-2" cy="45" r="3"/>
        <circle cx="-15" cy="72" r="2.5"/>
        <circle cx="6" cy="98" r="3"/>
        <circle cx="-8" cy="125" r="2.5"/>
        <circle cx="4" cy="155" r="2.5"/>
        <circle cx="-10" cy="185" r="2"/>
      </g>
    </g>
  </g>

  <!-- ====== STEMPEL: HET INSTRUMENT IS FOUT ====== -->
  <g transform="translate(900 510)">
    <rect width="240" height="80" rx="3" fill="#072018" stroke="#f3e9a5" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" fill="#f3e9a5" font-family="Georgia, serif" font-size="13" letter-spacing="0.2em" font-weight="600">DE DIAGNOSE</text>
    <text x="120" y="52" text-anchor="middle" fill="#f5f0e6" font-family="Georgia, serif" font-size="16" font-style="italic">Het instrument is fout —</text>
    <text x="120" y="70" text-anchor="middle" fill="#f5f0e6" font-family="Georgia, serif" font-size="16" font-style="italic">niet de bestuurder.</text>
  </g>

  <!-- Onderschrift -->
  <g transform="translate(60 615)">
    <rect width="1080" height="60" fill="#072018" stroke="#c0392b" stroke-width="1.5"/>
    <text x="22" y="22" fill="#ffb4a8" font-family="Georgia, serif" font-size="11" letter-spacing="0.22em" font-weight="600">DE OORZAAK</text>
    <text x="22" y="46" fill="#f5f0e6" font-family="Georgia, serif" font-size="17" font-style="italic">Een opleiding voor het verleden produceert wijzers naar het oude noorden — terwijl de markt al gedraaid is.</text>
  </g>
</svg>
