<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">Het snelheidsgat — China 2 maanden, Nederland 5 tot 7 jaar</title>
  <desc id="d">Vergelijkende tijdbalken: China rolt een besluit in 2 maanden uit (groene korte staaf); Duitsland 12-18 maanden; Nederland 5-7 jaar (rode lange staaf). Onderaan: terwijl wij overleggen, schuift de markt door — wij lopen achter de kar aan.</desc>

  <!-- Achtergrond -->
  <rect width="1200" height="700" fill="#0e3d2e"/>
  <rect y="0" width="1200" height="80" fill="#0a2e22"/>

  <!-- Titel -->
  <text x="60" y="48" fill="#a8d5b9" font-family="Georgia, serif" font-size="14" letter-spacing="0.3em" font-weight="600">DE STILSTAND · ILLUSTRATIE II</text>
  <text x="60" y="74" fill="#f5f0e6" font-family="Georgia, serif" font-size="28" font-weight="700">Het snelheidsgat</text>

  <!-- Subtitel -->
  <text x="60" y="125" fill="#e8efe9" font-family="Georgia, serif" font-size="18" font-style="italic">Van besluit tot uitrol — hoe lang duurt het, in dezelfde sector?</text>

  <!-- Tijd-as bovenaan -->
  <g transform="translate(280 175)" font-family="Georgia, serif">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#a8d5b9" stroke-width="1.5"/>
    <!-- Tijdmerken -->
    <g fill="#a8d5b9" font-size="12">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#a8d5b9"/>
      <text x="0" y="-12" text-anchor="middle">0</text>
      <line x1="100" y1="-5" x2="100" y2="5" stroke="#a8d5b9"/>
      <text x="100" y="-12" text-anchor="middle">6 mnd</text>
      <line x1="200" y1="-5" x2="200" y2="5" stroke="#a8d5b9"/>
      <text x="200" y="-12" text-anchor="middle">1 jaar</text>
      <line x1="400" y1="-5" x2="400" y2="5" stroke="#a8d5b9"/>
      <text x="400" y="-12" text-anchor="middle">2 jaar</text>
      <line x1="600" y1="-5" x2="600" y2="5" stroke="#a8d5b9"/>
      <text x="600" y="-12" text-anchor="middle">3 jaar</text>
      <line x1="800" y1="-5" x2="800" y2="5" stroke="#a8d5b9"/>
      <text x="800" y="-12" text-anchor="middle">4+ jaar</text>
    </g>
  </g>

  <!-- ====== CHINA: 2 maanden ====== -->
  <g transform="translate(280 220)">
    <!-- Label links -->
    <text x="-220" y="32" fill="#a8d5b9" font-family="Georgia, serif" font-size="20" font-weight="700">CHINA</text>
    <text x="-220" y="54" fill="#a8d5b9" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">centraal besluit · dwang</text>
    <!-- Staaf -->
    <rect x="0" y="14" width="34" height="40" fill="#a8d5b9"/>
    <!-- Eindpunt label -->
    <text x="44" y="40" fill="#f3e9a5" font-family="Georgia, serif" font-size="20" font-weight="700">2 maanden</text>
    <text x="44" y="60" fill="#e8efe9" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">EV-fabriek tot productie · curriculum-update · subsidieschema</text>
  </g>

  <!-- ====== DUITSLAND: 12-18 maanden ====== -->
  <g transform="translate(280 320)">
    <text x="-220" y="32" fill="#e8efe9" font-family="Georgia, serif" font-size="20" font-weight="700">DUITSLAND</text>
    <text x="-220" y="54" fill="#e8efe9" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">Mittelstand · Bundesländer</text>
    <!-- Staaf -->
    <rect x="0" y="14" width="250" height="40" fill="#f3e9a5"/>
    <text x="260" y="40" fill="#f3e9a5" font-family="Georgia, serif" font-size="20" font-weight="700">12 – 18 maanden</text>
    <text x="260" y="60" fill="#e8efe9" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">snel genoeg voor reactie · te traag voor leiderschap</text>
  </g>

  <!-- ====== NEDERLAND: 5-7 jaar ====== -->
  <g transform="translate(280 420)">
    <text x="-220" y="32" fill="#ffb4a8" font-family="Georgia, serif" font-size="20" font-weight="700">NEDERLAND</text>
    <text x="-220" y="54" fill="#ffb4a8" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.85">polderoverleg · stikstof · juridisch</text>
    <!-- Staaf (uitlopend) -->
    <rect x="0" y="14" width="820" height="40" fill="#c0392b"/>
    <!-- Pijl-uitloop -->
    <path d="M820 14 L860 34 L820 54 Z" fill="#c0392b"/>
    <text x="430" y="40" text-anchor="middle" fill="#f5f0e6" font-family="Georgia, serif" font-size="22" font-weight="700">5 – 7 jaar · en verder</text>
  </g>

  <!-- Markering: "wat in deze tijd in NL gebeurt": niets" -->
  <g transform="translate(280 510)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#ffb4a8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
    <text x="0" y="22" fill="#ffb4a8" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.9">
      In dit interval: 35 inspraakrondes · 8 evaluatiecommissies · 3 nieuwe StemWijzers · 0 fabrieken
    </text>
  </g>

  <!-- Onderschrift -->
  <g transform="translate(60 615)">
    <rect width="1080" height="60" fill="#072018" stroke="#c0392b" stroke-width="1.5"/>
    <text x="22" y="22" fill="#ffb4a8" font-family="Georgia, serif" font-size="11" letter-spacing="0.22em" font-weight="600">DE PRIJS VAN OVERLEG</text>
    <text x="22" y="46" fill="#f5f0e6" font-family="Georgia, serif" font-size="17" font-style="italic">
      Als wij er twee jaar over doen wat anderen in twee maanden doen, lopen wij constant achter de kar aan.
    </text>
  </g>
</svg>
