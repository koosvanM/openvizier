<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Het immuunsysteem dat gezonde cellen aanvalt — auto-immuunreactie als metafoor</title>
  <desc id="d">Een gezonde lichaamseigen cel draagt een glanzend gouden idee. Vier aggressieve T-cellen omsingelen hem en vuren antilichaam-projectielen af. Op de achtergrond passeren echte pathogenen (donkergrijze gestekelde virussen) ongemoeid. Links de uitgestoten innovaties (BiCRS, SMR, CRISPR, soevereine cloud, VMP); rechts de vijf reflexen van de auto-immuunreactie. Boodschap: het systeem stoot gezonde cellen uit en laat pathogenen door.</desc>

  <!-- Achtergrond effen -->
  <rect width="1600" height="900" fill="#0a2620"/>
  <rect y="0" width="1600" height="320" fill="#06180f"/>

  <!-- Subtiele celwand-suggesties -->
  <g opacity="0.10" fill="none" stroke="#a8d5b9" stroke-width="1">
    <circle cx="200" cy="200" r="40"/>
    <circle cx="350" cy="120" r="55"/>
    <circle cx="1400" cy="180" r="48"/>
    <circle cx="1500" cy="350" r="38"/>
    <circle cx="180" cy="750" r="50"/>
    <circle cx="1450" cy="780" r="42"/>
  </g>

  <!-- ====== TITELBLOK ====== -->
  <g>
    <text x="60" y="80" fill="#ffb4a8" font-family="Georgia, serif" font-size="17" letter-spacing="0.32em" font-weight="600">★ MEINUNG · WAS AUFKOMMT</text>
    <text x="60" y="170" fill="#f5f0e6" font-family="Georgia, serif" font-size="60" font-weight="700">Das Immunsystem</text>
    <text x="60" y="225" fill="#f5f0e6" font-family="Georgia, serif" font-size="48" font-weight="700">das gesunde Zellen angreift</text>
    <text x="60" y="270" fill="#f3e9a5" font-family="Georgia, serif" font-size="22" font-style="italic">Nicht aus bösem Willen — aus Selbsterhaltung</text>
  </g>

  <!-- ====== PATHOGENEN OP ACHTERGROND (passeren ongemoeid) ====== -->
  <!-- Pathogeen 1: linksboven -->
  <g transform="translate(180 220)" opacity="0.75">
    <circle r="22" fill="#2a2a25" stroke="#4a4a3a" stroke-width="2"/>
    <g stroke="#3a3a30" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-36"/>
      <line x1="0" y1="22" x2="0" y2="36"/>
      <line x1="-22" y1="0" x2="-36" y2="0"/>
      <line x1="22" y1="0" x2="36" y2="0"/>
      <line x1="-16" y1="-16" x2="-28" y2="-28"/>
      <line x1="16" y1="-16" x2="28" y2="-28"/>
      <line x1="-16" y1="16" x2="-28" y2="28"/>
      <line x1="16" y1="16" x2="28" y2="28"/>
    </g>
    <g fill="#4a4a3a">
      <circle cx="0" cy="-36" r="3"/>
      <circle cx="0" cy="36" r="3"/>
      <circle cx="-36" cy="0" r="3"/>
      <circle cx="36" cy="0" r="3"/>
    </g>
    <text x="0" y="62" text-anchor="middle" fill="#8a8a85" font-family="Georgia, serif" font-size="11" font-style="italic">passeert ongemoeid</text>
  </g>

  <!-- Pathogeen 2: linksonder -->
  <g transform="translate(150 780)" opacity="0.6">
    <circle r="16" fill="#2a2a25" stroke="#4a4a3a" stroke-width="1.5"/>
    <g stroke="#3a3a30" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-16" x2="0" y2="-26"/>
      <line x1="0" y1="16" x2="0" y2="26"/>
      <line x1="-16" y1="0" x2="-26" y2="0"/>
      <line x1="16" y1="0" x2="26" y2="0"/>
    </g>
  </g>

  <!-- Pathogeen 3: rechtsboven -->
  <g transform="translate(1450 230)" opacity="0.65">
    <circle r="18" fill="#2a2a25" stroke="#4a4a3a" stroke-width="1.5"/>
    <g stroke="#3a3a30" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="-30"/>
      <line x1="0" y1="18" x2="0" y2="30"/>
      <line x1="-18" y1="0" x2="-30" y2="0"/>
      <line x1="18" y1="0" x2="30" y2="0"/>
      <line x1="-13" y1="-13" x2="-22" y2="-22"/>
      <line x1="13" y1="13" x2="22" y2="22"/>
    </g>
  </g>

  <!-- ====== CENTRALE COMPOSITIE: gezonde cel onder aanval ====== -->
  <g transform="translate(800 530)">

    <!-- Gouden aura achter alles -->
    <circle r="280" fill="#f3e9a5" opacity="0.08"/>
    <circle r="200" fill="#f3e9a5" opacity="0.12"/>

    <!-- GEZONDE CEL: groot, lichtgroen, met membraan -->
    <circle r="155" fill="#3a6850" stroke="#a8d5b9" stroke-width="4"/>
    <circle r="145" fill="#5a8870" stroke="none"/>
    <circle r="135" fill="#7ab089" opacity="0.7" stroke="none"/>

    <!-- Membraan-puntjes -->
    <g fill="#d9f0c4">
      <circle cx="0" cy="-152" r="4"/>
      <circle cx="76" cy="-132" r="4"/>
      <circle cx="132" cy="-76" r="4"/>
      <circle cx="152" cy="0" r="4"/>
      <circle cx="132" cy="76" r="4"/>
      <circle cx="76" cy="132" r="4"/>
      <circle cx="0" cy="152" r="4"/>
      <circle cx="-76" cy="132" r="4"/>
      <circle cx="-132" cy="76" r="4"/>
      <circle cx="-152" cy="0" r="4"/>
      <circle cx="-132" cy="-76" r="4"/>
      <circle cx="-76" cy="-132" r="4"/>
    </g>

    <!-- Mitochondriën (organellen) -->
    <g fill="#d9f0c4" opacity="0.6">
      <ellipse cx="-70" cy="-50" rx="16" ry="8" transform="rotate(-30 -70 -50)"/>
      <ellipse cx="75" cy="-35" rx="16" ry="8" transform="rotate(40 75 -35)"/>
      <ellipse cx="-60" cy="75" rx="16" ry="8" transform="rotate(20 -60 75)"/>
      <ellipse cx="65" cy="80" rx="16" ry="8" transform="rotate(-30 65 80)"/>
      <ellipse cx="0" cy="105" rx="14" ry="7"/>
    </g>

    <!-- Celkern -->
    <circle r="60" fill="#f3e9a5" stroke="#b89a2a" stroke-width="3"/>
    <circle r="50" fill="#fff8c4"/>

    <!-- Gloeiend idee-symbool (ster) -->
    <g transform="translate(0 -3)">
      <path d="M0 -32 L8 -10 L32 -10 L13 4 L20 26 L0 12 L-20 26 L-13 4 L-32 -10 L-8 -10 Z"
            fill="#f3e9a5" stroke="#b89a2a" stroke-width="2"/>
      <path d="M0 -22 L5 -8 L20 -8 L8 2 L13 16 L0 7 L-13 16 L-8 2 L-20 -8 L-5 -8 Z"
            fill="#fff8c4" opacity="0.7"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#6b5510" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="0.25em">IDEE</text>

    <!-- ====== T-CELLEN (immuuncellen rood) — 4 stuks ====== -->

    <!-- T-cel linksboven -->
    <g transform="translate(-250 -190)">
      <circle r="48" fill="#c0392b" opacity="0.18"/>
      <circle r="34" fill="#c0392b" stroke="#5a1410" stroke-width="2.5"/>
      <circle r="33" fill="#a82a1f"/>
      <!-- Receptoren -->
      <g stroke="#5a1410" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-48"/>
        <line x1="24" y1="-24" x2="34" y2="-34"/>
        <line x1="34" y1="0" x2="48" y2="0"/>
        <line x1="24" y1="24" x2="34" y2="34"/>
        <line x1="0" y1="34" x2="0" y2="48"/>
        <line x1="-24" y1="24" x2="-34" y2="34"/>
        <line x1="-34" y1="0" x2="-48" y2="0"/>
        <line x1="-24" y1="-24" x2="-34" y2="-34"/>
      </g>
      <!-- Receptor-tippen (Y-vorm) -->
      <g fill="#5a1410">
        <circle cx="0" cy="-48" r="3"/>
        <circle cx="34" cy="-34" r="3"/>
        <circle cx="48" cy="0" r="3"/>
        <circle cx="34" cy="34" r="3"/>
        <circle cx="0" cy="48" r="3"/>
        <circle cx="-34" cy="34" r="3"/>
        <circle cx="-48" cy="0" r="3"/>
        <circle cx="-34" cy="-34" r="3"/>
      </g>
      <!-- Donkerder centrum -->
      <circle r="14" fill="#5a1410"/>
      <!-- Glanseffect -->
      <ellipse cx="-10" cy="-10" rx="7" ry="5" fill="#ffd4c2" opacity="0.4"/>
    </g>

    <!-- T-cel rechtsboven -->
    <g transform="translate(250 -190)">
      <circle r="48" fill="#c0392b" opacity="0.18"/>
      <circle r="34" fill="#c0392b" stroke="#5a1410" stroke-width="2.5"/>
      <circle r="33" fill="#a82a1f"/>
      <g stroke="#5a1410" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-48"/>
        <line x1="24" y1="-24" x2="34" y2="-34"/>
        <line x1="34" y1="0" x2="48" y2="0"/>
        <line x1="24" y1="24" x2="34" y2="34"/>
        <line x1="0" y1="34" x2="0" y2="48"/>
        <line x1="-24" y1="24" x2="-34" y2="34"/>
        <line x1="-34" y1="0" x2="-48" y2="0"/>
        <line x1="-24" y1="-24" x2="-34" y2="-34"/>
      </g>
      <g fill="#5a1410">
        <circle cx="0" cy="-48" r="3"/>
        <circle cx="34" cy="-34" r="3"/>
        <circle cx="48" cy="0" r="3"/>
        <circle cx="34" cy="34" r="3"/>
        <circle cx="0" cy="48" r="3"/>
        <circle cx="-34" cy="34" r="3"/>
        <circle cx="-48" cy="0" r="3"/>
        <circle cx="-34" cy="-34" r="3"/>
      </g>
      <circle r="14" fill="#5a1410"/>
      <ellipse cx="-10" cy="-10" rx="7" ry="5" fill="#ffd4c2" opacity="0.4"/>
    </g>

    <!-- T-cel linksonder -->
    <g transform="translate(-240 150)">
      <circle r="48" fill="#c0392b" opacity="0.18"/>
      <circle r="34" fill="#c0392b" stroke="#5a1410" stroke-width="2.5"/>
      <circle r="33" fill="#a82a1f"/>
      <g stroke="#5a1410" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-48"/>
        <line x1="24" y1="-24" x2="34" y2="-34"/>
        <line x1="34" y1="0" x2="48" y2="0"/>
        <line x1="24" y1="24" x2="34" y2="34"/>
        <line x1="0" y1="34" x2="0" y2="48"/>
        <line x1="-24" y1="24" x2="-34" y2="34"/>
        <line x1="-34" y1="0" x2="-48" y2="0"/>
        <line x1="-24" y1="-24" x2="-34" y2="-34"/>
      </g>
      <g fill="#5a1410">
        <circle cx="0" cy="-48" r="3"/>
        <circle cx="34" cy="-34" r="3"/>
        <circle cx="48" cy="0" r="3"/>
        <circle cx="34" cy="34" r="3"/>
        <circle cx="0" cy="48" r="3"/>
        <circle cx="-34" cy="34" r="3"/>
        <circle cx="-48" cy="0" r="3"/>
        <circle cx="-34" cy="-34" r="3"/>
      </g>
      <circle r="14" fill="#5a1410"/>
      <ellipse cx="-10" cy="-10" rx="7" ry="5" fill="#ffd4c2" opacity="0.4"/>
    </g>

    <!-- T-cel rechtsonder -->
    <g transform="translate(240 150)">
      <circle r="48" fill="#c0392b" opacity="0.18"/>
      <circle r="34" fill="#c0392b" stroke="#5a1410" stroke-width="2.5"/>
      <circle r="33" fill="#a82a1f"/>
      <g stroke="#5a1410" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-48"/>
        <line x1="24" y1="-24" x2="34" y2="-34"/>
        <line x1="34" y1="0" x2="48" y2="0"/>
        <line x1="24" y1="24" x2="34" y2="34"/>
        <line x1="0" y1="34" x2="0" y2="48"/>
        <line x1="-24" y1="24" x2="-34" y2="34"/>
        <line x1="-34" y1="0" x2="-48" y2="0"/>
        <line x1="-24" y1="-24" x2="-34" y2="-34"/>
      </g>
      <g fill="#5a1410">
        <circle cx="0" cy="-48" r="3"/>
        <circle cx="34" cy="-34" r="3"/>
        <circle cx="48" cy="0" r="3"/>
        <circle cx="34" cy="34" r="3"/>
        <circle cx="0" cy="48" r="3"/>
        <circle cx="-34" cy="34" r="3"/>
        <circle cx="-48" cy="0" r="3"/>
        <circle cx="-34" cy="-34" r="3"/>
      </g>
      <circle r="14" fill="#5a1410"/>
      <ellipse cx="-10" cy="-10" rx="7" ry="5" fill="#ffd4c2" opacity="0.4"/>
    </g>

    <!-- ====== ANTILICHAAM-PROJECTIELEN (rode lijnen die afgevuurd worden) ====== -->
    <!-- van LB naar cel -->
    <g stroke="#c0392b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="-210" y1="-160" x2="-115" y2="-75"/>
      <line x1="-205" y1="-145" x2="-110" y2="-60"/>
    </g>
    <!-- van RB naar cel -->
    <g stroke="#c0392b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="210" y1="-160" x2="115" y2="-75"/>
      <line x1="205" y1="-145" x2="110" y2="-60"/>
    </g>
    <!-- van LO naar cel -->
    <g stroke="#c0392b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="-200" y1="120" x2="-110" y2="55"/>
      <line x1="-200" y1="135" x2="-110" y2="70"/>
    </g>
    <!-- van RO naar cel -->
    <g stroke="#c0392b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="200" y1="120" x2="110" y2="55"/>
      <line x1="200" y1="135" x2="110" y2="70"/>
    </g>

    <!-- Inslag-effecten op de gezonde cel -->
    <g>
      <circle cx="-110" cy="-70" r="7" fill="#c0392b"/>
      <circle cx="-110" cy="-70" r="14" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.6"/>
      <circle cx="110" cy="-70" r="7" fill="#c0392b"/>
      <circle cx="110" cy="-70" r="14" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.6"/>
      <circle cx="-110" cy="60" r="6" fill="#c0392b"/>
      <circle cx="-110" cy="60" r="12" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.6"/>
      <circle cx="110" cy="60" r="6" fill="#c0392b"/>
      <circle cx="110" cy="60" r="12" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Labels op T-cellen -->
    <g fill="#ffb4a8" font-family="Georgia, serif" font-size="11" letter-spacing="0.15em" font-weight="600" text-anchor="middle">
      <text x="-250" y="-250">T-CEL</text>
      <text x="250" y="-250">T-CEL</text>
      <text x="-240" y="220">T-CEL</text>
      <text x="240" y="220">T-CEL</text>
    </g>

    <!-- Label gezonde cel -->
    <text x="0" y="205" text-anchor="middle" fill="#d9f0c4" font-family="Georgia, serif" font-size="14" letter-spacing="0.25em" font-weight="700">LICHAAMSEIGEN CEL</text>
    <text x="0" y="226" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="12" font-style="italic">draagt een gezond, innovatief idee</text>
  </g>

  <!-- ====== LINKS: lijst uitgestoten innovaties ====== -->
  <g transform="translate(60 360)">
    <rect x="0" y="0" width="280" height="340" fill="#072018" stroke="#a8d5b9" stroke-width="1.5"/>
    <text x="140" y="32" text-anchor="middle" fill="#a8d5b9" font-family="Georgia, serif" font-size="12" letter-spacing="0.2em" font-weight="600">UITGESTOTEN UIT EUROPA</text>
    <line x1="40" y1="46" x2="240" y2="46" stroke="#a8d5b9" stroke-width="1" opacity="0.4"/>

    <g font-family="Georgia, serif">
      <g transform="translate(20 78)">
        <circle cx="0" cy="-5" r="4" fill="#f3e9a5"/>
        <text x="16" y="0" font-size="14" fill="#f5f0e6" font-weight="700">BiCRS</text>
        <text x="16" y="20" font-size="11" fill="#a8d5b9" font-style="italic">biomass → ethanol-kringloop</text>
      </g>
      <g transform="translate(20 138)">
        <circle cx="0" cy="-5" r="4" fill="#f3e9a5"/>
        <text x="16" y="0" font-size="14" fill="#f5f0e6" font-weight="700">SMR / thorium</text>
        <text x="16" y="20" font-size="11" fill="#a8d5b9" font-style="italic">moderne kernenergie</text>
      </g>
      <g transform="translate(20 198)">
        <circle cx="0" cy="-5" r="4" fill="#f3e9a5"/>
        <text x="16" y="0" font-size="14" fill="#f5f0e6" font-weight="700">CRISPR-landbouw</text>
        <text x="16" y="20" font-size="11" fill="#a8d5b9" font-style="italic">Europese uitvinding, verboden</text>
      </g>
      <g transform="translate(20 258)">
        <circle cx="0" cy="-5" r="4" fill="#f3e9a5"/>
        <text x="16" y="0" font-size="14" fill="#f5f0e6" font-weight="700">soevereine cloud</text>
        <text x="16" y="20" font-size="11" fill="#a8d5b9" font-style="italic">open-source alternatieven</text>
      </g>
      <g transform="translate(20 318)">
        <circle cx="0" cy="-5" r="4" fill="#f3e9a5"/>
        <text x="16" y="0" font-size="14" fill="#f5f0e6" font-weight="700">VMP</text>
        <text x="16" y="20" font-size="11" fill="#a8d5b9" font-style="italic">vrijwillig-mandaat democratie</text>
      </g>
    </g>
  </g>

  <!-- ====== RECHTS: legenda van de reactie ====== -->
  <g transform="translate(1260 360)">
    <rect x="0" y="0" width="280" height="340" fill="#072018" stroke="#c0392b" stroke-width="1.5"/>
    <text x="140" y="32" text-anchor="middle" fill="#ffb4a8" font-family="Georgia, serif" font-size="12" letter-spacing="0.2em" font-weight="600">DE AUTO-IMMUUN-REACTIE</text>
    <line x1="40" y1="46" x2="240" y2="46" stroke="#ffb4a8" stroke-width="1" opacity="0.4"/>

    <g font-family="Georgia, serif">
      <g transform="translate(20 78)">
        <text font-size="13" font-weight="700" fill="#ffb4a8">1. Kaderverwerking</text>
        <text y="20" font-size="11" font-style="italic" fill="#e8efe9">"niet binnen scope"</text>
      </g>
      <g transform="translate(20 132)">
        <text font-size="13" font-weight="700" fill="#ffb4a8">2. Negatieve framing</text>
        <text y="20" font-size="11" font-style="italic" fill="#e8efe9">"luchtvervuiling, complot"</text>
      </g>
      <g transform="translate(20 186)">
        <text font-size="13" font-weight="700" fill="#ffb4a8">3. Institutionele stilte</text>
        <text y="20" font-size="11" font-style="italic" fill="#e8efe9">"niet mijn portefeuille"</text>
      </g>
      <g transform="translate(20 240)">
        <text font-size="13" font-weight="700" fill="#ffb4a8">4. Eigen taal-onvermogen</text>
        <text y="20" font-size="11" font-style="italic" fill="#e8efe9">"begrijp het niet, dus fout"</text>
      </g>
      <g transform="translate(20 294)">
        <text font-size="13" font-weight="700" fill="#ffb4a8">5. Voorstel verdwijnt</text>
        <text y="20" font-size="11" font-style="italic" fill="#e8efe9">naar Brazilië, China, VS</text>
      </g>
    </g>
  </g>

  <!-- ====== ONDERSCHRIFT ====== -->
  <g transform="translate(60 810)">
    <rect width="1480" height="58" fill="#072018" stroke="#f3e9a5" stroke-width="1.5"/>
    <text x="22" y="22" fill="#f3e9a5" font-family="Georgia, serif" font-size="12" letter-spacing="0.22em" font-weight="600">DE DIAGNOSE</text>
    <text x="22" y="46" fill="#f5f0e6" font-family="Georgia, serif" font-size="17" font-style="italic">
      Het immuunsysteem stoot gezonde cellen uit en laat pathogenen door — niet uit kwaad opzet, uit reflex. Auto-immuun.
    </text>
  </g>
</svg>
