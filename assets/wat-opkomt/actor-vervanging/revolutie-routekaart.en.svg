<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81e3a"/>
      <stop offset="50%" stop-color="#d4b95e"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRev)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">De revolutie-routekaart</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">van zieke instituten naar levend microbioom — niet hervorming, vervanging</text>

  <!-- Diagnose-band links -->
  <g transform="translate(60,140)">
    <rect width="320" height="660" fill="#fff5e8" stroke="#b81e3a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#b81e3a"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">DIAGNOSE</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Auto-immuun-Nederland</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Het lichaam valt zijn eigen gezonde</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">cellen aan. Niet uit kwade wil —</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">uit zelfbehoud van het zieke</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">systeem.</text>

    <text x="20" y="220" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Aangevallen cellen:</text>
    <text x="20" y="245" font-family="Georgia, serif" font-size="12" fill="#4a5263">• De boer (voedsel)</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Het MKB (werk + innovatie)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• De DGA (kapitaalvorming)</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• De vakman (productie)</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• De uitvinder (toekomst)</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• De rebel met kennis</text>

    <text x="20" y="385" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Aanvallende actoren:</text>
    <text x="20" y="410" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Min. Klimaat &amp; Stikstof</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Box-3 rendementsfictie</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CBAM-bureaucratie</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• FNV/CNV (looneis-modus)</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Volgcanon-media</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CPB-modelapparaat</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• GL-PvdA, D66, VVD, CDA, NSC</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8b1e1e">"De actor IS de regel."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Geen hervorming mogelijk:</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">hervormer = te hervormen object.</text>
  </g>

  <!-- PATHWAY — vertikaal middenpad -->
  <g transform="translate(420,140)">
    <!-- Pad-lijn -->
    <line x1="380" y1="50" x2="380" y2="660" stroke="url(#pathGrad)" stroke-width="6"/>

    <!-- Stap 1 -->
    <g transform="translate(0,40)">
      <circle cx="380" cy="50" r="38" fill="#b81e3a" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">1</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">CAR-T-ingreep</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Box-3 rendementsfictie afschaffen,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">CBAM intrekken, stikstof-circuit</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">opheffen.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Eerste 100 dagen</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Specifieke wetten, niet hele</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">ministeries. Gerichte, snelle</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">ingrepen.</text>
    </g>

    <!-- Stap 2 -->
    <g transform="translate(0,180)">
      <circle cx="380" cy="50" r="38" fill="#d4b95e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">2</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Stamcellen vormen</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Buiten de besmette thymus —</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Nova Democratia/VMP als naïeve</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">cellijn, vrij van oude programmering.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Bouwfase (1-3 jaar)</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Ledencultuur, selectiecriteria,</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">interne opleiding op eigenkennis</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">i.p.v. dossierkennis.</text>
    </g>

    <!-- Stap 3 -->
    <g transform="translate(0,320)">
      <circle cx="380" cy="50" r="38" fill="#1c5760" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">3</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Nieuwe organen oprichten</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Bondsraad, vrije academies,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">burger-gefinancierde media,</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">productieve werknemersverenigingen.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Parallelle structuren</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Náást het oude, niet erin —</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">tot het oude electoraal of</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">economisch irrelevant wordt.</text>
    </g>

    <!-- Stap 4 -->
    <g transform="translate(0,460)">
      <circle cx="380" cy="50" r="38" fill="#0e3d2e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">4</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Microbioom voeden</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/ethanol-koolstofkringloop,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">voedselsoevereiniteit, vermogen bij</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">werknemers, productieve munt.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Lange adem</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Scholing voor de toekomst, ruimte</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">voor het oergevoel — Treg-vorming</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">begint in de basisschool.</text>
    </g>

    <!-- Eindpunt -->
    <g transform="translate(0,600)">
      <circle cx="380" cy="50" r="42" fill="#2ea043" stroke="#f5f0e6" stroke-width="4"/>
      <text x="380" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f5f0e6">HERSTELD</text>
      <text x="380" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f5f0e6">organisme</text>
    </g>
  </g>

  <!-- Doel-band rechts -->
  <g transform="translate(1220,140)">
    <rect width="320" height="660" fill="#e8f0e0" stroke="#2ea043" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#2ea043"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">DOEL</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Een levend organisme</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Tregs herkennen eigen weefsel.</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">Productieve cellen worden</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">beschermd. Rebellen worden</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">gelezen als boodschappers,</text>
    <text x="20" y="202" font-family="Georgia, serif" font-size="12" fill="#4a5263">niet als pathogenen.</text>

    <text x="20" y="240" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Nieuwe actoren:</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Bondsraad (kennistegenmacht)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Vrije academies</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Burger-mediastichtingen</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Productieve werknemersbond</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Mede-eigendomsfondsen</text>
    <text x="20" y="365" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Nova Democratia / VMP</text>

    <text x="20" y="405" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Beschermd weefsel:</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Boer met eigen grond</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• MKB met fiscale rust</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• DGA met opvolgingsrecht</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Vakman met scholingsruimte</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Uitvinder met patentkracht</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Kind met intact oergevoel</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0e3d2e">"De cellijn is vervangen."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Het organisme herkent</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">zichzelf weer als levend.</text>
  </g>

  <!-- Onderschrift -->
  <text x="800" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">Geen één stap volstaat. Alleen de combinatie 1+2+3+4, in juiste volgorde, redt het organisme.</text>
  <text x="800" y="872" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b7280">Het Open Vizier · juni 2026 · in vervolg op "Oergevoel", "De voedingslijn" en "Het immuunsysteem dat gezonde cellen aanvalt"</text>
</svg>
