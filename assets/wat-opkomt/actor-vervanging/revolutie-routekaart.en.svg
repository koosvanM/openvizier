<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81e3a"/>
      <stop offset="50%" stop-color="#d4b95e"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRev)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">The revolution roadmap</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">from sick institutions to living microbiome — not reform, replacement</text>

  <!-- Diagnose-band links -->
  <g transform="translate(60,140)">
    <rect width="320" height="660" fill="#fff5e8" stroke="#b81e3a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#b81e3a"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">DIAGNOSIS</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Auto-immune Netherlands</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">The body attacks its own healthy</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">cells. Not out of malice —</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">out of self-preservation of the sick</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">system.</text>

    <text x="20" y="220" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Attacked cells:</text>
    <text x="20" y="245" font-family="Georgia, serif" font-size="12" fill="#4a5263">• The farmer (food)</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• SMEs (work + innovation)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• The DGA (capital formation)</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• The craftsman (production)</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• The inventor (future)</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• The rebel with knowledge</text>

    <text x="20" y="385" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Attacking actors:</text>
    <text x="20" y="410" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Min. Climate &amp; Nitrogen</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Box-3 yield fiction</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CBAM bureaucracy</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• FNV/CNV (wage-demand mode)</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Follow-canon media</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CPB model apparatus</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• GL-PvdA, D66, VVD, CDA, NSC</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8b1e1e">"The actor IS the rule."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">No reform possible:</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">reformer = object to be reformed.</text>
  </g>

  <!-- PATHWAY — vertikaal middenpad -->
  <g transform="translate(420,140)">
    <!-- Pad-lijn -->
    <line x1="380" y1="50" x2="380" y2="660" stroke="url(#pathGrad)" stroke-width="6"/>

    <!-- Stap 1 -->
    <g transform="translate(0,40)">
      <circle cx="380" cy="50" r="38" fill="#b81e3a" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">1</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">CAR-T intervention</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Abolish Box-3 yield fiction,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">withdraw CBAM, dissolve nitrogen</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">circuit.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">First 100 days</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Specific laws, not entire</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">ministries. Targeted, swift</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">interventions.</text>
    </g>

    <!-- Stap 2 -->
    <g transform="translate(0,180)">
      <circle cx="380" cy="50" r="38" fill="#d4b95e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">2</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Forming stem cells</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Outside the infected thymus —</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Nova Democratia/VMP as naive</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">cell line, free from old programming.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Building phase (1-3 years)</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Member culture, selection criteria,</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">internal training on own knowledge</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">instead of dossier knowledge.</text>
    </g>

    <!-- Stap 3 -->
    <g transform="translate(0,320)">
      <circle cx="380" cy="50" r="38" fill="#1c5760" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">3</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Establishing new bodies</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Federal Council, free academies,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">citizen-funded media,</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">productive worker associations.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Parallel structures</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Alongside the old, not within —</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">until the old becomes electorally or</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">economically irrelevant.</text>
    </g>

    <!-- Stap 4 -->
    <g transform="translate(0,460)">
      <circle cx="380" cy="50" r="38" fill="#0e3d2e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">4</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Nourishing the microbiome</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/ethanol carbon cycle,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">food sovereignty, wealth at</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">workers, productive currency.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Long game</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Education for the future, space</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">for the primal sense — Treg formation</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">begins in primary school.</text>
    </g>

    <!-- Eindpunt -->
    <g transform="translate(0,600)">
      <circle cx="380" cy="50" r="42" fill="#2ea043" stroke="#f5f0e6" stroke-width="4"/>
      <text x="380" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f5f0e6">RECOVERED</text>
      <text x="380" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f5f0e6">organism</text>
    </g>
  </g>

  <!-- Doel-band rechts -->
  <g transform="translate(1220,140)">
    <rect width="320" height="660" fill="#e8f0e0" stroke="#2ea043" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#2ea043"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">GOAL</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">A living organism</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Tregs recognise own tissue.</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">Productive cells are</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">protected. Rebels are</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">read as messengers,</text>
    <text x="20" y="202" font-family="Georgia, serif" font-size="12" fill="#4a5263">not as pathogens.</text>

    <text x="20" y="240" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">New actors:</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Federal Council (knowledge counter-power)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Free academies</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Citizen media foundations</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Productive workers union</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Co-ownership funds</text>
    <text x="20" y="365" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Nova Democratia / VMP</text>

    <text x="20" y="405" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Protected tissue:</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Farmer with own land</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• SMEs with fiscal calm</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• DGA with succession rights</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Craftsman with training space</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Inventor with patent strength</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Child with intact primal sense</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0e3d2e">"The cell line is replaced."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">The organism recognises</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">itself again as living.</text>
  </g>

  <!-- Onderschrift -->
  <text x="800" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">No single step suffices. Only the combination 1+2+3+4, in the right order, saves the organism.</text>
  <text x="800" y="872" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b7280">Het Open Vizier · June 2026 · following "Primal Sense", "The Supply Line" and "The Immune System that Attacks Healthy Cells"</text>
</svg>
