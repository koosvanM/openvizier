<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#fff5d8"/>
    </linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8e0"/>
      <stop offset="100%" stop-color="#ffd8c8"/>
    </linearGradient>
    <linearGradient id="row3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d5c0"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="row4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8e8d8"/>
      <stop offset="100%" stop-color="#c0d8c0"/>
    </linearGradient>
    <linearGradient id="row5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8d8b8"/>
      <stop offset="100%" stop-color="#a0c8a0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg2)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">Пять терапий, один принцип</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">от лечения симптомов до замены — медицинской и политической</text>

  <!-- Tabel-kop -->
  <g transform="translate(60,130)">
    <rect width="1480" height="60" fill="#1c5760"/>
    <line x1="180" y1="0" x2="180" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="580" y1="0" x2="580" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="1080" y1="0" x2="1080" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">ГЛУБИНА</text>
    <text x="380" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">МЕДИЦИНСКАЯ ТЕРАПИЯ</text>
    <text x="830" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">ПОЛИТИЧЕСКИЙ ЭКВИВАЛЕНТ</text>
    <text x="1290" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">ЭФФЕКТ &amp; РИСК</text>
  </g>

  <!-- Rij 1: Symptoombestrijding -->
  <g transform="translate(60,190)">
    <rect width="1480" height="155" fill="url(#row1)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <!-- Diepte-kolom: cijfer + label -->
    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b8941a">1</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#6b5510">ПОВЕРХНОСТЬ</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">заглушить сигнал</text>

    <!-- Medisch -->
    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Широкая иммуносупрессия</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Кортикостероиды (преднизон),</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">анти-ФНО, метотрексат,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">ингибиторы JAK.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">Подавляет ВСЕ иммунитет —</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">здоровый и больной вместе.</text>

    <!-- Politiek -->
    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Субсидии и пакеты покупательной способности</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Надбавки, компенсация энергии,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">общее повышение зарплат,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">соглашение за столом покупательной способности.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">VVD, D66, CDA, GL-PvdA, NSC,</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">FNV/CNV — здесь работает ядро.</text>

    <!-- Effect -->
    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Краткосрочно: облегчение.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Долгосрочно: ослабление.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Симптом подавлен — болезнь продолжается.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Пациент становится зависимым от</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">лекарства. Побочные эффекты</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">накапливаются, грозят инфекции.</text>
  </g>

  <!-- Rij 2: CAR-T / selectieve verwijdering -->
  <g transform="translate(60,345)">
    <rect width="1480" height="155" fill="url(#row2)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b81e3a">2</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">ПУТЬ КЛЕТОЧНОЙ ЛИНИИ</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">удалить патоген</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">CAR-T клеточная терапия</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Т-клетки запрограммированы с</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">рецептором (CD19, BCMA), который</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">отключает неправильную B-клеточную линию.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">Волчанка, РС, склеродермия:</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">возможна ремиссия без лекарств.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Демонтаж конкретных институтов</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Фикция дохода Box-3,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CBAM, цикл оценки азота,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">аппарат климатического моделирования.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">JA21, BBB, частично FvD/PVV —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">указывают на патогенную клеточную линию.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Целенаправленно. Эффективно.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Низкий побочный ущерб.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Работает при точной идентификации.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Требует правильных маркеров — иначе</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">также поражаются здоровые клетки.</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">Следующая клеточная линия должна БЫТЬ.</text>
  </g>

  <!-- Rij 3: Stamcel-reset -->
  <g transform="translate(60,500)">
    <rect width="1480" height="155" fill="url(#row3)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#5a3a20">3</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">СБРОС</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">полностью заново</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Аутологичная трансплантация стволовых клеток</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Сбор стволовых клеток, химическое</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">уничтожение иммунной системы,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">возврат собственных стволовых клеток.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">"Сброс" — иногда исцеляющий,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">грубый метод, высокий риск.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Институциональная революция</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Конституционный пересмотр, избирательная</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">реформа, упразднение министерств,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">пересмотр позиции в ЕС.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">Nova Democratia/VMP, части FvD —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">указывают на полный сброс.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Работает — или уничтожает.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Переходная фаза уязвима.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Требует сильной логистики и</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">политического иммунитета против паники.</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">Не для лёгких случаев —</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">но для терминально-рефрактерных.</text>
  </g>

  <!-- Rij 4: Treg - actor-vervanging -->
  <g transform="translate(60,655)">
    <rect width="1480" height="155" fill="url(#row4)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0e3d2e">4</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">ЗАМЕНА</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">новый актор</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Treg-терапия &amp; толерогенные клетки</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Выращивать регуляторные Т-клетки,</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CAR-Tregs направленные на аутоантиген,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">перепрограммировать дендритные клетки.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Не перевоспитывать существующую клетку,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">а создавать новую клеточную популяцию.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Новые акторы рядом со старыми</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Федеральный совет вместо Сената,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">свободные академии, гражданские СМИ,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">органы совладения работников.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Nova Democratia/VMP программно.</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Не реформа, замена.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Устойчиво.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Фундаментально.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Требует времени для построения.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Наивные стволовые клетки ДОЛЖНЫ быть сформированы вне</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">заражённого тимуса,</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">иначе они получат ту же ошибку.</text>
  </g>

  <!-- Rij 5: Microbioom -->
  <g transform="translate(60,810)">
    <rect width="1480" height="155" fill="url(#row5)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0a2620">5</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">КОРЕНЬ</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">основа микробиома</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Питание, микробиом, среда</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Волокна → короткоцепочечные жирные кислоты</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">→ формирование Treg → толерантность.</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">Восстановление стенки кишечника, диета, ритм.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Без этого фундамента</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">ни одна другая терапия не работает длительно.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Экономически-культурный микробиом</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/этанол, продовольственный суверенитет,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">образование для будущего,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">производительная валюта, пространство для первобытного чувства.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Nova Democratia/VMP явно —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">корень всех предыдущих путей.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Работает только с 2 и 4.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Незаменимо для долгосрочного восстановления.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Сброс без питательной базы =</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">пациент всё равно умирает от</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">недоедания. То, что в ребёнке как</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">первобытное чувство было изгнано.</text>
  </g>

  <!-- Slot-band -->
  <g transform="translate(60,990)">
    <rect width="1480" height="80" fill="#0e3d2e"/>
    <text x="740" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">ВЫИГРЫШНАЯ КОМБИНАЦИЯ · CAR-T (2) + замена Treg (4) + восстановление микробиома (5)</text>
    <text x="740" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#a8d5b9">ни один путь в одиночку — кратко зачистить + сформировать новую клеточную линию + восстановить питательную базу. Сброс (3) — последний вариант.</text>
  </g>
