<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <!-- Hero: De vier lagen van uitdrijving, en de vervanging -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2620"/>
      <stop offset="100%" stop-color="#0e3d2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e9a5"/>
      <stop offset="100%" stop-color="#d4b95e"/>
    </linearGradient>
    <radialGradient id="cellGreen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8d5b9"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </radialGradient>
    <radialGradient id="cellRed" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb4a8"/>
      <stop offset="100%" stop-color="#b81e3a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Achtergrond -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Titel -->
  <text x="800" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f5f0e6">De vier lagen van uitdrijving</text>
  <text x="800" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#a8d5b9">van oergevoel tot actor — en de enige weg eruit</text>

  <!-- Verbindingspijl tussen de vier panelen -->
  <line x1="100" y1="500" x2="1500" y2="500" stroke="#a8d5b9" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- ===== LAAG 1: Het kind met oergevoel ===== -->
  <g transform="translate(80,180)">
    <rect width="320" height="280" rx="8" fill="#0a2620" stroke="#a8d5b9" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">LAAG 1 · KIND</text>
    <text x="160" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#a8d5b9">het oergevoel</text>

    <!-- Kindfiguur -->
    <circle cx="160" cy="135" r="28" fill="#f5f0e6"/>
    <rect x="135" y="160" width="50" height="65" rx="6" fill="#f5f0e6"/>
    <!-- Stralenkrans van resonantie -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.85">
      <circle cx="160" cy="155" r="50" stroke-dasharray="3,5"/>
      <circle cx="160" cy="155" r="70" stroke-dasharray="3,5" opacity="0.6"/>
      <circle cx="160" cy="155" r="90" stroke-dasharray="3,5" opacity="0.4"/>
    </g>
    <text x="160" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">directe afstemming,</text>
    <text x="160" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">vóór alle woorden</text>
  </g>

  <!-- Pijl 1 → 2 -->
  <g transform="translate(400,310)">
    <path d="M 0 10 L 50 10" stroke="#a8d5b9" stroke-width="3" fill="none"/>
    <path d="M 45 4 L 55 10 L 45 16 Z" fill="#a8d5b9"/>
    <text x="27" y="-5" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#a8d5b9">scholing</text>
  </g>

  <!-- ===== LAAG 2: De scholing drijft uit ===== -->
  <g transform="translate(460,180)">
    <rect width="320" height="280" rx="8" fill="#0a2620" stroke="#d4b95e" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">LAAG 2 · SCHOLING</text>
    <text x="160" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#d4b95e">drijft uit wat niet meet</text>

    <!-- Klaslokaal: drie rijen banken -->
    <g fill="#4a5263" stroke="#a8d5b9" stroke-width="1">
      <rect x="50" y="120" width="60" height="20"/>
      <rect x="130" y="120" width="60" height="20"/>
      <rect x="210" y="120" width="60" height="20"/>
      <rect x="50" y="155" width="60" height="20"/>
      <rect x="130" y="155" width="60" height="20"/>
      <rect x="210" y="155" width="60" height="20"/>
    </g>
    <!-- Schoolbord -->
    <rect x="80" y="85" width="160" height="22" fill="#1c5760" stroke="#f5f0e6" stroke-width="1"/>
    <text x="160" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">TOETS = WAARHEID</text>

    <!-- Pijl die oergevoel uitdrijft -->
    <g transform="translate(160,200)">
      <path d="M -50 0 L 50 0" stroke="#b81e3a" stroke-width="2.5"/>
      <path d="M 45 -5 L 55 0 L 45 5 Z" fill="#b81e3a"/>
      <text x="0" y="-8" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffb4a8">het oergevoel eruit</text>
    </g>
    <!-- Verdorrende stralenkrans -->
    <g stroke="#b81e3a" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="2,4">
      <circle cx="160" cy="240" r="20"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">enkel cognitief,</text>
  </g>

  <!-- Pijl 2 → 3 -->
  <g transform="translate(780,310)">
    <path d="M 0 10 L 50 10" stroke="#d4b95e" stroke-width="3" fill="none"/>
    <path d="M 45 4 L 55 10 L 45 16 Z" fill="#d4b95e"/>
    <text x="27" y="-5" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#d4b95e">volwassen</text>
  </g>

  <!-- ===== LAAG 3: Volwassene zonder eigenkennis ===== -->
  <g transform="translate(840,180)">
    <rect width="320" height="280" rx="8" fill="#0a2620" stroke="#ffb4a8" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">LAAG 3 · VOLWASSENE</text>
    <text x="160" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ffb4a8">geen eigenkennis,</text>
    <text x="160" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ffb4a8">geen durf</text>

    <!-- Bestuurder met vraagteken -->
    <circle cx="160" cy="145" r="26" fill="#f5f0e6"/>
    <rect x="138" y="170" width="44" height="60" rx="4" fill="#1c5760"/>
    <!-- Stropdas -->
    <polygon points="156,175 164,175 162,210 158,210" fill="#8b1e1e"/>
    <!-- Vraagteken boven hoofd -->
    <text x="160" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#b81e3a">?</text>
    <text x="160" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">"durf om te zeggen</text>
    <text x="160" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#e8efe9">dat het niet klopt"</text>
  </g>

  <!-- Pijl 3 → 4 -->
  <g transform="translate(1160,310)">
    <path d="M 0 10 L 50 10" stroke="#ffb4a8" stroke-width="3" fill="none"/>
    <path d="M 45 4 L 55 10 L 45 16 Z" fill="#ffb4a8"/>
    <text x="27" y="-5" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#ffb4a8">institutie</text>
  </g>

  <!-- ===== LAAG 4: Auto-immuun-actor ===== -->
  <g transform="translate(1220,180)">
    <rect width="320" height="280" rx="8" fill="#0a2620" stroke="#b81e3a" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">LAAG 4 · ACTOR</text>
    <text x="160" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#b81e3a">de regel zelf</text>

    <!-- Auto-immuun cellen omsingelen gezonde cel -->
    <circle cx="160" cy="175" r="32" fill="url(#cellGreen)"/>
    <text x="160" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">gezonde</text>
    <text x="160" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">cel</text>
    <!-- 4 rode T-cellen rondom -->
    <g fill="url(#cellRed)">
      <circle cx="100" cy="135" r="15"/>
      <circle cx="220" cy="135" r="15"/>
      <circle cx="100" cy="215" r="15"/>
      <circle cx="220" cy="215" r="15"/>
    </g>
    <!-- Aanvalspijlen -->
    <g stroke="#b81e3a" stroke-width="2" fill="none">
      <path d="M 115 145 L 135 165"/>
      <path d="M 205 145 L 185 165"/>
      <path d="M 115 205 L 135 185"/>
      <path d="M 205 205 L 185 185"/>
    </g>
    <text x="160" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">auto-antilichamen tegen</text>
    <text x="160" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8efe9">eigen productief weefsel</text>
  </g>

  <!-- ===== ONDERSTE BAND: De enige weg ===== -->
  <g transform="translate(80,560)">
    <rect width="1440" height="280" rx="8" fill="#1c5760" stroke="#f3e9a5" stroke-width="2"/>
    <text x="720" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f3e9a5">DE ENIGE WEG · niet hervorming maar vervanging</text>
    <text x="720" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#a8d5b9">de actor zelf is de regel — daarom werkt geen aanpassing van het bestaande</text>

    <!-- Drie stappen onder elkaar -->
    <g transform="translate(60,110)">
      <!-- Stap 1 -->
      <g>
        <circle cx="40" cy="50" r="32" fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2"/>
        <text x="40" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f5f0e6">1</text>
        <text x="100" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">Verwijder de pathogene cellijn</text>
        <text x="100" y="62" font-family="Georgia, serif" font-size="13" fill="#e8efe9">specifieke instituten ontmantelen — niet hervormen.</text>
        <text x="100" y="80" font-family="Georgia, serif" font-size="13" fill="#e8efe9">Box-3-rendementsfictie, CBAM, klimaat-modelleringscircuit.</text>
      </g>
    </g>

    <g transform="translate(540,110)">
      <!-- Stap 2 -->
      <g>
        <circle cx="40" cy="50" r="32" fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2"/>
        <text x="40" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f5f0e6">2</text>
        <text x="100" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">Vorm naïeve stamcellen</text>
        <text x="100" y="62" font-family="Georgia, serif" font-size="13" fill="#e8efe9">nieuwe actoren náást de bestaande:</text>
        <text x="100" y="80" font-family="Georgia, serif" font-size="13" fill="#e8efe9">Bondsraad, vrije academies, burger-media, productieve munt.</text>
      </g>
    </g>

    <g transform="translate(1020,110)">
      <!-- Stap 3 -->
      <g>
        <circle cx="40" cy="50" r="32" fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2"/>
        <text x="40" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f5f0e6">3</text>
        <text x="100" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">Herstel het microbioom</text>
        <text x="100" y="62" font-family="Georgia, serif" font-size="13" fill="#e8efe9">BiCRS/ethanol, voedselsoevereiniteit,</text>
        <text x="100" y="80" font-family="Georgia, serif" font-size="13" fill="#e8efe9">scholing voor de toekomst — niet voor het verleden.</text>
      </g>
    </g>

    <!-- Slotzin -->
    <text x="720" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#f3e9a5">"Wat in het kind wordt uitgedreven, keert in de instituties terug als auto-antilichaam — de cellijn vervangen is de enige genezing."</text>
  </g>
</svg>
