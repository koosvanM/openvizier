<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81e3a"/>
      <stop offset="50%" stop-color="#d4b95e"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRev)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">Маршрутная карта революции</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">от больных институтов к живому микробиому — не реформа, замена</text>

  <!-- Diagnose-band links -->
  <g transform="translate(60,140)">
    <rect width="320" height="660" fill="#fff5e8" stroke="#b81e3a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#b81e3a"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">ДИАГНОЗ</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Аутоиммунные Нидерланды</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Тело атакует собственные здоровые</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">клетки. Не из злого умысла —</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">из самосохранения больной</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">системы.</text>

    <text x="20" y="220" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Атакуемые клетки:</text>
    <text x="20" y="245" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Фермер (продовольствие)</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• МСП (работа + инновации)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• DGA (формирование капитала)</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Мастер (производство)</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Изобретатель (будущее)</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Бунтарь со знанием</text>

    <text x="20" y="385" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Атакующие акторы:</text>
    <text x="20" y="410" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Мин. Климата &amp; Азота</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Фикция доходности Box-3</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Бюрократия CBAM</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• FNV/CNV (режим требования зарплаты)</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• СМИ-следователи канона</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Модельный аппарат CPB</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• GL-PvdA, D66, VVD, CDA, NSC</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8b1e1e">"Актор ЕСТЬ правило."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Никакая реформа невозможна:</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">реформатор = объект, подлежащий реформированию.</text>
  </g>

  <!-- PATHWAY — vertikaal middenpad -->
  <g transform="translate(420,140)">
    <!-- Pad-lijn -->
    <line x1="380" y1="50" x2="380" y2="660" stroke="url(#pathGrad)" stroke-width="6"/>

    <!-- Stap 1 -->
    <g transform="translate(0,40)">
      <circle cx="380" cy="50" r="38" fill="#b81e3a" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">1</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Вмешательство CAR-T</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Отменить фикцию доходности Box-3,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">отозвать CBAM, ликвидировать азотный</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">цикл.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Первые 100 дней</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Конкретные законы, не целые</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">министерства. Целенаправленные, быстрые</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">вмешательства.</text>
    </g>

    <!-- Stap 2 -->
    <g transform="translate(0,180)">
      <circle cx="380" cy="50" r="38" fill="#d4b95e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">2</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Формирование стволовых клеток</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Вне заражённого тимуса —</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Nova Democratia/VMP как наивная</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">клеточная линия, свободная от старого программирования.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Фаза строительства (1-3 года)</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Культура членства, критерии отбора,</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">внутреннее обучение на основе собственных знаний</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">вместо знания досье.</text>
    </g>

    <!-- Stap 3 -->
    <g transform="translate(0,320)">
      <circle cx="380" cy="50" r="38" fill="#1c5760" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">3</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Создание новых органов</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Федеральный совет, свободные академии,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">гражданские СМИ,</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">производительные объединения работников.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Параллельные структуры</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Рядом со старым, не внутри —</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">пока старое не станет электорально или</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">экономически нерелевантным.</text>
    </g>

    <!-- Stap 4 -->
    <g transform="translate(0,460)">
      <circle cx="380" cy="50" r="38" fill="#0e3d2e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">4</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Питание микробиома</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Углеродный цикл BiCRS/этанол,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">продовольственный суверенитет, богатство у</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">работников, производительная валюта.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Долгая игра</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Образование для будущего, пространство</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">для первобытного чувства — формирование Treg</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">начинается в начальной школе.</text>
    </g>

    <!-- Eindpunt -->
    <g transform="translate(0,600)">
      <circle cx="380" cy="50" r="42" fill="#2ea043" stroke="#f5f0e6" stroke-width="4"/>
      <text x="380" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f5f0e6">ИСЦЕЛЁН</text>
      <text x="380" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f5f0e6">организм</text>
    </g>
  </g>

  <!-- Doel-band rechts -->
  <g transform="translate(1220,140)">
    <rect width="320" height="660" fill="#e8f0e0" stroke="#2ea043" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#2ea043"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">ЦЕЛЬ</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Живой организм</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Tregs распознают собственную ткань.</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">Производительные клетки</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">защищены. Бунтари</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">читаются как посланники,</text>
    <text x="20" y="202" font-family="Georgia, serif" font-size="12" fill="#4a5263">а не как патогены.</text>

    <text x="20" y="240" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Новые акторы:</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Федеральный совет (противовес знаний)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Свободные академии</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Фонды гражданских СМИ</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Производительный профсоюз</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Фонды совладения</text>
    <text x="20" y="365" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Nova Democratia / VMP</text>

    <text x="20" y="405" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Защищённая ткань:</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Фермер с собственной землёй</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• МСП с налоговым покоем</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• DGA с правом преемства</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Мастер с пространством для обучения</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Изобретатель с патентной силой</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Ребёнок с нетронутым первобытным чувством</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0e3d2e">"Клеточная линия заменена."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Организм снова</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">узнаёт себя как живого.</text>
  </g>

  <!-- Onderschrift -->
  <text x="800" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">Ни одного шага недостаточно. Только комбинация 1+2+3+4, в правильном порядке, спасает организм.</text>
  <text x="800" y="872" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b7280">Het Open Vizier · Июнь 2026 · продолжение «Первобытного чувства», «Линии питания» и «Иммунной системы, атакующей здоровые клетки»</text>
</svg>
