<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#fff5d8"/>
    </linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8e0"/>
      <stop offset="100%" stop-color="#ffd8c8"/>
    </linearGradient>
    <linearGradient id="row3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d5c0"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="row4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8e8d8"/>
      <stop offset="100%" stop-color="#c0d8c0"/>
    </linearGradient>
    <linearGradient id="row5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8d8b8"/>
      <stop offset="100%" stop-color="#a0c8a0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg2)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">Five therapies, one principle</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">from symptom treatment to replacement — medical and political</text>

  <!-- Tabel-kop -->
  <g transform="translate(60,130)">
    <rect width="1480" height="60" fill="#1c5760"/>
    <line x1="180" y1="0" x2="180" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="580" y1="0" x2="580" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="1080" y1="0" x2="1080" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">DEPTH</text>
    <text x="380" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">MEDICAL THERAPY</text>
    <text x="830" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">POLITICAL EQUIVALENT</text>
    <text x="1290" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">EFFECT &amp; RISK</text>
  </g>

  <!-- Rij 1: Symptoombestrijding -->
  <g transform="translate(60,190)">
    <rect width="1480" height="155" fill="url(#row1)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <!-- Diepte-kolom: cijfer + label -->
    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b8941a">1</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#6b5510">SURFACE</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">dampen the signal</text>

    <!-- Medisch -->
    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Broad immunosuppression</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Corticosteroids (prednisone),</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">anti-TNF, methotrexate,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">JAK inhibitors.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">Suppresses ALL immunity —</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">healthy and sick together.</text>

    <!-- Politiek -->
    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Subsidies and purchasing-power packages</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Benefits, energy compensation,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">generic wage increases,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">purchasing power table accord.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">VVD, D66, CDA, GL-PvdA, NSC,</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">FNV/CNV — the core operates here.</text>

    <!-- Effect -->
    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Short-term: relief.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Long-term: weakening.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Symptom dampened — disease continues.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Patient becomes dependent on</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">the medication. Side effects</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">accumulate, infections threaten.</text>
  </g>

  <!-- Rij 2: CAR-T / selectieve verwijdering -->
  <g transform="translate(60,345)">
    <rect width="1480" height="155" fill="url(#row2)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b81e3a">2</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">CELL LINE PATH</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">remove pathogen</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">CAR-T cell therapy</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">T-cells programmed with</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">receptor (CD19, BCMA) that</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">disables the faulty B-cell line.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">Lupus, MS, scleroderma:</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">drug-free remission possible.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Dismantling specific institutions</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Box-3 yield fiction,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CBAM, nitrogen assessment circuit,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">climate modelling apparatus.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">JA21, BBB, partly FvD/PVV —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">identify the pathogenic cell line.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Targeted. Effective.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Low collateral.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Works where identification is sharp.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Requires correct markers — otherwise</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">healthy cells are also hit.</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">Next cell line must BE there.</text>
  </g>

  <!-- Rij 3: Stamcel-reset -->
  <g transform="translate(60,500)">
    <rect width="1480" height="155" fill="url(#row3)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#5a3a20">3</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">RESET</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">start over</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Autologous stem cell transplantation</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Harvest stem cells, chemically</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">burn down immune system,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">return own stem cells.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">"Reset" — sometimes healing,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">brute method, high risk.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Institutional revolution</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Constitutional revision, electoral</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">reform, abolish ministries,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">EU position reconsidered.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">Nova Democratia/VMP, parts of FvD —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">point to full reset.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Works — or destroys.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Transition phase is vulnerable.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Requires strong logistics and</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">political immunity against panic.</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">Not for mild cases —</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">but for terminally refractory ones.</text>
  </g>

  <!-- Rij 4: Treg - actor-vervanging -->
  <g transform="translate(60,655)">
    <rect width="1480" height="155" fill="url(#row4)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0e3d2e">4</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">REPLACEMENT</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">new actor</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Treg therapy &amp; tolerogenic cells</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Cultivate regulatory T-cells,</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CAR-Tregs targeting auto-antigen,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">reprogramme dendritic cells.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Not re-educating existing cells,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">but creating new cell population.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">New actors alongside the old</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Federal Council instead of Senate,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">free academies, citizen media,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">employee co-ownership bodies.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Nova Democratia/VMP programmatic.</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Not reform, replacement.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Sustainable.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Fundamental.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Requires time to build.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Naive stem cells MUST be formed outside</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">the infected thymus,</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">otherwise they get the same error.</text>
  </g>

  <!-- Rij 5: Microbioom -->
  <g transform="translate(60,810)">
    <rect width="1480" height="155" fill="url(#row5)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0a2620">5</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">THE ROOT</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">microbiome basis</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Nutrition, microbiome, environment</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Fibres → short-chain fatty acids</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">→ Treg formation → tolerance.</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">Restore gut wall, diet, rhythm.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Without this foundation</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">no other therapy lasts.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Economic-cultural microbiome</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/ethanol, food sovereignty,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">education for the future,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">productive currency, space for primal sense.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Nova Democratia/VMP explicit —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">the root of all previous routes.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Only works with 2 and 4.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Indispensable for lasting recovery.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Reset without nutritional base =</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">patient still dies of</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">malnutrition. What in the child as</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">primal sense was expelled.</text>
  </g>

  <!-- Slot-band -->
  <g transform="translate(60,990)">
    <rect width="1480" height="80" fill="#0e3d2e"/>
    <text x="740" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">THE WINNING COMBINATION · CAR-T (2) + Treg replacement (4) + microbiome recovery (5)</text>
    <text x="740" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#a8d5b9">no single route alone — briefly clear up + form new cell line + restore nutritional base. Reset (3) is last option.</text>
  </g>
</svg>
