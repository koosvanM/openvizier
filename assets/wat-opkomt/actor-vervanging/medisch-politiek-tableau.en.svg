<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#fff5d8"/>
    </linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8e0"/>
      <stop offset="100%" stop-color="#ffd8c8"/>
    </linearGradient>
    <linearGradient id="row3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d5c0"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="row4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8e8d8"/>
      <stop offset="100%" stop-color="#c0d8c0"/>
    </linearGradient>
    <linearGradient id="row5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8d8b8"/>
      <stop offset="100%" stop-color="#a0c8a0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg2)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">Vijf therapieën, één principe</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">van symptoombestrijding tot vervanging — medisch én politiek</text>

  <!-- Tabel-kop -->
  <g transform="translate(60,130)">
    <rect width="1480" height="60" fill="#1c5760"/>
    <line x1="180" y1="0" x2="180" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="580" y1="0" x2="580" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <line x1="1080" y1="0" x2="1080" y2="60" stroke="#f5f0e6" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">DIEPTE</text>
    <text x="380" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">MEDISCHE THERAPIE</text>
    <text x="830" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">POLITIEK EQUIVALENT</text>
    <text x="1290" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f3e9a5">EFFECT &amp; RISICO</text>
  </g>

  <!-- Rij 1: Symptoombestrijding -->
  <g transform="translate(60,190)">
    <rect width="1480" height="155" fill="url(#row1)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <!-- Diepte-kolom: cijfer + label -->
    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b8941a">1</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#6b5510">OPPERVLAK</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">demp het signaal</text>

    <!-- Medisch -->
    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Brede immunosuppressie</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Corticosteroïden (prednison),</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">anti-TNF, methotrexaat,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">JAK-remmers.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">Onderdrukt àlle afweer —</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">gezond en ziek samen.</text>

    <!-- Politiek -->
    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Subsidies en koopkrachtpakketten</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Toeslagen, energiecompensatie,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">generieke loonsverhogingen,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">koopkrachttafel-akkoord.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">VVD, D66, CDA, GL-PvdA, NSC,</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#6b5510">FNV/CNV — hier opereert de kern.</text>

    <!-- Effect -->
    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Kort: verlichting.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Lang: verzwakking.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Symptoom dempt — ziekte gaat door.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Patiënt raakt afhankelijk van</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">de medicatie. Bijwerkingen</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">stapelen, infecties dreigen.</text>
  </g>

  <!-- Rij 2: CAR-T / selectieve verwijdering -->
  <g transform="translate(60,345)">
    <rect width="1480" height="155" fill="url(#row2)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b81e3a">2</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">CELLIJN-WEG</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">verwijder pathogeen</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">CAR-T-celtherapie</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">T-cellen geprogrammeerd met</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">receptor (CD19, BCMA) die</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">foute B-cellijn uitschakelen.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">Lupus, MS, sclerodermie:</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">medicijnvrije remissie mogelijk.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Specifieke instituten ontmantelen</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Box-3-rendementsfictie,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CBAM, stikstof-beoordelingscircuit,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">klimaat-modelleringsapparaat.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">JA21, BBB, deels FvD/PVV —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b1e1e">wijzen pathogene cellijn aan.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Gericht. Effectief.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Laag collateral.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Werkt waar identificatie scherp is.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Vereist juiste markers — anders</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">worden ook gezonde cellen geraakt.</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">Volgende cellijn moet er ZIJN.</text>
  </g>

  <!-- Rij 3: Stamcel-reset -->
  <g transform="translate(60,500)">
    <rect width="1480" height="155" fill="url(#row3)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#5a3a20">3</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">RESET</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">geheel opnieuw</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Autologe stamceltransplantatie</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Stamcellen oogsten, immuun-</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">systeem chemisch wegbranden,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">eigen stamcellen terug.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">"Reset" — soms genezend,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">brute methode, hoog risico.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Institutionele revolutie</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Grondwetherziening, kiesstelsel-</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">hervorming, ministeries opheffen,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">EU-positie herzien.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">Nova Democratia/VMP, delen FvD —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a3a20">wijzen naar volledige reset.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Werkt — of vernietigt.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3a20">Tussenfase is kwetsbaar.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Vereist sterke logistiek en</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">politieke immuniteit tegen paniek.</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">Niet voor lichte gevallen —</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">wel voor terminaal-refractaire.</text>
  </g>

  <!-- Rij 4: Treg - actor-vervanging -->
  <g transform="translate(60,655)">
    <rect width="1480" height="155" fill="url(#row4)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0e3d2e">4</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">VERVANGING</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">nieuwe actor</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Treg-therapie &amp; tolerogene cellen</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Regulerende T-cellen kweken,</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">CAR-Tregs gericht op auto-antigeen,</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">dendritische cellen herprogrammeren.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Niet bestaande cel heropvoeden,</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">maar nieuwe celpopulatie creëren.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Nieuwe actoren náást de oude</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Bondsraad i.p.v. Eerste Kamer,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">vrije academies, burger-media,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">werknemers-mede-eigendom-organen.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Nova Democratia/VMP programmatisch.</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0e3d2e">Geen hervorming, vervanging.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Duurzaam.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Fundamenteel.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Vereist tijd om op te bouwen.</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">Naïeve stamcellen MOETEN buiten</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">de besmette thymus gevormd zijn,</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">anders krijgen ze dezelfde fout.</text>
  </g>

  <!-- Rij 5: Microbioom -->
  <g transform="translate(60,810)">
    <rect width="1480" height="155" fill="url(#row5)" stroke="#d4d1ca" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="155" stroke="#d4d1ca"/>
    <line x1="580" y1="0" x2="580" y2="155" stroke="#d4d1ca"/>
    <line x1="1080" y1="0" x2="1080" y2="155" stroke="#d4d1ca"/>

    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0a2620">5</text>
    <text x="90" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">DE WORTEL</text>
    <text x="90" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">microbioom-basis</text>

    <text x="200" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Voeding, microbioom, milieu</text>
    <text x="200" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">Vezels → korteketenvetzuren</text>
    <text x="200" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">→ Treg-vorming → tolerantie.</text>
    <text x="200" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">Herstel darmwand, dieet, ritme.</text>
    <text x="200" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Zonder dit fundament werkt</text>
    <text x="200" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">geen enkele andere therapie blijvend.</text>

    <text x="600" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1a1a1a">Economisch-cultureel microbioom</text>
    <text x="600" y="60" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/ethanol, voedselsoevereiniteit,</text>
    <text x="600" y="78" font-family="Georgia, serif" font-size="12" fill="#4a5263">scholing voor de toekomst,</text>
    <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#4a5263">productieve munt, ruimte voor oergevoel.</text>
    <text x="600" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">Nova Democratia/VMP expliciet —</text>
    <text x="600" y="140" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#0a2620">de wortel van alle vorige routes.</text>

    <text x="1100" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Werkt alleen mét 2 en 4.</text>
    <text x="1100" y="60" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0a2620">Onmisbaar voor blijvend herstel.</text>
    <text x="1100" y="90" font-family="Georgia, serif" font-size="11" fill="#4a5263">Reset zonder voedingsbasis =</text>
    <text x="1100" y="108" font-family="Georgia, serif" font-size="11" fill="#4a5263">patiënt sterft alsnog aan</text>
    <text x="1100" y="125" font-family="Georgia, serif" font-size="11" fill="#4a5263">ondervoeding. Wat in het kind als</text>
    <text x="1100" y="142" font-family="Georgia, serif" font-size="11" fill="#4a5263">oergevoel werd uitgedreven.</text>
  </g>

  <!-- Slot-band -->
  <g transform="translate(60,990)">
    <rect width="1480" height="80" fill="#0e3d2e"/>
    <text x="740" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">DE WINNENDE COMBINATIE · CAR-T (2) + Treg-vervanging (4) + microbioom-herstel (5)</text>
    <text x="740" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#a8d5b9">geen één route alleen — kort opruimen + nieuwe cellijn vormen + voedingsbasis herstellen. Reset (3) is laatste optie.</text>
  </g>
</svg>
