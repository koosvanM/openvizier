<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgRev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81e3a"/>
      <stop offset="50%" stop-color="#d4b95e"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRev)"/>

  <!-- Titel -->
  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">Die Revolutions-Routenkarte</text>
  <text x="800" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">von kranken Institutionen zum lebendigen Mikrobiom — nicht Reform, Ersatz</text>

  <!-- Diagnose-band links -->
  <g transform="translate(60,140)">
    <rect width="320" height="660" fill="#fff5e8" stroke="#b81e3a" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#b81e3a"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">DIAGNOSE</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Autoimmun-Niederlande</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Der Körper greift seine eigenen gesunden</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">Zellen an. Nicht aus bösem Willen —</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">aus Selbsterhaltung des kranken</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">Systems.</text>

    <text x="20" y="220" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Angegriffene Zellen:</text>
    <text x="20" y="245" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der Bauer (Lebensmittel)</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der Mittelstand (Arbeit + Innovation)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der DGA (Kapitalbildung)</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der Handwerker (Produktion)</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der Erfinder (Zukunft)</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Der Rebell mit Wissen</text>

    <text x="20" y="385" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#8b1e1e">Angreifende Akteure:</text>
    <text x="20" y="410" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Min. Klima &amp; Stickstoff</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Box-3 Renditefikt</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CBAM-Bürokratie</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• FNV/CNV (Lohnforderungsmodus)</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Folgkanonmedien</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• CPB-Modellapparat</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• GL-PvdA, D66, VVD, CDA, NSC</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8b1e1e">"Der Akteur IST die Regel."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Keine Reform möglich:</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Reformer = zu reformierendes Objekt.</text>
  </g>

  <!-- PATHWAY — vertikaal middenpad -->
  <g transform="translate(420,140)">
    <!-- Pad-lijn -->
    <line x1="380" y1="50" x2="380" y2="660" stroke="url(#pathGrad)" stroke-width="6"/>

    <!-- Stap 1 -->
    <g transform="translate(0,40)">
      <circle cx="380" cy="50" r="38" fill="#b81e3a" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">1</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">CAR-T-Eingriff</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Box-3-Renditefikt abschaffen,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">CBAM zurückziehen, Stickstoffkreis</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">auflösen.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b81e3a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#8b1e1e">Erste 100 Tage</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Spezifische Gesetze, nicht ganze</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Ministerien. Gezielte, schnelle</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Eingriffe.</text>
    </g>

    <!-- Stap 2 -->
    <g transform="translate(0,180)">
      <circle cx="380" cy="50" r="38" fill="#d4b95e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1a1a1a">2</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Stammzellen bilden</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Außerhalb des befallenen Thymus —</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Nova Democratia/VMP als naive</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Zelllinie, frei von alter Programmierung.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#b8941a" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#6b5510">Bauphase (1-3 Jahre)</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Mitgliederkultur, Auswahlkriterien,</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">interne Ausbildung auf Eigenwissen</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">statt Aktenkenntnis.</text>
    </g>

    <!-- Stap 3 -->
    <g transform="translate(0,320)">
      <circle cx="380" cy="50" r="38" fill="#1c5760" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">3</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Neue Organe errichten</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Bundesrat, freie Akademien,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">bürgertfinanzierte Medien,</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">produktive Arbeitnehmerverbände.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#1c5760" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1c5760">Parallele Strukturen</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Neben dem Alten, nicht darin —</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">bis das Alte electoral oder</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">wirtschaftlich irrelevant wird.</text>
    </g>

    <!-- Stap 4 -->
    <g transform="translate(0,460)">
      <circle cx="380" cy="50" r="38" fill="#0e3d2e" stroke="#f5f0e6" stroke-width="3"/>
      <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f5f0e6">4</text>
      <rect x="40" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="180" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Mikrobiom nähren</text>
      <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">BiCRS/Ethanol-Kohlenstoffkreislauf,</text>
      <text x="180" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Ernährungssouveränität, Vermögen bei</text>
      <text x="180" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Arbeitnehmern, produktive Währung.</text>

      <rect x="440" y="14" width="280" height="80" fill="#fff" stroke="#0e3d2e" stroke-width="1.5"/>
      <text x="580" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Langer Atem</text>
      <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">Bildung für die Zukunft, Raum</text>
      <text x="580" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">für das Urgefühl — Treg-Bildung</text>
      <text x="580" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a5263">beginnt in der Grundschule.</text>
    </g>

    <!-- Eindpunt -->
    <g transform="translate(0,600)">
      <circle cx="380" cy="50" r="42" fill="#2ea043" stroke="#f5f0e6" stroke-width="4"/>
      <text x="380" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f5f0e6">GEHEILT</text>
      <text x="380" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f5f0e6">Organismus</text>
    </g>
  </g>

  <!-- Doel-band rechts -->
  <g transform="translate(1220,140)">
    <rect width="320" height="660" fill="#e8f0e0" stroke="#2ea043" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="50" fill="#2ea043"/>
    <text x="160" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f5f0e6">ZIEL</text>

    <text x="160" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">Ein lebendes Organismus</text>

    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#4a5263">Tregs erkennen eigenes Gewebe.</text>
    <text x="20" y="148" font-family="Georgia, serif" font-size="12" fill="#4a5263">Produktive Zellen werden</text>
    <text x="20" y="166" font-family="Georgia, serif" font-size="12" fill="#4a5263">geschützt. Rebellen werden</text>
    <text x="20" y="184" font-family="Georgia, serif" font-size="12" fill="#4a5263">als Boten gelesen,</text>
    <text x="20" y="202" font-family="Georgia, serif" font-size="12" fill="#4a5263">nicht als Pathogene.</text>

    <text x="20" y="240" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Neue Akteure:</text>
    <text x="20" y="265" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Bundesrat (Wissensgegenmacht)</text>
    <text x="20" y="285" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Freie Akademien</text>
    <text x="20" y="305" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Bürgermedienstiftungen</text>
    <text x="20" y="325" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Produktiver Arbeitnehmerverband</text>
    <text x="20" y="345" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Miteigentumssfonds</text>
    <text x="20" y="365" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Nova Democratia / VMP</text>

    <text x="20" y="405" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0e3d2e">Geschütztes Gewebe:</text>
    <text x="20" y="430" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Bauer mit eigenem Land</text>
    <text x="20" y="450" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Mittelstand mit steuerlicher Ruhe</text>
    <text x="20" y="470" font-family="Georgia, serif" font-size="12" fill="#4a5263">• DGA mit Nachfolgerecht</text>
    <text x="20" y="490" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Handwerker mit Bildungsraum</text>
    <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Erfinder mit Patentkraft</text>
    <text x="20" y="530" font-family="Georgia, serif" font-size="12" fill="#4a5263">• Kind mit intaktem Urgefühl</text>

    <text x="160" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0e3d2e">"Die Zelllinie ist ersetzt."</text>
    <text x="160" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">Der Organismus erkennt</text>
    <text x="160" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4a5263">sich wieder als lebendig.</text>
  </g>

  <!-- Onderschrift -->
  <text x="800" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#4a5263">Kein einziger Schritt reicht. Nur die Kombination 1+2+3+4, in richtiger Reihenfolge, rettet den Organismus.</text>
  <text x="800" y="872" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b7280">Het Open Vizier · Juni 2026 · im Anschluss an "Urgefühl", "Die Versorgungslinie" und "Das Immunsystem, das gesunde Zellen angreift"</text>
</svg>
