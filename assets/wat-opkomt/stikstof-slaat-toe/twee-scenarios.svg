<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f0e6d0"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#ffe8d8"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="100%" stop-color="#d0e0c8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgT)"/>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1a1a1a">Twee scenario's. Eén keuze.</text>
  <text x="800" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">stikstof in Nederland 2026-2035 — wat het kabinet doet, en wat zou kunnen</text>

  <!-- Header -->
  <g transform="translate(60,140)">
    <rect width="1480" height="65" fill="#1a1a1a"/>
    <line x1="500" y1="0" x2="500" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <line x1="990" y1="0" x2="990" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">INDICATOR · 2035 t.o.v. 2026</text>
    <text x="745" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff8c8c">SCENARIO A — DE AANVAL</text>
    <text x="745" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#ffd8c8">kabinetspakket juni 2026</text>
    <text x="1290" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#a8d5b9">SCENARIO B — DE ANDERE WEG</text>
    <text x="1290" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#e8f0e0">natuur accepteren, productie behouden</text>
  </g>

  <!-- Rijen -->
  <g transform="translate(60,205)">
    <!-- Rij 1 -->
    <g>
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Veehouderijen die verdwijnen</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">uitgekocht, gestopt, verplaatst</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">5.000 – 8.000</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">&lt;500 (vrijwillig)</text>
    </g>
    <!-- Rij 2 -->
    <g transform="translate(0,80)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Stikstofuitstoot Nederland</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">2035 t.o.v. 2019</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−42 tot −46%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">−25 tot −30% (Erisman)</text>
    </g>
    <!-- Rij 3 -->
    <g transform="translate(0,160)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Wereldwijde stikstofuitstoot</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">incl. stallen die naar buitenland verhuizen</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">gelijk of stijgt</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">daalt (extensivering blijft hier)</text>
    </g>
    <!-- Rij 4 -->
    <g transform="translate(0,240)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Kosten voor de Staat</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">uitkoop + zone-compensatie + juridisch</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€25 – €106 miljard</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€0 — accijns geeft opbrengst</text>
    </g>
    <!-- Rij 5 -->
    <g transform="translate(0,320)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Opbrengst voor de Staat</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">stikstof-accijns krachtvoer + kunstmest</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€0</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€1 – €3 mld per jaar</text>
    </g>
    <!-- Rij 6 -->
    <g transform="translate(0,400)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Toegevoegde waarde landbouw</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">na 10 jaar beleid</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−40 tot −60%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">stabiel tot +5%</text>
    </g>
    <!-- Rij 7 -->
    <g transform="translate(0,480)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Vergunningenslot</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">woningbouw, defensie, infrastructuur</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">deels los, blijft probleem</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">volledig los (juridisch herzien)</text>
    </g>
    <!-- Rij 8 -->
    <g transform="translate(0,560)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Daadwerkelijk natuurherstel</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">incl. verdroging, verzuring, versnippering</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">onzeker (PBL-waarschuwing)</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">hoger (drukfactoren ineens aangepakt)</text>
    </g>
    <!-- Rij 9 -->
    <g transform="translate(0,640)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Klimaatadaptatie geïntegreerd</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">verschuivende habitats meegenomen</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">nee — gescheiden silo</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">ja — kerncomponent</text>
    </g>
    <!-- Rij 10 -->
    <g transform="translate(0,720)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Emigratie van productie</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">naar Polen, Zweden, Kroatië, etc.</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">massaal en versnellend</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">gestopt</text>
    </g>
  </g>

  <text x="800" y="975" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#6b7280">Bronnen: ESB juni 2026, PBL 2026, Erisman/WUR 2026, Rabobank juni 2026, Agricycling coöperatie 2026, ministeriële Taskforce Stikstof mei-juni 2026</text>
</svg>
