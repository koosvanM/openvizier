<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a0e"/>
      <stop offset="100%" stop-color="#3a0a14"/>
    </linearGradient>
    <linearGradient id="vlakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="boer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d5b9"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </radialGradient>
    <radialGradient id="aanvalCel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5577"/>
      <stop offset="100%" stop-color="#7a1224"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgS)"/>

  <!-- Top: titel -->
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#ffd8c8">The anti-immune disease of our government strikes</text>
  <text x="800" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#ff8c8c">the nitrogen package end June 2026 — an attack on the last productive tissue</text>

  <!-- Linker helft: kaart van Nederland met aanvallen -->
  <g transform="translate(110,200)">
    <text x="220" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">SCENARIO A · THE ATTACK</text>
    <text x="220" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#ffd8c8">cabinet package end June 2026</text>

    <!-- Stilistische kaart van NL (vereenvoudigd) -->
    <g transform="translate(60,55)">
      <!-- Buitencontour -->
      <path d="M 80 20 L 200 10 L 280 40 L 340 110 L 340 220 L 300 280 L 240 330 L 160 340 L 80 320 L 30 250 L 20 150 L 50 80 Z"
            fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2" opacity="0.5"/>

      <!-- Natura 2000 zones (rood-zwart) -->
      <g>
        <!-- Veluwe -->
        <ellipse cx="180" cy="140" rx="55" ry="40" fill="url(#aanvalCel)" opacity="0.85"/>
        <text x="180" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#f5f0e6">VELUWE</text>
        <text x="180" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f5f0e6">−65% zone 1km</text>
        <!-- Aanvallende pijlen rond Veluwe -->
        <g stroke="#ff5577" stroke-width="2.5" fill="none">
          <path d="M 100 100 L 130 130" marker-end="url(#aroww)"/>
          <path d="M 260 100 L 230 130" marker-end="url(#aroww)"/>
          <path d="M 100 180 L 130 160" marker-end="url(#aroww)"/>
          <path d="M 260 180 L 230 160" marker-end="url(#aroww)"/>
        </g>

        <!-- Peel -->
        <ellipse cx="230" cy="270" rx="40" ry="28" fill="url(#aanvalCel)" opacity="0.85"/>
        <text x="230" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#f5f0e6">PEEL</text>
        <text x="230" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f5f0e6">−65%</text>

        <!-- Groene Hart -->
        <ellipse cx="110" cy="200" rx="35" ry="22" fill="url(#aanvalCel)" opacity="0.7"/>
        <text x="110" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f5f0e6">Groene Hart</text>

        <!-- Hart vh Noorden -->
        <ellipse cx="180" cy="55" rx="35" ry="20" fill="url(#aanvalCel)" opacity="0.7"/>
        <text x="180" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f5f0e6">Hart vh Noorden</text>
      </g>

      <!-- Vluchtende boer-symbolen (groene cirkels die weggaan) -->
      <g>
        <circle cx="350" cy="160" r="9" fill="url(#boer)"/>
        <path d="M 340 160 L 380 160" stroke="#a8d5b9" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
        <text x="395" y="164" font-family="Georgia, serif" font-size="11" fill="#a8d5b9">naar Polen</text>

        <circle cx="20" cy="180" r="9" fill="url(#boer)"/>
        <path d="M 30 180 L -10 180" stroke="#a8d5b9" stroke-width="2" stroke-dasharray="3,3" transform="rotate(180 10 180)" marker-end="url(#arrowGreen)"/>
        <text x="-105" y="184" font-family="Georgia, serif" font-size="11" fill="#a8d5b9">naar Zweden</text>

        <circle cx="280" cy="350" r="9" fill="url(#boer)"/>
        <path d="M 280 360 L 280 400" stroke="#a8d5b9" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
        <text x="285" y="412" font-family="Georgia, serif" font-size="11" fill="#a8d5b9">naar Kroatië</text>
      </g>
    </g>

    <!-- Kostenkader onderin -->
    <g transform="translate(0,460)">
      <rect x="0" y="0" width="440" height="115" fill="#1a0a0e" stroke="#ff5577" stroke-width="2"/>
      <text x="220" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ff8c8c">DE FACTUUR</text>
      <text x="20" y="50" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">2.850 veehouderijen Veluwe-zone</text>
      <text x="20" y="68" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">€212.795 per kg stikstof</text>
      <text x="20" y="86" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">€106 mld totale uitkoop 2035</text>
      <text x="20" y="104" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">−20% landbouwwaarde / jaar</text>
    </g>
  </g>

  <!-- Rechter helft: hoe het zou kunnen zijn -->
  <g transform="translate(820,200)">
    <text x="340" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#a8d5b9">SCENARIO B · DE ANDERE WEG</text>
    <text x="340" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#e8f0e0">de natuur accepteren, de boer behouden</text>

    <!-- Kaart NL — gezond, met klimaatpijlen -->
    <g transform="translate(150,55)">
      <path d="M 80 20 L 200 10 L 280 40 L 340 110 L 340 220 L 300 280 L 240 330 L 160 340 L 80 320 L 30 250 L 20 150 L 50 80 Z"
            fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2"/>

      <!-- Verschuiving van soorten (noordwaartse pijlen door heel NL) -->
      <g stroke="#d4b95e" stroke-width="2" fill="none" opacity="0.85">
        <path d="M 100 280 L 100 60" stroke-dasharray="4,4" marker-end="url(#arrowGold)"/>
        <path d="M 180 290 L 180 50" stroke-dasharray="4,4" marker-end="url(#arrowGold)"/>
        <path d="M 260 280 L 260 70" stroke-dasharray="4,4" marker-end="url(#arrowGold)"/>
      </g>
      <text x="100" y="305" font-family="Georgia, serif" font-size="10" fill="#d4b95e" text-anchor="middle">soorten →</text>
      <text x="180" y="305" font-family="Georgia, serif" font-size="10" fill="#d4b95e" text-anchor="middle">verhuizen →</text>
      <text x="260" y="305" font-family="Georgia, serif" font-size="10" fill="#d4b95e" text-anchor="middle">noordwaarts</text>

      <!-- Productieve boeren — blijven, groen, met kringlooppijlen -->
      <g>
        <circle cx="140" cy="180" r="10" fill="url(#boer)"/>
        <circle cx="220" cy="200" r="10" fill="url(#boer)"/>
        <circle cx="170" cy="230" r="10" fill="url(#boer)"/>
        <circle cx="240" cy="140" r="10" fill="url(#boer)"/>
        <circle cx="120" cy="120" r="10" fill="url(#boer)"/>
      </g>

      <!-- Kringloop-icoon (cirkelpijl) -->
      <g transform="translate(180,180)" stroke="#a8d5b9" stroke-width="2" fill="none" opacity="0.5">
        <circle r="35" stroke-dasharray="5,3"/>
      </g>
    </g>

    <!-- Recept-kader onderin -->
    <g transform="translate(0,460)">
      <rect x="0" y="0" width="440" height="115" fill="#0e3d2e" stroke="#a8d5b9" stroke-width="2"/>
      <text x="220" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#a8d5b9">DE WERKZAME BEHANDELING</text>
      <text x="20" y="50" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">Stikstof-accijns: €2,20-€8,80/kg</text>
      <text x="20" y="68" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">Kringloop-coöperaties (Agricycling: 85.000 kg/jr)</text>
      <text x="20" y="86" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">Habitats meebewegen met klimaat</text>
      <text x="20" y="104" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">€1-€3 mld OPBRENGST i.p.v. uitgave</text>
    </g>
  </g>

  <!-- Marker definities -->
  <defs>
    <marker id="aroww" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ff5577"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#a8d5b9"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#d4b95e"/>
    </marker>
  </defs>

  <!-- Slogan onderaan -->
  <text x="800" y="830" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f3e9a5">"Habitats uit 1992. Een klimaat van 2026. En een patiënt die zijn eigen organen aanvalt."</text>
</svg>
