<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f0e6d0"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#ffe8d8"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="100%" stop-color="#d0e0c8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgT)"/>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1a1a1a">Два сценария. Один выбор.</text>
  <text x="800" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">азот в Нидерландах 2026-2035 — что делает кабинет, и что могло бы быть</text>

  <!-- Header -->
  <g transform="translate(60,140)">
    <rect width="1480" height="65" fill="#1a1a1a"/>
    <line x1="500" y1="0" x2="500" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <line x1="990" y1="0" x2="990" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">ИНДИКАТОР · 2035 vs. 2026</text>
    <text x="745" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff8c8c">СЦЕНАРИЙ А — АТАКА</text>
    <text x="745" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#ffd8c8">пакет кабинета июнь 2026</text>
    <text x="1290" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#a8d5b9">СЦЕНАРИЙ Б — ДРУГОЙ ПУТЬ</text>
    <text x="1290" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#e8f0e0">принять природу, сохранить производство</text>
  </g>

  <!-- Rijen -->
  <g transform="translate(60,205)">
    <!-- Rij 1 -->
    <g>
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Животноводческие хозяйства, исчезающие</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">выкупленные, остановленные, перемещённые</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">5.000 – 8.000</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">&lt;500 (добровольно)</text>
    </g>
    <!-- Rij 2 -->
    <g transform="translate(0,80)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Выбросы азота Нидерланды</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">2035 vs. 2019</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−42 до −46%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">−25 до −30% (Erisman)</text>
    </g>
    <!-- Rij 3 -->
    <g transform="translate(0,160)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Мировые выбросы азота</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">включая фермы, перемещающиеся за рубеж</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">одинаково или растёт</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">падает (экстенсификация остаётся здесь)</text>
    </g>
    <!-- Rij 4 -->
    <g transform="translate(0,240)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Затраты для государства</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">выкуп + зональная компенсация + юридические</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€25 – €106 млрд</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€0 — акциз приносит доход</text>
    </g>
    <!-- Rij 5 -->
    <g transform="translate(0,320)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Доход для государства</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">акциз на азот: корм + удобрения</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€0</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€1 – €3 млрд в год</text>
    </g>
    <!-- Rij 6 -->
    <g transform="translate(0,400)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Добавленная стоимость сельского хозяйства</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">после 10 лет политики</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−40 до −60%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">стабильно до +5%</text>
    </g>
    <!-- Rij 7 -->
    <g transform="translate(0,480)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Блокировка разрешений</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">жильё, оборона, инфраструктура</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">частично решено, остаётся проблемой</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">полностью решено (юридически пересмотрено)</text>
    </g>
    <!-- Rij 8 -->
    <g transform="translate(0,560)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Реальное восстановление природы</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">включая обезвоживание, окисление, фрагментацию</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">неопределённо (предупреждение PBL)</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">выше (факторы давления устранены сразу)</text>
    </g>
    <!-- Rij 9 -->
    <g transform="translate(0,640)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Климатическая адаптация интегрирована</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">смещающиеся местообитания учтены</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">нет — отдельное силосное хранилище</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">да — ключевой компонент</text>
    </g>
    <!-- Rij 10 -->
    <g transform="translate(0,720)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Эмиграция производства</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">в Польшу, Швецию, Хорватию и т.д.</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">массово и ускоренно</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">остановлено</text>
    </g>
  </g>

  <text x="800" y="975" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#6b7280">Источники: ESB июнь 2026, PBL 2026, Erisman/WUR 2026, Rabobank июнь 2026, кооператив Agricycling 2026, министерская Целевая группа по азоту май-июнь 2026</text>
</svg>
