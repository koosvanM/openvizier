<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f0e6d0"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#ffe8d8"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="100%" stop-color="#d0e0c8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgT)"/>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1a1a1a">Two scenarios. One choice.</text>
  <text x="800" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">nitrogen in the Netherlands 2026-2035 — what the cabinet does, and what could be</text>

  <!-- Header -->
  <g transform="translate(60,140)">
    <rect width="1480" height="65" fill="#1a1a1a"/>
    <line x1="500" y1="0" x2="500" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <line x1="990" y1="0" x2="990" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">INDICATOR · 2035 vs. 2026</text>
    <text x="745" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff8c8c">SCENARIO A — THE ATTACK</text>
    <text x="745" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#ffd8c8">cabinet package June 2026</text>
    <text x="1290" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#a8d5b9">SCENARIO B — THE OTHER PATH</text>
    <text x="1290" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#e8f0e0">accept nature, retain production</text>
  </g>

  <!-- Rijen -->
  <g transform="translate(60,205)">
    <!-- Rij 1 -->
    <g>
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Livestock farms that disappear</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">bought out, stopped, relocated</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">5.000 – 8.000</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">&lt;500 (voluntary)</text>
    </g>
    <!-- Rij 2 -->
    <g transform="translate(0,80)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Nitrogen emissions Netherlands</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">2035 vs. 2019</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−42 to −46%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">−25 to −30% (Erisman)</text>
    </g>
    <!-- Rij 3 -->
    <g transform="translate(0,160)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Global nitrogen emissions</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">incl. farms relocating abroad</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">same or rises</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">falls (extensification stays here)</text>
    </g>
    <!-- Rij 4 -->
    <g transform="translate(0,240)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Costs for the State</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">buyout + zone compensation + legal</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€25 – €106 billion</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€0 — excise generates revenue</text>
    </g>
    <!-- Rij 5 -->
    <g transform="translate(0,320)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Revenue for the State</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">nitrogen excise on feed + fertiliser</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€0</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€1 – €3 bn per year</text>
    </g>
    <!-- Rij 6 -->
    <g transform="translate(0,400)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Agricultural added value</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">after 10 years of policy</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−40 to −60%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">stable to +5%</text>
    </g>
    <!-- Rij 7 -->
    <g transform="translate(0,480)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Permit lock</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">housing, defence, infrastructure</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">partly resolved, remains problem</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">fully resolved (legally revised)</text>
    </g>
    <!-- Rij 8 -->
    <g transform="translate(0,560)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Actual nature restoration</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">incl. desiccation, acidification, fragmentation</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">uncertain (PBL warning)</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">higher (pressure factors tackled at once)</text>
    </g>
    <!-- Rij 9 -->
    <g transform="translate(0,640)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Climate adaptation integrated</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">shifting habitats included</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">no — separate silo</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">yes — core component</text>
    </g>
    <!-- Rij 10 -->
    <g transform="translate(0,720)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Emigration of production</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">to Poland, Sweden, Croatia, etc.</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">massive and accelerating</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">stopped</text>
    </g>
  </g>

  <text x="800" y="975" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#6b7280">Sources: ESB June 2026, PBL 2026, Erisman/WUR 2026, Rabobank June 2026, Agricycling cooperative 2026, ministerial Taskforce Nitrogen May-June 2026</text>
</svg>
