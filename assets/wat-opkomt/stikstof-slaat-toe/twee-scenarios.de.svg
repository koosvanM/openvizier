<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f0e6d0"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#ffe8d8"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="100%" stop-color="#d0e0c8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgT)"/>

  <text x="800" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1a1a1a">Zwei Szenarien. Eine Wahl.</text>
  <text x="800" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4a5263">Stickstoff in den Niederlanden 2026-2035 — was das Kabinett tut, und was möglich wäre</text>

  <!-- Header -->
  <g transform="translate(60,140)">
    <rect width="1480" height="65" fill="#1a1a1a"/>
    <line x1="500" y1="0" x2="500" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <line x1="990" y1="0" x2="990" y2="65" stroke="#f5f0e6" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f3e9a5">INDIKATOR · 2035 ggü. 2026</text>
    <text x="745" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff8c8c">SZENARIO A — DER ANGRIFF</text>
    <text x="745" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#ffd8c8">Kabinettspaket Juni 2026</text>
    <text x="1290" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#a8d5b9">SZENARIO B — DER ANDERE WEG</text>
    <text x="1290" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#e8f0e0">Natur akzeptieren, Produktion erhalten</text>
  </g>

  <!-- Rijen -->
  <g transform="translate(60,205)">
    <!-- Rij 1 -->
    <g>
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Viehbetriebe, die verschwinden</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">aufgekauft, gestoppt, verlegt</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">5.000 – 8.000</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">&lt;500 (freiwillig)</text>
    </g>
    <!-- Rij 2 -->
    <g transform="translate(0,80)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Stickstoffemissionen Niederlande</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">2035 ggü. 2019</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−42 bis −46%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">−25 bis −30% (Erisman)</text>
    </g>
    <!-- Rij 3 -->
    <g transform="translate(0,160)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Weltweite Stickstoffemissionen</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">inkl. Ställe, die ins Ausland abwandern</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">gleich oder steigt</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">sinkt (Extensivierung bleibt hier)</text>
    </g>
    <!-- Rij 4 -->
    <g transform="translate(0,240)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Kosten für den Staat</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">Aufkauf + Zonenausgleich + juristisch</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€25 – €106 Milliarden</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€0 — Verbrauchssteuer bringt Ertrag</text>
    </g>
    <!-- Rij 5 -->
    <g transform="translate(0,320)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Ertrag für den Staat</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">Stickstoffsteuer Kraftfutter + Kunstdünger</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">€0</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">€1 – €3 Mrd. pro Jahr</text>
    </g>
    <!-- Rij 6 -->
    <g transform="translate(0,400)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Mehrwert Landwirtschaft</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">nach 10 Jahren Politik</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">−40 bis −60%</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">stabil bis +5%</text>
    </g>
    <!-- Rij 7 -->
    <g transform="translate(0,480)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Genehmigungsblockade</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">Wohnungsbau, Verteidigung, Infrastruktur</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">teils gelöst, bleibt Problem</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">vollständig gelöst (juristisch revidiert)</text>
    </g>
    <!-- Rij 8 -->
    <g transform="translate(0,560)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Tatsächliche Naturwiederherstellung</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">inkl. Austrocknung, Versauerung, Zersplitterung</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1224">unsicher (PBL-Warnung)</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0e3d2e">höher (Druckfaktoren auf einmal angegangen)</text>
    </g>
    <!-- Rij 9 -->
    <g transform="translate(0,640)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Klimaanpassung integriert</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">verschiebende Habitate einbezogen</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">nein — getrenntes Silo</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">ja — Kernkomponente</text>
    </g>
    <!-- Rij 10 -->
    <g transform="translate(0,720)">
      <rect width="440" height="80" fill="#fff" stroke="#d4d1ca"/>
      <rect x="440" width="490" height="80" fill="url(#rowA)" stroke="#d4d1ca"/>
      <rect x="930" width="550" height="80" fill="url(#rowB)" stroke="#d4d1ca"/>
      <text x="25" y="35" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">Auswanderung der Produktion</text>
      <text x="25" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a5263">nach Polen, Schweden, Kroatien, etc.</text>
      <text x="465" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7a1224">massenhaft und beschleunigend</text>
      <text x="955" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0e3d2e">gestoppt</text>
    </g>
  </g>

  <text x="800" y="975" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#6b7280">Quellen: ESB Juni 2026, PBL 2026, Erisman/WUR 2026, Rabobank Juni 2026, Agricycling Kooperative 2026, ministerieller Taskforce Stikstof Mai-Juni 2026</text>
</svg>
