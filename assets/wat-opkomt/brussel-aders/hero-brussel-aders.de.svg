<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgBA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#1a2440"/>
    </linearGradient>
    <linearGradient id="adGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3e9a5"/>
      <stop offset="100%" stop-color="#d4b95e"/>
    </linearGradient>
    <linearGradient id="adBlood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a1224"/>
      <stop offset="100%" stop-color="#ff5577"/>
    </linearGradient>
    <radialGradient id="organG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8d5b9"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </radialGradient>
    <radialGradient id="centerBlue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a4ba8"/>
      <stop offset="100%" stop-color="#001b66"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgBA)"/>

  <!-- Titel -->
  <text x="800" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#ffd700">Sie töten ihre Lebensadern</text>
  <text x="800" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#ffd8c8">sechs europäische Sektoren · eine Leitung · eine Autoimmunkrankheit</text>

  <!-- Centrum: Brussel (zieke immuunkern) -->
  <g transform="translate(800,500)">
    <circle cx="0" cy="0" r="120" fill="url(#centerBlue)" stroke="#ffd700" stroke-width="3"/>
    <!-- EU sterren-cirkel -->
    <g fill="#ffd700">
      <text x="0" y="-88" text-anchor="middle" font-size="18">★</text>
      <text x="44" y="-76" text-anchor="middle" font-size="18">★</text>
      <text x="76" y="-44" text-anchor="middle" font-size="18">★</text>
      <text x="88" y="0" text-anchor="middle" font-size="18">★</text>
      <text x="76" y="44" text-anchor="middle" font-size="18">★</text>
      <text x="44" y="76" text-anchor="middle" font-size="18">★</text>
      <text x="0" y="88" text-anchor="middle" font-size="18">★</text>
      <text x="-44" y="76" text-anchor="middle" font-size="18">★</text>
      <text x="-76" y="44" text-anchor="middle" font-size="18">★</text>
      <text x="-88" y="0" text-anchor="middle" font-size="18">★</text>
      <text x="-76" y="-44" text-anchor="middle" font-size="18">★</text>
      <text x="-44" y="-76" text-anchor="middle" font-size="18">★</text>
    </g>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffd700">BRUSSEL</text>
    <text x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffd8c8">EU-Leitung · der kranke Kern</text>
  </g>

  <!-- Zes aders die uit het centrum naar zes organen lopen — elk wordt doorgesneden -->
  <!-- We tekenen elke ader in twee delen: goud (gezond) van orgaan naar bijna-centrum, dan bloedrood vanaf bijtwond -->

  <!-- Orgaan 1: BOER (boven-links) -->
  <g transform="translate(200,200)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0e3d2e">BOER</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">voedsel</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">stikstof · uitkoop</text>
  </g>
  <!-- Ader van BOER (200,200) naar centrum (800,500) -->
  <line x1="245" y1="245" x2="500" y2="395" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="500" y1="395" x2="725" y2="465" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <!-- Wond-druppel -->
  <circle cx="500" cy="395" r="6" fill="#ff5577"/>

  <!-- Orgaan 2: INDUSTRIE (boven-midden) -->
  <g transform="translate(800,140)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">INDUSTRIE</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">staal · chemie</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">CBAM · ETS</text>
  </g>
  <line x1="800" y1="195" x2="800" y2="340" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="800" y1="340" x2="800" y2="380" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="800" cy="340" r="6" fill="#ff5577"/>

  <!-- Orgaan 3: MKB (boven-rechts) -->
  <g transform="translate(1400,200)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#0e3d2e">MKB</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">werk · innovatie</text>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">regeldruk · DAC9</text>
  </g>
  <line x1="1355" y1="245" x2="1100" y2="395" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="1100" y1="395" x2="875" y2="465" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="1100" cy="395" r="6" fill="#ff5577"/>

  <!-- Orgaan 4: ENERGIE (onder-links) -->
  <g transform="translate(200,800)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">ENERGIE</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">BiCRS · ethanol</text>
    <text x="0" y="-72" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">RED III · waterstof</text>
  </g>
  <line x1="245" y1="755" x2="500" y2="605" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="500" y1="605" x2="725" y2="535" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="500" cy="605" r="6" fill="#ff5577"/>

  <!-- Orgaan 5: KAPITAAL (onder-midden) -->
  <g transform="translate(800,860)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">KAPITAAL</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">vermogen</text>
    <text x="0" y="-72" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">Pillar Two · Box 3</text>
  </g>
  <line x1="800" y1="805" x2="800" y2="660" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="800" y1="660" x2="800" y2="620" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="800" cy="660" r="6" fill="#ff5577"/>

  <!-- Orgaan 6: UITVINDER (onder-rechts) -->
  <g transform="translate(1400,800)">
    <circle cx="0" cy="0" r="55" fill="url(#organG)" stroke="#0e3d2e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0e3d2e">UITVINDER</text>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#0e3d2e">patent · IP</text>
    <text x="0" y="-72" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd8c8">UPC · IP-richtlijn</text>
  </g>
  <line x1="1355" y1="755" x2="1100" y2="605" stroke="url(#adGold)" stroke-width="9" stroke-linecap="round"/>
  <line x1="1100" y1="605" x2="875" y2="535" stroke="url(#adBlood)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="1100" cy="605" r="6" fill="#ff5577"/>

  <!-- Onderschrift -->
  <text x="800" y="880" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ffd700">"Zes aders. Eén leiding. De Europese inwoner bloedt — niet door vreemden, maar door zijn eigen hart."</text>
</svg>
