<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#1a2440"/>
    </linearGradient>
    <linearGradient id="euBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#001b66"/>
    </linearGradient>
    <radialGradient id="bicrsGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d5b9"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </radialGradient>
    <radialGradient id="moneyDrain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e9a5"/>
      <stop offset="100%" stop-color="#8b6f10"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgB)"/>

  <!-- Titel -->
  <text x="800" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#ffd700">De anti-immuunziekte van Brussel maakt dat we arm worden</text>
  <text x="800" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#ff9999">CBAM, ETS en de minimumtax — drie aanvalslijnen tegelijk · de BiCRS-route wordt genegeerd</text>

  <!-- Linker: het EU-orgaan dat de aanval uitvoert -->
  <g transform="translate(80,170)">
    <!-- EU-cirkel met sterren als zieke immuuncel -->
    <g transform="translate(220,170)">
      <circle cx="0" cy="0" r="135" fill="url(#euBlue)" stroke="#ffd700" stroke-width="3"/>
      <!-- 12 sterren in cirkel -->
      <g fill="#ffd700">
        <text x="0" y="-100" text-anchor="middle" font-size="22">★</text>
        <text x="50" y="-87" text-anchor="middle" font-size="22">★</text>
        <text x="87" y="-50" text-anchor="middle" font-size="22">★</text>
        <text x="100" y="0" text-anchor="middle" font-size="22">★</text>
        <text x="87" y="50" text-anchor="middle" font-size="22">★</text>
        <text x="50" y="87" text-anchor="middle" font-size="22">★</text>
        <text x="0" y="100" text-anchor="middle" font-size="22">★</text>
        <text x="-50" y="87" text-anchor="middle" font-size="22">★</text>
        <text x="-87" y="50" text-anchor="middle" font-size="22">★</text>
        <text x="-100" y="0" text-anchor="middle" font-size="22">★</text>
        <text x="-87" y="-50" text-anchor="middle" font-size="22">★</text>
        <text x="-50" y="-87" text-anchor="middle" font-size="22">★</text>
      </g>
      <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffd700">BRUSSEL</text>
      <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ffd700">EU Commissie · ECON · Raad</text>
    </g>

    <text x="220" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff9999">DE ZIEKE LEIDING</text>

    <!-- Drie aanvalspijlen die de zieke EU uitstuurt -->
    <g stroke="#ff5577" stroke-width="3" fill="none">
      <path d="M 360 100 L 510 80" marker-end="url(#aroww)"/>
      <path d="M 360 170 L 510 170" marker-end="url(#aroww)"/>
      <path d="M 360 240 L 510 260" marker-end="url(#aroww)"/>
    </g>
  </g>

  <!-- Rechter: de drie aanvalslijnen + de slachtoffers -->
  <g transform="translate(610,170)">
    <text x="450" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ff9999">DE DRIE AANVALLEN — DE INWONER WORDT ARM</text>

    <!-- Lijn 1: CBAM -->
    <g transform="translate(0,75)">
      <rect width="900" height="60" fill="#1a0a14" stroke="#ff5577" stroke-width="2"/>
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#ffd8c8">1 · CBAM</text>
      <text x="20" y="45" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">€75,36/ton CO₂ op import · €2,1 mld per kwartaal · EU-export géén rebate</text>
      <text x="640" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ff8c8c" text-anchor="middle">→ industrie vertrekt</text>
    </g>

    <!-- Lijn 2: ETS -->
    <g transform="translate(0,160)">
      <rect width="900" height="60" fill="#1a0a14" stroke="#ff5577" stroke-width="2"/>
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#ffd8c8">2 · ETS</text>
      <text x="20" y="45" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">€60-€75/ton CO₂ · gratis allocatie naar 0% in 2034 · ETS2 voor wonen + transport per 2027</text>
      <text x="640" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ff8c8c" text-anchor="middle">→ alles wordt duurder</text>
    </g>

    <!-- Lijn 3: Pillar Two / belastingen -->
    <g transform="translate(0,245)">
      <rect width="900" height="60" fill="#1a0a14" stroke="#ff5577" stroke-width="2"/>
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#ffd8c8">3 · PILLAR TWO + VERMOGENSBELASTING</text>
      <text x="20" y="45" font-family="Georgia, serif" font-size="12" fill="#f5f0e6">15% minimum-tax sloopt nationale incentives · Box 3 op fictie · UTPR top-up · DAC9</text>
      <text x="640" y="35" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ff8c8c" text-anchor="middle">→ kapitaal vertrekt</text>
    </g>

    <!-- Onderaan: de genegeerde route -->
    <g transform="translate(0,335)">
      <rect width="900" height="100" fill="#0e3d2e" stroke="#2ea043" stroke-width="2.5"/>
      <text x="450" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#a8d5b9">DE ROUTE DIE BRUSSEL NEGEERT</text>
      <text x="20" y="50" font-family="Georgia, serif" font-size="13" fill="#f5f0e6"><tspan font-weight="700" fill="#f3e9a5">BiCRS / Bio-ethanol</tspan> — eigen koolstofkringloop, eigen energie,</text>
      <text x="20" y="68" font-family="Georgia, serif" font-size="13" fill="#f5f0e6">eigen voedingsbasis. Geen importafhankelijkheid. Geen CBAM nodig.</text>
      <text x="20" y="86" font-family="Georgia, serif" font-size="13" fill="#f5f0e6">RED III favoriseert echter waterstof — bio-ethanol uit voedselgewassen wordt uitgefaseerd.</text>
    </g>
  </g>

  <!-- Onderschrift -->
  <g transform="translate(80,720)">
    <rect width="1440" height="130" fill="#1a0a14" stroke="#ffd700" stroke-width="2"/>
    <text x="720" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ffd700">DE WAANZIN IN ÉÉN ZIN</text>
    <text x="720" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5f0e6">Brussel maakt eigen industrie €75 per ton CO₂ duurder, exporteurs krijgen géén rebate,</text>
    <text x="720" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5f0e6">15% minimum-tax sloopt nationale economische sturing, en de enige werkende eigen koolstofkringloop wordt genegeerd.</text>
    <text x="720" y="113" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ffd8c8">"De inwoner van Europa wordt arm gemaakt door zijn eigen leiding — niet door de buitenwereld."</text>
  </g>

  <defs>
    <marker id="aroww" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ff5577"/>
    </marker>
  </defs>
</svg>
