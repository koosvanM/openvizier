<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-edu">
  <title id="title-edu">Bekostiging onderwijs</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; fill: #1a1814; }
    .axis-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #4a463f; text-transform: uppercase; }
    .ink-fill { fill: #1a1814; }
    .accent-fill { fill: #8b1e1e; }
    .muted-fill { fill: #d8d2c4; }
    .ink { stroke: #1a1814; fill: none; }
    .muted { stroke: #7a766e; fill: none; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
    .header { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 700; fill: #1a1814; }
  </style>
  <rect width="800" height="400" fill="#faf7f2"/>
  
  <!-- Linker model: huidige -->
  <g transform="translate(100, 80)">
    <text class="header" x="100" y="0">Huidig model</text>
    <text class="axis-label" x="100" y="20" text-anchor="middle">Bekostiging per diploma</text>
    
    <!-- 100 lege "leerlingen" rijen -->
    <g transform="translate(0, 50)">
      <text class="label" x="-10" y="15" text-anchor="end">100 ×</text>
      <g>
        <!-- Reeks lichtgrijze cirkels (leerlingen die slagen met cijfer 6) -->
        <circle class="muted-fill" cx="10" cy="10" r="6"/>
        <circle class="muted-fill" cx="30" cy="10" r="6"/>
        <circle class="muted-fill" cx="50" cy="10" r="6"/>
        <circle class="muted-fill" cx="70" cy="10" r="6"/>
        <circle class="muted-fill" cx="90" cy="10" r="6"/>
        <circle class="muted-fill" cx="110" cy="10" r="6"/>
        <circle class="muted-fill" cx="130" cy="10" r="6"/>
        <circle class="muted-fill" cx="150" cy="10" r="6"/>
        <circle class="muted-fill" cx="170" cy="10" r="6"/>
        <text class="label" x="190" y="14">...</text>
      </g>
      <text class="label" x="100" y="50" text-anchor="middle" style="font-style: italic;">gemiddeld cijfer: 6</text>
      
      <!-- Geld-balk: hoog -->
      <text class="label" x="100" y="90" text-anchor="middle">→ subsidie</text>
      <rect class="accent-fill" x="20" y="100" width="160" height="20"/>
      <text class="label" x="200" y="115" text-anchor="start">100%</text>
    </g>
  </g>
  
  <!-- Rechter model: voorstel -->
  <g transform="translate(450, 80)">
    <text class="header" x="100" y="0">Voorstel</text>
    <text class="axis-label" x="100" y="20" text-anchor="middle">Bekostiging per cijfergewogen prestatie</text>
    
    <g transform="translate(0, 50)">
      <text class="label" x="-10" y="15" text-anchor="end">50 ×</text>
      <g>
        <!-- 5 sterke leerlingen — donkere cirkels -->
        <circle class="ink-fill" cx="10" cy="10" r="8"/>
        <circle class="ink-fill" cx="30" cy="10" r="8"/>
        <circle class="ink-fill" cx="50" cy="10" r="8"/>
        <circle class="ink-fill" cx="70" cy="10" r="8"/>
        <circle class="ink-fill" cx="90" cy="10" r="8"/>
        <text class="label" x="115" y="14">...</text>
      </g>
      <text class="label" x="100" y="50" text-anchor="middle" style="font-style: italic;">gemiddeld cijfer: 8</text>
      
      <!-- Geld-balk: hoger -->
      <text class="label" x="100" y="90" text-anchor="middle">→ subsidie</text>
      <rect class="accent-fill" x="20" y="100" width="200" height="20"/>
      <text class="label" x="240" y="115" text-anchor="start">125%</text>
    </g>
  </g>
  
  <!-- Pijl tussen -->
  <line class="muted" x1="320" y1="180" x2="430" y2="180" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon class="accent-fill" points="428,177 438,180 428,183"/>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="370" text-anchor="middle">Minder leerlingen met hogere prestaties leveren meer subsidie op dan veel leerlingen met lage cijfers</text>
</svg>
