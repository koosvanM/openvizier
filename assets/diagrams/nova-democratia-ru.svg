<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title-nova">
  <title id="title-nova">Nova Democratia — управление по темам</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; fill: #1a1814; }
    .header { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: #4a463f; text-transform: uppercase; }
    .sub-label { font-family: 'Inter', sans-serif; font-size: 9px; fill: #4a463f; }
    .ink { stroke: #1a1814; fill: none; }
    .accent { stroke: #4a90c8; fill: none; }
    .accent-fill { fill: #4a90c8; }
    .muted { stroke: #d8d2c4; fill: none; }
    .center-fill { fill: #1a1814; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
  </style>
  <rect width="800" height="480" fill="#faf7f2"/>
  
  <!-- Linker model: partijpolitiek (één blok, vele losse onderwerpen) -->
  <g transform="translate(150, 240)">
    <text class="header" x="0" y="-180" text-anchor="middle">Сейчас: пакетное голосование</text>
    <!-- Eén grote cirkel = de partij -->
    <circle class="ink" cx="0" cy="0" r="80" stroke-width="2"/>
    <text class="label" x="0" y="-3" text-anchor="middle">Партия</text>
    <text class="sub-label" x="0" y="14" text-anchor="middle">100 позиций</text>
    <!-- Lijnen die uit de bol komen — naar abstracte onderwerpen -->
    <g stroke-width="1" class="muted">
      <line x1="-60" y1="-50" x2="-110" y2="-90"/>
      <line x1="60" y1="-50" x2="110" y2="-90"/>
      <line x1="-80" y1="0" x2="-140" y2="0"/>
      <line x1="80" y1="0" x2="140" y2="0"/>
      <line x1="-60" y1="50" x2="-110" y2="90"/>
      <line x1="60" y1="50" x2="110" y2="90"/>
    </g>
    <text class="sub-label" x="-115" y="-95" text-anchor="end">здравоохранение</text>
    <text class="sub-label" x="115" y="-95" text-anchor="start">образование</text>
    <text class="sub-label" x="-145" y="3" text-anchor="end">энергетика</text>
    <text class="sub-label" x="145" y="3" text-anchor="start">юстиция</text>
    <text class="sub-label" x="-115" y="100" text-anchor="end">жильё</text>
    <text class="sub-label" x="115" y="100" text-anchor="start">оборона</text>
  </g>
  
  <!-- Rechter model: per onderwerp besluiten -->
  <g transform="translate(600, 240)">
    <text class="header" x="0" y="-180" text-anchor="middle">Предложение: по темам</text>
    <!-- 8 cirkels rondom een centrum, elk een onderwerp -->
    <g>
      <!-- 6 onderwerp-cirkels op cirkel -->
      <circle class="accent" cx="0" cy="-110" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="0" y="-107" text-anchor="middle">здравоохранение</text>
      <circle class="accent" cx="95" cy="-55" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="95" y="-52" text-anchor="middle">образование</text>
      <circle class="accent" cx="95" cy="55" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="95" y="58" text-anchor="middle">энергетика</text>
      <circle class="accent" cx="0" cy="110" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="0" y="113" text-anchor="middle">юстиция</text>
      <circle class="accent" cx="-95" cy="55" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="-95" y="58" text-anchor="middle">жильё</text>
      <circle class="accent" cx="-95" cy="-55" r="22" stroke-width="1.5"/>
      <text class="sub-label" x="-95" y="-52" text-anchor="middle">оборона</text>
      <!-- ... aanduiding -->
      <text class="sub-label" x="0" y="0" text-anchor="middle" style="font-size: 11px; font-style: italic; fill: #7a766e;">+ 18 других</text>
    </g>
  </g>
  
  <!-- Pijl tussen -->
  <line class="muted" x1="280" y1="240" x2="430" y2="240" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon class="accent-fill" points="427,236 437,240 427,244"/>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="440" text-anchor="middle">Вместо одного пакета: 24 области политики, каждая со своим решением и надзором</text>
</svg>
