<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-synth">
  <title id="title-synth">Красная нить — мышление потоками</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: #1a1814; font-weight: 600; }
    .sub-label { font-family: 'Source Serif 4', Georgia, serif; font-size: 11px; fill: #4a463f; font-style: italic; }
    .header { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: #4a463f; text-transform: uppercase; }
    .ink { stroke: #1a1814; fill: none; }
    .accent { stroke: #4a90c8; fill: none; }
    .accent-fill { fill: #4a90c8; }
    .ink-fill { fill: #1a1814; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
  </style>
  <rect width="800" height="400" fill="#faf7f2"/>
  
  <text class="header" x="400" y="40" text-anchor="middle">Четыре области — один принцип</text>
  
  <!-- Centrale cirkel: principe -->
  <circle class="ink-fill" cx="400" cy="200" r="60"/>
  <text class="label" x="400" y="195" text-anchor="middle" fill="#faf7f2">мышление</text>
  <text class="label" x="400" y="215" text-anchor="middle" fill="#faf7f2">потоками</text>
  
  <!-- Vier omringende cirkels -->
  <g>
    <!-- Boven: физика -->
    <circle class="accent" cx="400" cy="80" r="40" stroke-width="2" fill="#faf7f2"/>
    <text class="sub-label" x="400" y="75" text-anchor="middle" style="font-weight: 600;">физика</text>
    <text class="sub-label" x="400" y="90" text-anchor="middle">7D-мышление</text>
    <line class="accent" x1="400" y1="120" x2="400" y2="140" stroke-width="1.5"/>
    
    <!-- Rechts: политика -->
    <circle class="accent" cx="600" cy="200" r="40" stroke-width="2" fill="#faf7f2"/>
    <text class="sub-label" x="600" y="195" text-anchor="middle" style="font-weight: 600;">политика</text>
    <text class="sub-label" x="600" y="210" text-anchor="middle">по теме</text>
    <line class="accent" x1="560" y1="200" x2="540" y2="200" stroke-width="1.5"/>
    
    <!-- Onder: образование -->
    <circle class="accent" cx="400" cy="320" r="40" stroke-width="2" fill="#faf7f2"/>
    <text class="sub-label" x="400" y="315" text-anchor="middle" style="font-weight: 600;">образование</text>
    <text class="sub-label" x="400" y="330" text-anchor="middle">оценочно-взвешенное</text>
    <line class="accent" x1="400" y1="280" x2="400" y2="260" stroke-width="1.5"/>
    
    <!-- Links: техника -->
    <circle class="accent" cx="200" cy="200" r="40" stroke-width="2" fill="#faf7f2"/>
    <text class="sub-label" x="200" y="195" text-anchor="middle" style="font-weight: 600;">техника</text>
    <text class="sub-label" x="200" y="210" text-anchor="middle">биомимикрия</text>
    <line class="accent" x1="240" y1="200" x2="260" y2="200" stroke-width="1.5"/>
  </g>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="380" text-anchor="middle">Перестаньте мыслить категориями — начните мыслить потоками, масштабами и связями</text>
</svg>
