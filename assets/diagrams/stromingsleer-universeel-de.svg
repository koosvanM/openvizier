<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-flow">
  <title id="title-flow">Universelle Strömungen</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: #1a1814; font-weight: 600; }
    .sub-label { font-family: 'Source Serif 4', Georgia, serif; font-size: 11px; fill: #4a463f; font-style: italic; }
    .ink { stroke: #1a1814; fill: none; }
    .accent { stroke: #4a90c8; fill: none; }
    .accent-fill { fill: #4a90c8; }
    .ink-fill { fill: #1a1814; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
    .header { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: #4a463f; text-transform: uppercase; }
  </style>
  <rect width="800" height="400" fill="#faf7f2"/>
  
  <text class="header" x="400" y="40" text-anchor="middle">Vier Domänen — dieselben Gesetze</text>
  
  <!-- Luft over vleugel -->
  <g transform="translate(100, 130)">
    <text class="label" x="60" y="-30" text-anchor="middle">Luft</text>
    <text class="sub-label" x="60" y="-15" text-anchor="middle">um Flügel</text>
    <!-- Vleugelprofiel -->
    <path class="ink-fill" d="M 0,40 Q 30,20 80,30 Q 110,40 120,42 L 80,45 Q 30,50 0,45 Z"/>
    <!-- Stroomlijnen -->
    <path class="accent" d="M -10,15 Q 60,10 130,18" stroke-width="1.5"/>
    <path class="accent" d="M -10,30 Q 60,22 130,32" stroke-width="1.5"/>
    <path class="accent" d="M -10,55 Q 60,55 130,55" stroke-width="1.5"/>
    <polygon class="accent-fill" points="128,15 134,18 128,21"/>
    <polygon class="accent-fill" points="128,29 134,32 128,35"/>
    <polygon class="accent-fill" points="128,52 134,55 128,58"/>
  </g>
  
  <!-- Blut durch Ader -->
  <g transform="translate(280, 130)">
    <text class="label" x="60" y="-30" text-anchor="middle">Blut</text>
    <text class="sub-label" x="60" y="-15" text-anchor="middle">durch Ader</text>
    <!-- Ader: twee parallelle lijnen -->
    <line class="ink" x1="-10" y1="20" x2="130" y2="20" stroke-width="2"/>
    <line class="ink" x1="-10" y1="50" x2="130" y2="50" stroke-width="2"/>
    <!-- Vernauwing -->
    <line class="ink" x1="50" y1="20" x2="60" y2="32" stroke-width="2"/>
    <line class="ink" x1="80" y1="32" x2="90" y2="20" stroke-width="2"/>
    <line class="ink" x1="50" y1="50" x2="60" y2="38" stroke-width="2"/>
    <line class="ink" x1="80" y1="38" x2="90" y2="50" stroke-width="2"/>
    <!-- Stroming pijlen -->
    <line class="accent" x1="0" y1="35" x2="40" y2="35" stroke-width="1.5"/>
    <polygon class="accent-fill" points="38,32 42,35 38,38"/>
    <line class="accent" x1="60" y1="35" x2="80" y2="35" stroke-width="2"/>
    <polygon class="accent-fill" points="78,31 84,35 78,39"/>
    <line class="accent" x1="100" y1="35" x2="125" y2="35" stroke-width="1.5"/>
    <polygon class="accent-fill" points="123,32 127,35 123,38"/>
  </g>
  
  <!-- Geld durch Wirtschaft -->
  <g transform="translate(460, 130)">
    <text class="label" x="60" y="-30" text-anchor="middle">Geld</text>
    <text class="sub-label" x="60" y="-15" text-anchor="middle">durch Wirtschaft</text>
    <!-- Drie cirkels (sectoren) verbonden door pijlen -->
    <circle class="ink" cx="20" cy="20" r="14" stroke-width="1.5"/>
    <text class="sub-label" x="20" y="24" text-anchor="middle">A</text>
    <circle class="ink" cx="100" cy="20" r="14" stroke-width="1.5"/>
    <text class="sub-label" x="100" y="24" text-anchor="middle">B</text>
    <circle class="ink" cx="60" cy="55" r="14" stroke-width="1.5"/>
    <text class="sub-label" x="60" y="59" text-anchor="middle">C</text>
    <!-- Pijlen -->
    <line class="accent" x1="34" y1="20" x2="83" y2="20" stroke-width="1.5"/>
    <polygon class="accent-fill" points="82,17 88,20 82,23"/>
    <line class="accent" x1="92" y1="32" x2="71" y2="46" stroke-width="1.5"/>
    <polygon class="accent-fill" points="73,46 67,49 70,43"/>
    <line class="accent" x1="50" y1="46" x2="29" y2="32" stroke-width="1.5"/>
    <polygon class="accent-fill" points="32,33 25,30 31,28"/>
  </g>
  
  <!-- Plasma im Reaktor -->
  <g transform="translate(640, 130)">
    <text class="label" x="60" y="-30" text-anchor="middle">Plasma</text>
    <text class="sub-label" x="60" y="-15" text-anchor="middle">im Reaktor</text>
    <!-- Spiraalvormige stroom -->
    <path class="accent" d="M 60,5 
                            C 90,5 110,15 110,30 
                            C 110,45 70,55 30,50 
                            C 10,45 5,30 25,25 
                            C 50,20 90,30 90,40
                            C 90,50 50,55 30,50" 
          stroke-width="2"/>
    <polygon class="accent-fill" points="32,52 26,49 31,46"/>
  </g>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="280" text-anchor="middle" style="font-size: 14px;">Bernoulli, Reynolds, Poiseuille — gültig für Luft, Blut, Geld und Plasma</text>
  <text class="caption" x="400" y="320" text-anchor="middle">Wer eine Domäne versteht, sieht die anderen drei klarer.</text>
</svg>
