<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-7d">
  <title id="title-7d">The seven dimensions</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: #1a1814; }
    .axis-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: #4a463f; text-transform: uppercase; }
    .accent { stroke: #4a90c8; }
    .ink { stroke: #1a1814; }
    .muted { stroke: #7a766e; }
    .accent-fill { fill: #4a90c8; }
    .legend { font-family: 'Inter', sans-serif; font-size: 11px; fill: #4a463f; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
  </style>
  <!-- Background -->
  <rect width="800" height="400" fill="#faf7f2"/>
  
  <!-- Klassieke 4D (xyz + t) — links -->
  <g transform="translate(140, 200)">
    <text class="axis-label" x="0" y="-110" text-anchor="middle">Classical four dimensions</text>
    <!-- Drie assen ruimte -->
    <line class="ink" x1="0" y1="0" x2="80" y2="0" stroke-width="1.5"/>
    <line class="ink" x1="0" y1="0" x2="0" y2="-80" stroke-width="1.5"/>
    <line class="ink" x1="0" y1="0" x2="-50" y2="50" stroke-width="1.5"/>
    <polygon class="accent-fill" points="78,-3 86,0 78,3"/>
    <polygon class="accent-fill" points="3,-78 0,-86 -3,-78"/>
    <polygon class="accent-fill" points="-48,52 -56,55 -50,50"/>
    <text class="label" x="92" y="4">x</text>
    <text class="label" x="-2" y="-90">y</text>
    <text class="label" x="-62" y="60">z</text>
    <!-- Tijd-as als pijl rechts -->
    <line class="muted" x1="40" y1="60" x2="100" y2="60" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon class="accent-fill" points="98,57 106,60 98,63"/>
    <text class="label" x="110" y="64">t</text>
  </g>
  
  <!-- Pijl tussen oude en nieuwe -->
  <line class="muted" x1="280" y1="200" x2="340" y2="200" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon class="accent-fill" points="338,196 348,200 338,204"/>
  <text class="caption" x="310" y="190" text-anchor="middle">extend</text>
  
  <!-- Drie extra dimensies — rechts -->
  <g transform="translate(540, 200)">
    <text class="axis-label" x="0" y="-110" text-anchor="middle">Three new dimensions</text>
    
    <!-- G as: schaal -->
    <line class="accent" x1="-100" y1="-60" x2="100" y2="-60" stroke-width="2"/>
    <polygon class="accent-fill" points="98,-63 106,-60 98,-57"/>
    <circle class="accent-fill" cx="-90" cy="-60" r="2"/>
    <circle class="accent-fill" cx="-50" cy="-60" r="3"/>
    <circle class="accent-fill" cx="0" cy="-60" r="5"/>
    <circle class="accent-fill" cx="50" cy="-60" r="8"/>
    <circle class="accent-fill" cx="95" cy="-60" r="12"/>
    <text class="axis-label" x="-110" y="-58" text-anchor="end">G — scale</text>
    
    <!-- W as: antimaterie ↔ materie -->
    <line class="accent" x1="-100" y1="0" x2="100" y2="0" stroke-width="2"/>
    <polygon class="accent-fill" points="98,-3 106,0 98,3"/>
    <text class="label" x="-100" y="20" text-anchor="middle">−</text>
    <text class="label" x="0" y="20" text-anchor="middle">0</text>
    <text class="label" x="100" y="20" text-anchor="middle">+</text>
    <text class="axis-label" x="-110" y="3" text-anchor="end">W — value</text>
    
    <!-- N as: veelvoud -->
    <line class="accent" x1="-100" y1="60" x2="100" y2="60" stroke-width="2"/>
    <polygon class="accent-fill" points="98,57 106,60 98,63"/>
    <circle fill="none" class="accent" cx="-80" cy="60" r="6" stroke-width="1.5"/>
    <circle fill="none" class="accent" cx="-40" cy="60" r="6" stroke-width="1.5"/>
    <circle fill="none" class="accent" cx="0" cy="60" r="6" stroke-width="1.5"/>
    <circle fill="none" class="accent" cx="40" cy="60" r="6" stroke-width="1.5"/>
    <circle fill="none" class="accent" cx="80" cy="60" r="6" stroke-width="1.5"/>
    <text class="axis-label" x="-110" y="63" text-anchor="end">N — multiple</text>
  </g>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="370" text-anchor="middle">x, y, z, t remain — G, W and N are added</text>
</svg>
