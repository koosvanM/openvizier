<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-seaskin">
  <title id="title-seaskin">Werking van een antifouling-coating</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; fill: #1a1814; }
    .header { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: #4a463f; text-transform: uppercase; }
    .sub-label { font-family: 'Source Serif 4', Georgia, serif; font-size: 11px; fill: #4a463f; font-style: italic; }
    .ink { stroke: #1a1814; fill: none; }
    .accent { stroke: #4a90c8; fill: none; }
    .accent-fill { fill: #4a90c8; }
    .muted-fill { fill: #d8d2c4; }
    .ink-fill { fill: #1a1814; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
  </style>
  <rect width="800" height="400" fill="#faf7f2"/>
  
  <!-- Linker situatie: zonder coating -->
  <g transform="translate(80, 80)">
    <text class="header" x="160" y="0" text-anchor="middle">Zonder coating</text>
    <!-- Romp -->
    <rect class="ink-fill" x="0" y="160" width="320" height="40"/>
    <text class="sub-label" x="160" y="185" text-anchor="middle" fill="#faf7f2">scheepsromp</text>
    <!-- Aangroei (knobbeltjes) -->
    <circle class="muted-fill" cx="40" cy="155" r="8"/>
    <circle class="muted-fill" cx="80" cy="152" r="10"/>
    <circle class="muted-fill" cx="120" cy="156" r="7"/>
    <circle class="muted-fill" cx="170" cy="150" r="11"/>
    <circle class="muted-fill" cx="220" cy="155" r="9"/>
    <circle class="muted-fill" cx="270" cy="152" r="10"/>
    <text class="sub-label" x="160" y="135" text-anchor="middle">aangroei en zeepokken</text>
    <!-- Turbulente waterstroom -->
    <path class="accent" d="M -10,120 Q 30,100 50,130 Q 70,110 100,135 Q 130,105 160,130 Q 190,100 220,135 Q 260,105 290,130 Q 320,110 340,125" stroke-width="1.5"/>
    <text class="sub-label" x="160" y="80" text-anchor="middle" style="fill: #4a90c8;">turbulente stroming</text>
  </g>
  
  <!-- Rechter situatie: met SeaSkin -->
  <g transform="translate(450, 80)">
    <text class="header" x="160" y="0" text-anchor="middle">Met SeaSkin-coating</text>
    <!-- Coating bovenop romp -->
    <rect class="accent-fill" x="0" y="155" width="320" height="5"/>
    <rect class="ink-fill" x="0" y="160" width="320" height="40"/>
    <text class="sub-label" x="160" y="185" text-anchor="middle" fill="#faf7f2">scheepsromp</text>
    <text class="sub-label" x="-10" y="160" text-anchor="end" style="fill: #4a90c8;">coating</text>
    <!-- Geen aangroei — schoon -->
    <text class="sub-label" x="160" y="135" text-anchor="middle">schoon oppervlak</text>
    <!-- Laminaire stroming: parallelle lijnen -->
    <line class="accent" x1="-10" y1="100" x2="340" y2="100" stroke-width="1.5"/>
    <line class="accent" x1="-10" y1="115" x2="340" y2="115" stroke-width="1.5"/>
    <line class="accent" x1="-10" y1="130" x2="340" y2="130" stroke-width="1.5"/>
    <polygon class="accent-fill" points="338,97 344,100 338,103"/>
    <polygon class="accent-fill" points="338,112 344,115 338,118"/>
    <polygon class="accent-fill" points="338,127 344,130 338,133"/>
    <text class="sub-label" x="160" y="80" text-anchor="middle" style="fill: #4a90c8;">laminaire stroming</text>
  </g>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="370" text-anchor="middle">Een glad oppervlak op nano-schaal voorkomt aangroei — geen biocides, wel chemie</text>
</svg>
