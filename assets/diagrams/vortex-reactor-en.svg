<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title-vortex">
  <title id="title-vortex">Conical vortex reactor</title>
  <style>
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; fill: #1a1814; }
    .axis-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #4a463f; text-transform: uppercase; }
    .accent { stroke: #4a90c8; fill: none; }
    .ink { stroke: #1a1814; fill: none; }
    .muted { stroke: #7a766e; fill: none; }
    .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; font-style: italic; fill: #7a766e; }
    .accent-fill { fill: #4a90c8; }
  </style>
  <rect width="800" height="480" fill="#faf7f2"/>
  
  <!-- Trechter (cone) — doorsnede -->
  <g transform="translate(400, 100)">
    <!-- Buitenlijn van de cone -->
    <line class="ink" x1="-150" y1="0" x2="-30" y2="280" stroke-width="2"/>
    <line class="ink" x1="150" y1="0" x2="30" y2="280" stroke-width="2"/>
    <!-- Top (open) -->
    <line class="ink" x1="-150" y1="0" x2="150" y2="0" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Bottom (waar plasma uittreedt) -->
    <ellipse class="accent-fill" cx="0" cy="280" rx="30" ry="8"/>
    
    <!-- Vortex spiraal in de cone -->
    <path class="accent" d="M -120,30 
                             C -100,40 -60,45 -10,50 
                             C 60,55 110,50 100,80 
                             C 80,110 -40,100 -50,130
                             C -60,160 60,150 50,180 
                             C 40,210 -25,200 -20,230 
                             C -15,255 15,250 10,275" 
          stroke-width="2.5"/>
    
    <!-- Pijltjes op de spiraal die richting aangeven -->
    <polygon class="accent-fill" points="-8,52 -2,48 -4,55"/>
    <polygon class="accent-fill" points="48,180 52,176 52,184"/>
    
    <!-- Labels -->
    <text class="axis-label" x="-180" y="5" text-anchor="end">opening</text>
    <text class="axis-label" x="180" y="5" text-anchor="start">cooling</text>
    
    <text class="label" x="-200" y="100" text-anchor="end" style="font-style: italic;">plasma inlet</text>
    <line class="muted" x1="-170" y1="98" x2="-130" y2="80" stroke-width="1"/>
    
    <text class="label" x="200" y="180" text-anchor="start" style="font-style: italic;">rotation</text>
    <line class="muted" x1="170" y1="178" x2="100" y2="150" stroke-width="1"/>
    
    <text class="label" x="200" y="280" text-anchor="start" style="font-style: italic;">fusion zone</text>
    <line class="muted" x1="170" y1="278" x2="40" y2="280" stroke-width="1"/>
  </g>
  
  <!-- Onderschrift -->
  <text class="caption" x="400" y="440" text-anchor="middle">Plasma accelerates itself to the bottom — no magnetic cage needed</text>
  <text class="caption" x="400" y="460" text-anchor="middle">Concept: conical vortex reactor — schematic cross-section</text>
</svg>
