<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Schema gesloten kringloop biomimetische krachtcentrale">
  <defs>
    <radialGradient id="zon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c453"/>
      <stop offset="0.65" stop-color="#e09a2a"/>
      <stop offset="1" stop-color="#c0741a" stop-opacity="0"/>
    </radialGradient>
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c5760"/>
    </marker>
    <marker id="pijl-rood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a52d3a"/>
    </marker>
    <marker id="pijl-goud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4af37"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f5f0e3"/>

  <!-- titel -->
  <text x="600" y="40" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1a1a1a" font-weight="bold">De gesloten kringloop — isotherm, op kamertemperatuur</text>
  <text x="600" y="65" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#5a5a5a">Geen verbranding, geen gas-expansie, geen Carnot-verlies</text>

  <!-- ZON linksboven -->
  <circle cx="120" cy="180" r="68" fill="url(#zon)"/>
  <circle cx="120" cy="180" r="40" fill="#e09a2a"/>
  <text x="120" y="186" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#fff" font-weight="bold">Zon</text>

  <!-- LUCHT-CO2 + REGEN linksonder -->
  <g transform="translate(60,400)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#cde4ec" stroke="#1c5760" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1a1a1a" font-weight="bold">Lucht-CO₂ + H₂O</text>
  </g>

  <!-- CENTRAAL: BIOMIMETISCHE EENHEID -->
  <g transform="translate(380,140)">
    <rect x="0" y="0" width="440" height="320" rx="14" fill="#fbf6e9" stroke="#1c5760" stroke-width="3"/>
    <text x="220" y="36" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#1c5760" font-weight="bold">Biomimetische eenheid</text>

    <!-- vier stappen verticaal -->
    <g transform="translate(20,60)">
      <rect x="0" y="0" width="400" height="55" rx="6" fill="#d4af37" opacity="0.25" stroke="#a07c1a" stroke-width="1.5"/>
      <text x="20" y="22" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#7a5c0a" font-weight="bold">1 · Kunstmatige fotosynthese</text>
      <text x="20" y="42" font-family="Georgia, serif" font-size="12" fill="#1a1a1a">CO₂ + H₂O + foton naar suiker · plafond 15%</text>
    </g>

    <g transform="translate(20,128)">
      <rect x="0" y="0" width="400" height="55" rx="6" fill="#0d6068" opacity="0.18" stroke="#0d6068" stroke-width="1.5"/>
      <text x="20" y="22" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#0d4348" font-weight="bold">2 · MOF-membraan + katalysator</text>
      <text x="20" y="42" font-family="Georgia, serif" font-size="12" fill="#1a1a1a">Suiker-scheiding · selectiviteit &gt;99% · ion-programmeerbaar</text>
    </g>

    <g transform="translate(20,196)">
      <rect x="0" y="0" width="400" height="55" rx="6" fill="#a52d3a" opacity="0.18" stroke="#a52d3a" stroke-width="1.5"/>
      <text x="20" y="22" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#7a1f2a" font-weight="bold">3 · Moleculaire machine + DET</text>
      <text x="20" y="42" font-family="Georgia, serif" font-size="12" fill="#1a1a1a">Direct elektronen-transfer · ΔG/ΔH-grens benaderd</text>
    </g>

    <g transform="translate(20,264)">
      <rect x="0" y="0" width="400" height="40" rx="6" fill="#437a22" opacity="0.2" stroke="#1f4e10" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1f4e10" font-weight="bold">4 · Generator + warmte-recuperatie</text>
    </g>
  </g>

  <!-- STROOM rechts -->
  <g transform="translate(900,170)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#a52d3a" stroke="#7a1f2a" stroke-width="2"/>
    <text x="90" y="32" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#fff" font-weight="bold">Netstroom</text>
    <text x="90" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fbf6e9">86,4% elektrisch (2125)</text>
  </g>

  <!-- WARMTE rechts onder -->
  <g transform="translate(900,290)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#437a22" stroke="#1f4e10" stroke-width="2"/>
    <text x="90" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#fff" font-weight="bold">Nuttige warmte</text>
    <text x="90" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fbf6e9">10,9% (WKK)</text>
  </g>

  <!-- VOEDSEL + CO2-OPSLAG rechts onderaan -->
  <g transform="translate(900,390)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#d4af37" stroke="#7a5c0a" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1a1a1a" font-weight="bold">Voedsel · CO₂-opslag</text>
    <text x="90" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a1a1a">Netto CO₂-negatief</text>
  </g>

  <!-- PIJLEN -->
  <!-- zon naar eenheid -->
  <path d="M 175 200 Q 280 200 380 220" fill="none" stroke="#d4af37" stroke-width="4" marker-end="url(#pijl-goud)"/>
  <text x="280" y="195" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#7a5c0a">fotonen</text>

  <!-- CO2/H2O naar eenheid -->
  <path d="M 220 415 Q 320 380 380 380" fill="none" stroke="#1c5760" stroke-width="3" marker-end="url(#pijl)"/>

  <!-- eenheid naar stroom -->
  <path d="M 820 215 L 900 210" fill="none" stroke="#a52d3a" stroke-width="4" marker-end="url(#pijl-rood)"/>

  <!-- eenheid naar warmte -->
  <path d="M 820 320 L 900 320" fill="none" stroke="#437a22" stroke-width="3" marker-end="url(#pijl)" stroke-dasharray="0"/>

  <!-- eenheid naar voedsel -->
  <path d="M 820 420 L 900 420" fill="none" stroke="#d4af37" stroke-width="3" marker-end="url(#pijl-goud)"/>

  <!-- TERUGKOPPEL CO2: van rechts boven naar links onder (kringloop sluit) -->
  <path d="M 990 250 Q 1100 530 600 540 Q 220 540 140 470" fill="none" stroke="#1c5760" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#pijl)"/>
  <text x="600" y="565" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1c5760" font-weight="bold">Uitstoot-CO₂ wordt direct teruggevoerd — gesloten kringloop</text>

  <!-- isotherme markering -->
  <g transform="translate(380,500)">
    <rect x="0" y="0" width="440" height="36" rx="6" fill="#0f2a36"/>
    <text x="220" y="23" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#d4af37" font-weight="bold">Werkt op kamertemperatuur — geen Carnot-verlies</text>
  </g>
</svg>
