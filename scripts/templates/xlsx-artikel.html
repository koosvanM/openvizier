<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}} | {{UI_FORECAST}} | Het Open Vizier</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="{{AUTHOR}}">
  <link rel="canonical" href="{{CANONICAL}}">
  {{ALTERNATES}}
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Het Open Vizier">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{HERO_ABSOLUTE}}">
  <meta property="og:image:width" content="1672">
  <meta property="og:image:height" content="941">
  <meta property="article:published_time" content="{{PUBLICATION_DATE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{HERO_ABSOLUTE}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/xlsx-artikelen/article.css?v=20261002">
  <link rel="stylesheet" href="/assets/ov-nav.css">
  <link rel="stylesheet" href="/assets/deel-menu.css">
  <script defer src="/assets/menu-loader.js"></script>
  <script defer src="/assets/ov-nav.js"></script>
  <script defer src="/assets/deel-menu.js"></script>
  <script defer src="/assets/xlsx-artikelen/article.js"></script>
</head>
<body>
  <a class="skip" href="#article">{{UI_SKIP}}</a>
  <header class="newspaper">
    <a class="newspaper-name" href="/{{LANG}}/">Het Open Vizier</a>
    <p>{{UI_TAGLINE}}</p>
  </header>
  <nav class="article-languages" aria-label="{{UI_LANGUAGES}}"><strong class="article-languages__label">{{UI_LANGUAGES}}:</strong>{{LANGUAGE_LINKS}}</nav>
  <nav id="ov-nav-root" aria-label="{{UI_MENU}}"></nav>
  <main id="main">
    <div class="heading">
      <p class="rubric">{{UI_RUBRIC}}</p>
      <h1 id="article-title">{{TITLE}}</h1>
      <div id="subtitle">{{SUBTITLE}}</div>
      <div id="date">{{DATE}}</div>
    </div>
    <figure class="hero"><img id="hero" src="{{HERO}}" width="1672" height="941" alt="{{UI_HERO_ALT}}"><figcaption>{{UI_HERO_CAPTION}}</figcaption></figure>
    <div class="reading-layout">
      <aside class="contents"><details open><summary>{{UI_CONTENTS}}</summary><nav id="contents" aria-label="{{UI_TOC}}">{{TOC}}</nav></details></aside>
      <article id="article" aria-labelledby="article-title">{{BODY}}</article>
    </div>
  </main>
  <footer><a href="/{{LANG}}/">Het Open Vizier</a><a href="#main">{{UI_TOP}}</a><button id="theme" type="button" aria-label="{{UI_THEME_ARIA}}">{{UI_THEME}}</button></footer>
</body>
</html>
