    transition: background-color 180ms ease-out, color 180ms ease-out;
  }
  .ov-nav__item:hover { background:#f0ede4; color:#7a1f2b !important; }
  .ov-nav__item--current { color:#7a1f2b !important; border-bottom:2px solid #d4af37; }
  .ov-nav__item--fallback { color:#9ca3af !important; font-style:italic; }

  /* Dropdown — zachte fade + subtiele glide, geen snap-open */
  .ov-nav__dropdown { position:relative; display:inline-block; }
  .ov-nav__caret { font-size:0.8em; margin-left:0.15rem; opacity:0.6; }
  .ov-nav__submenu {
    position:absolute; top:100%; left:0; min-width:220px;
    background:#ffffff; border:1px solid #d4d1ca;
    box-shadow:0 8px 24px rgba(0,0,0,0.10);
    padding:0.4rem 0; z-index:1000; border-radius:4px;
    /* Startpositie: onzichtbaar, licht omhoog, geen interactie */
    opacity:0; visibility:hidden;
    transform: translateY(-4px);
    transition: opacity 180ms ease-out, transform 180ms ease-out, visibility 0s linear 180ms;
  }
  /* Buffer-strook direct onder het menu-item voorkomt "gap-flicker" */
  .ov-nav__dropdown::after {
    content:""; position:absolute; top:100%; left:0; right:0; height:8px;
    pointer-events:auto;
  }
  .ov-nav__dropdown:hover .ov-nav__submenu,
  .ov-nav__dropdown:focus-within .ov-nav__submenu {
    opacity:1; visibility:visible; transform: translateY(0);
    transition: opacity 180ms ease-out, transform 180ms ease-out, visibility 0s linear 0s;
  }

  .ov-nav__subitem {
    display:block; padding:0.55rem 1.1rem; color:#1a1a1a !important;
    text-decoration:none !important; font-size:0.94rem; font-weight:500; line-height:1.35;
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }
  .ov-nav__subitem:hover { background:#f5f3ee; color:#7a1f2b !important; }
  .ov-nav__subitem--fallback { color:#9ca3af !important; font-style:italic; }

  @media (max-width:720px) {
    .ov-nav__inner { padding:0.25rem 0.5rem; gap:0; }
    .ov-nav__item { padding:0.55rem 0.75rem; font-size:0.9rem; }
    .ov-nav__submenu {
      position:static; box-shadow:none; border:0; padding:0 0 0.35rem 1rem;
      min-width:0; background:transparent;
      /* Op mobiel geen fade/translate — gewoon direct tonen bij tap */
      opacity:1; visibility:visible; transform:none; transition:none;
      display:none;
    }
    .ov-nav__dropdown::after { display:none; }
    .ov-nav__dropdown:hover .ov-nav__submenu,
    .ov-nav__dropdown:focus-within .ov-nav__submenu { display:block; }
  }

  /* Respecteer 'reduced motion' — zet alle overgangen uit */
  @media (prefers-reduced-motion: reduce) {
    .ov-nav__item, .ov-nav__subitem, .ov-nav__submenu { transition:none !important; }
    .ov-nav__submenu { transform:none !important; }
  }

</fig<article class="wo-artikel">
  <p class="wo-artikel__meta">Palma, 5 de julho de 2026 · Análise político-económica · Edição 2 — Política fiscal</p>
  <h1 class="wo-artikel__titel">Decidir sem horizonte</h1>
  <p class="wo-artikel__subtitle">O PIB mente em € 419 mil milhões. O rácio da dívida não é 43%. É 69%. E o parlamento vota de olhos fechados.</p>
  <p class="wo-artikel__auteur">Jacobus van Merksteijn</p>

  <div class="wo-artikel__streep"></div>

  <div class="wo-artikel__infoblok">
    <ul>
      <li><strong>Autor</strong> --- Jacobus van Merksteijn</li>
      <li><strong>Data</strong> --- 5 de julho de 2026, Palma, Mallorca</li>
      <li><strong>Secção</strong> --- Análise político-económica · Edição 2 (Política fiscal) · com implicações bruxelenses</li>
      <li><strong>Fontes</strong> --- CBS Finanças Públicas 2024, Relatório Financeiro do Estado 2024, CBS Contas Nacionais 85879NED, CBS Renda imputada da habitação própria, OECD Revenue Statistics 2024 — Netherlands, Simon Kuznets, "National Income 1929–1932", 1934</li>
      <li><strong>Metodologia</strong> --- Correção do PIB relativamente a três rubricas contabilísticas não produtivas; recálculo do rácio da dívida e do défice da UE face à base produtiva</li>
    </ul>
  </div>

  <div class="wo-artikel__inhoud">
    <p class="wo-artikel__lead">A Tweede Kamer vota na sexta-feira com uma régua que foi esticada três vezes. Os Países Baixos têm uma dívida de € 492 mil milhões e são considerados fiscalmente disciplinados — afinal, o rácio da dívida é de 43,3% do PIB, bem abaixo do limite da UE de 60%. Retire-se desse PIB as três rubricas que não são produção — renda imputada, FISIM e o paradoxo das prestações sociais — e o verdadeiro rácio é de 69,3%. Muito acima do limiar de alerta da UE. A mesma dívida. O mesmo orçamento. Os mesmos ministros. Só que, se vissem isso, votariam de outra forma na sexta-feira. Não o veem. E é aí que está uma venda feita de folhas.</p>

    <h2>O que um ministro vê na sexta-feira</h2>
    <p>Nos rascunhos dos governantes há um número que decide tudo: 43,3%. É a dívida pública neerlandesa dividida pelo PIB dos Países Baixos em 2024. O Ministério das Finanças chama-lhe "o nível mais baixo desde a crise financeira de 2008". As agências de rating acenam afirmativamente. Bruxelas está tranquilizada. Os investidores não exigem prémio. Com base neste único número, serão gastos na sexta-feira € 20 mil milhões em margens de segurança, serão investidos € 450 milhões em armazenamento de hidrogénio sob Zuidwending e aumentada a contribuição para a UE sem que um único ministro se pergunte se os Países Baixos têm realmente a margem fiscal que o indicador sugere.</p>
    <p>A resposta: não têm. E isso não é controverso. Está nas tabelas publicadas. Só que ninguém as lê dessa forma.</p>

    <h2>As três rubricas que não são produção</h2>
    <p>O PIB neerlandês de 2024 ascende a € 1.128 mil milhões. Nele estão incluídas três rubricas que NÃO representam atividade produtiva — que não medem nada e, ainda assim, contam como produção:</p>

    <p><strong>€ 97 mil milhões — renda imputada da habitação própria.</strong> O CBS calcula o que os proprietários de habitação "hipoteticamente" pagam a si próprios como renda e acrescenta esse valor ao PIB. Ninguém recebe um pagamento. Nenhum serviço é prestado. Não há qualquer transação. É uma hipótese contabilística, consagrada desde 1993 no sistema internacional de contas. Em dez anos, esta rubrica aumentou de 6% para 8,6% do PIB — simplesmente porque os custos de habitação nos Países Baixos aumentam 3,5% por ano.</p>

    <p><strong>€ 40 mil milhões — FISIM.</strong> Serviços financeiros fictícios, calculados como a diferença entre as taxas de juro dos empréstimos e dos depósitos. Não há qualquer transação explícita; é um resultado de modelo que torna as contas nacionais coerentes. Quando o BCE aumentou acentuadamente as taxas de juro em 2022, o PIB neerlandês cresceu cerca de € 6 mil milhões em ar de FISIM — sem que tivesse sido prestado um único serviço financeiro adicional. Um crescimento que se torna mais espesso porque a vara de medição encolhe.</p>

    <p><strong>€ 282 mil milhões — o paradoxo das prestações sociais.</strong> As prestações sociais — subsídio de desemprego, assistência social, pensões do Estado — não contam como produção. Corretamente. Mas assim que o beneficiário gasta a prestação em compras ou renda, esse mesmo montante aparece na componente C do PIB (consumo das famílias). Efeito líquido: o desemprego em massa reduz o valor do PIB muito menos do que a realidade económica justificaria. Corrija-se pela verdadeira base produtiva e desaparecem mais € 282 mil milhões.</p>

    <p class="stinger">Subtraia estas três rubricas e restam € 709 mil milhões de prosperidade real, ligada à produção.</p>

    <p>Expressa face a essa base, a narrativa tranquilizadora desaparece num único movimento:</p>

    <table>
      <thead>
        <tr>
          <th>Indicador</th>
          <th class="num">Com base no PIB<br>(€ 1.128 mil milhões)</th>
          <th class="num">Com base no PIB corrigido<br>(€ 709 mil milhões)</th>
          <th class="num">Norma da UE</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Rácio da dívida</td><td class="num">43,3%</td><td class="num"><span class="highlight"><strong>69,3%</strong></span></td><td class="num">60%</td></tr>
        <tr><td>Rácio do défice</td><td class="num">0,90%</td><td class="num">1,42%</td><td class="num">3%</td></tr>
        <tr><td>Despesas públicas</td><td class="num">44,1%</td><td class="num">70,1%</td><td class="num">—</td></tr>
        <tr><td>Prestações sociais</td><td class="num">20,4%</td><td class="num">32,4%</td><td class="num">—</td></tr>
        <tr><td>Contribuição para a UE</td><td class="num">0,66%</td><td class="num">1,06%</td><td class="num">—</td></tr>
      </tbody>
    </table>

    <p>Os mesmos € 492 mil milhões de dívida. O mesmo défice de € 10 mil milhões. Os mesmos € 497 mil milhões de despesas públicas. Só muda o denominador — e, com o denominador, muda o panorama político.</p>

    <p>Para a série temporal de 2022–2024, o quadro é implacável: segundo a medida corrigida, os Países Baixos estiveram acima do limite de 60% durante três anos consecutivos (74,7% → 70,8% → 69,3%). Segundo o PIB oficial, estiveram igualmente abaixo dele durante todo esse período (48,3% → 45,1% → 43,3%). Dois países completamente diferentes. Uma só realidade.</p>

    <h2>Kuznets avisou em 1934</h2>
    <p>O PIB não se tornou assim por acaso. Foi concebido assim — por Simon Kuznets, na década de 1930, para poder medir a economia americana durante a Grande Depressão. O próprio Kuznets não tinha ilusões quanto ao alcance do seu instrumento. Escreveu literalmente, no relatório apresentado ao Congresso americano em 1934:</p>

    <blockquote>"The welfare of a nation can scarcely be inferred from a measurement of national income."</blockquote>

    <p>Essa frase foi ignorada. Depois de Bretton Woods (1944), o PIB tornou-se a medida-padrão internacional. Desde os Tratados de Maastricht de 1992, é a base das normas orçamentais da UE: 3% de défice, 60% de dívida — ambos como percentagem do PIB. Um tratado assinado por pessoas que aceitaram o instrumento tal como estava, sem consultar as notas de rodapé.</p>

    <p>Isso funciona enquanto o PIB medir efetivamente o que uma economia produz. Entretanto, foram incluídas três categorias de "produção" que não são produção. A renda imputada em 1993, para tornar comparáveis os países com muitos inquilinos e os países com muitos proprietários. O FISIM em 2010 à escala da UE, para resolver o problema técnico de os bancos prestarem serviços sem um preço explícito. Ambas as correções são defensáveis do ponto de vista contabilístico. Ambas são também montanhas de ar que são somadas às contas nacionais como produção e sobre as quais são posteriormente aplicadas as normas orçamentais da UE.</p>

    <p>A terceira — o paradoxo das prestações sociais — é a mais fundamental. Não é um erro de construção introduzido algures entre 1993 e 2010. Está no PIB desde o próprio Kuznets e nunca foi corrigido. Com 8% de desemprego — uma recessão normal — a diferença entre "o que os Países Baixos produziriam com pleno emprego" e "o que efetivamente produzem" é de cerca de € 90 mil milhões, segundo a fórmula clássica de Okun. No valor do PIB, no máximo € 30 mil milhões são visíveis. O restante é camuflado pelas despesas dos beneficiários de prestações sociais, que contam como consumo.</p>

    <p class="stinger">Com 98% de desemprego, o PIB neerlandês não cairia para zero.</p>

    <p>Isso não é uma experiência mental distante. É a extrapolação lógica da definição. A renda imputada permanece (os proprietários de habitação "pagam renda a si próprios"). O FISIM permanece (os bancos conservam as suas margens de juros). As prestações sociais são gastas e aparecem como C. O PIB continuaria a apresentar positivamente uma economia sem pessoas a trabalhar. Um ecossistema sem espécies não poderia obter uma pontuação de 60% num índice de natureza saudável. O PIB poderia.</p>

    <h2>O que um ministro não vê na sexta-feira</h2>
    <p>Quem sabe isto também sabe por que razão três factos político-económicos neerlandeses podem ocorrer simultaneamente sem que se veja neles qualquer contradição:</p>
    <ul>
      <li>Os Países Baixos afirmam ser fiscalmente disciplinados, com um rácio da dívida muito abaixo da norma da UE.</li>
      <li>Os Países Baixos recorrem a linhas de apoio da UE — fundo de recuperação, emissão conjunta de dívida, compra de obrigações pelo BCE — como se a posição fiscal fosse vulnerável.</li>
      <li>O CPB alerta anualmente para o "declínio do crescimento estrutural" e para a "erosão da base produtiva".</li>
    </ul>

    <p>No atual enquadramento do PIB, são três afirmações incompatíveis. Alguém está a mentir, e ninguém sabe quem. Segundo um PIB corrigido, são três descrições coerentes do mesmo facto subjacente: <strong>a posição fiscal neerlandesa já está acima do limiar de alerta da UE</strong>, mas isso é ocultado por um indicador que contabiliza € 419 mil milhões de ar contabilístico como produção.</p>

    <p>Para as políticas públicas, tudo isto é importante. Cada euro de margem para contrair empréstimos, cada plano orçamental, cada negociação sobre a contribuição para a UE, cada avaliação de rating assenta no pressuposto de que o PIB representa a dimensão da economia. Se esse pressuposto não for correto, nenhuma das decisões dele derivadas é correta. O pacote de margens de segurança de € 20 mil milhões assenta nesse pressuposto. O pacote do hidrogénio de € 450 milhões assenta nesse pressuposto. A contribuição para a UE assenta nesse pressuposto.</p>

    <p>Não há nenhum ministério que negue os números acima. Não há nenhum economista que conteste as rubricas — estão simplesmente nas tabelas do CBS StatLine 85879NED. Existe apenas um acordo coletivo para continuar a utilizar o indicador que foi acordado. Como um grupo de navegadores que sabe que a bússola está avariada, mas continua a navegar porque "acordámos a mesma bússola".</p>

    <div class="kader">
      <h3>A venda de folhas</h3>
      <p>Na ilustração principal deste artigo, há uma fila de ministros no banco do governo. Não usam uma venda preta. Usam uma venda feita de carvalho, loureiro, hera e tília. As folhas não são más; são até nobres. São aquilo que cresceu e que permaneceu verde. Mas, atadas sobre os olhos, tornam-se todas iguais: ausência de horizonte. E a mão continua levantada, a caneta assina, o botão é premido.</p>
      <p>Todo o instrumento utilizado sem se observar o que mede é uma venda. Mesmo quando é feito de materiais honrosos.</p>
    </div>

    <h2>O que a natureza sabe</h2>
    <p>A natureza trabalha com balanços equilibrados. Cada cadeia de carbono que, há trezentos milhões de anos, foi armazenada sob a forma de petróleo, gás e carvão, era uma solução para um problema atmosférico: a Terra libertou-se do excesso de CO₂ depositando-o nas camadas geológicas. A biosfera não falsifica a contabilidade. O que foi armazenado, está armazenado; o que é queimado regressa à atmosfera. Não existe nenhum átomo de carbono "imputado" que seja contabilizado porque "uma árvore hipoteticamente paga CO₂ a si própria".</p>

    <p>Uma política construída sobre uma medida que contabiliza € 419 mil milhões de ar como produção real não imita essas leis naturais. Reescreve-as. Uma economia não pode crescer encurtando a sua própria vara de medição, tal como uma floresta não cresce por definir mais amplamente os seus próprios anéis de crescimento. O que resta é a realidade física subjacente ao número — e essa realidade transmite, nos Países Baixos em 2026, um único sinal: a base produtiva está a erodir-se. O CPB sabe-o. O CBS publicou-o. O Ministério das Finanças tem as tabelas.</p>

    <p>Os ministros que olharem para estes números na sexta-feira deveriam perguntar-se o que a natureza já sabe há três mil milhões de anos: <strong>que um sistema que manipula a sua própria contabilidade não se mantém de pé por muito tempo.</strong> Os ecossistemas que camuflam a medição dos seus próprios recursos entram em colapso. As empresas que alargam a definição das suas próprias receitas vão à falência — com ou sem agência de rating. Os países que alargam a definição da sua própria produção perdem, a certa altura, a credibilidade que tinham no papel. Não porque o mercado "se torne irracional". Porque a realidade subjacente ao indicador espera pacientemente até que alguém olhe.</p>

    <h2>O que deveria acontecer na sexta-feira</h2>
    <p>O que deveria acontecer na sexta-feira na Tweede Kamer não é complicado. Não é caro. Não custa nada. Um ministro poderia baixar a mão e pedir uma única coisa: <em>publique-se, ao lado dos 43,3% oficiais, também o rácio da dívida corrigido de 69,3%, nos mesmos documentos orçamentais, na mesma página, com as mesmas referências às fontes.</em> Não porque um substitua o outro. Mas porque, então, o parlamento saberia sobre o que está a votar.</p>

    <p>O que acontecerá na sexta-feira na realidade também sabemos. Haverá uma votação. A mão levantar-se-á. A caneta assinará. O botão será premido. O painel de votação iluminar-se-á — parcialmente verde, parcialmente vermelho, em padrões que ninguém conseguirá ver através das vendas. Kuznets viu-o em 1934. A natureza sempre o viu. Os Países Baixos continuam sem o ver em 2026.</p>

    <p class="stinger">A venda não é preta. É verde. E está apertada.</p>
