name: Auto-post new articles (Mastodon + LinkedIn)

on:
  push:
    branches:
      - main
    paths:
      - 'nl/wat-opkomt/**.html'
      - 'nl/editie-*/**.html'
      - 'de/was-aufkommt/**.html'
      - 'de/ausgabe-*/**.html'
      - 'en/what-surfaces/**.html'
      - 'en/edition-*/**.html'
      - 'ru/chto-vsplyvaet/**.html'
      - 'ru/vypusk-*/**.html'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write  # to commit .posted.json updates back

concurrency:
  group: auto-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for Netlify deploy
        if: github.event_name == 'push'
        run: |
          echo "Waiting 120 seconds for Netlify deploy to complete..."
          sleep 120

      - name: Run auto-post
        env:
          # Mastodon (all 4 languages)
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          # LinkedIn native (NL + EN only)
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          # LinkedIn via Buffer/Zapier (fallback)
          BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
          # Common
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://openvizier.org' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '6' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          python scripts/auto_post.py

      - name: Commit updated .posted.json
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet .posted.json 2>/dev/null; then
            echo "No state changes to commit."
          else
            git config user.name "openvizier-autopost[bot]"
            git config user.email "autopost@openvizier.org"
            git add .posted.json
            git commit -m "Auto-post: update posted state [skip ci]"
            git push origin HEAD:main
          fi
