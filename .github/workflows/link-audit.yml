name: Link-audit

# Loopt bij elke push naar main + handmatig via GitHub UI.
# Eerst auto-fix: bekende slug-mismatches worden direct gerepareerd en
# teruggecommit. Daarna audit: als er onopgeloste fouten resteren, faalt de
# workflow zodat ze zichtbaar worden.

"on":
  push:
    branches: [main]
  workflow_dispatch:  # handmatig trigger via GitHub UI
  schedule:
    # Wekelijks (maandag 06:00 UTC = ma 07:00 Madrid winter / 08:00 zomer)
    - cron: '0 6 * * 1'

permissions:
  contents: write  # nodig om auto-fixes terug te committen

jobs:
  link-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # volledige geschiedenis voor commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto-fix
        id: autofix
        run: |
          python3 tools/link_fix.py --json /tmp/fix-rapport.json
          # Tel aantal gewijzigde bestanden
          fixes_toegepast=$(python3 -c "import json; print(json.load(open('/tmp/fix-rapport.json'))['fixes_toegepast'])")
          onopgelost=$(python3 -c "import json; print(len(json.load(open('/tmp/fix-rapport.json'))['onopgelost']))")
          echo "fixes_toegepast=$fixes_toegepast" >> $GITHUB_OUTPUT
          echo "onopgelost=$onopgelost" >> $GITHUB_OUTPUT

      - name: Commit auto-fixes (if any)
        if: steps.autofix.outputs.fixes_toegepast != '0' && github.event_name != 'pull_request'
        run: |
          git config user.name "OpenVizier Link-Audit Bot"
          git config user.email "actions@openvizier.org"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-fix: ${{ steps.autofix.outputs.fixes_toegepast }} broken links gerepareerd via slug-cluster-mapping [skip ci]"
            git push
          fi

      - name: Run audit (final check)
        run: |
          python3 tools/link_audit.py --json /tmp/audit-rapport.json

      - name: Upload audit-rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-rapport
          path: /tmp/audit-rapport.json
          retention-days: 30

      - name: Fail als er onopgeloste fouten zijn
        if: steps.autofix.outputs.onopgelost != '0'
        run: |
          echo "::error::${{ steps.autofix.outputs.onopgelost }} onopgeloste broken links."
          echo "Auto-fix kon ze niet repareren — voeg de slug toe aan tools/slug_clusters.json"
          echo "of corrigeer de bron-pagina handmatig."
          python3 tools/link_audit.py
          exit 1
